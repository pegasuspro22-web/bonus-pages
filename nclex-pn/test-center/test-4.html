<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation Test 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#2a2419; --paper:#faf7f1; --raised:#ffffff; --line:#e6ddc9;
  --accent:#2f6f9e; --accent-ink:#ffffff; --alert:#b9791f; --alert-soft:#fbeed7;
  --danger:#b1483a; --correct:#3f9463; --muted:#5f574a; --muted-2:#7c7364;
  --shadow: 0 1px 2px rgba(42,36,25,.05), 0 10px 28px -14px rgba(42,36,25,.18);
}
*{box-sizing:border-box;}
body{background:var(--paper); color:var(--ink); font-family:'Public Sans',system-ui,sans-serif; margin:0; line-height:1.5; font-size:16.5px;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0; letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:inherit;} button{font-family:inherit; cursor:pointer;}
.page{max-width:640px; margin:0 auto; padding:3rem clamp(1.25rem,5vw,2rem) 4rem;}
.page.wide{max-width:880px;}
.back-link{font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--muted-2); text-decoration:none; display:inline-block; margin-bottom:1.5rem;}
.hero{text-align:center;}
.hero .eyebrow{display:flex; justify-content:center;}
.hero .lede{max-width:520px; margin-left:auto; margin-right:auto;}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600;}
.lede{color:var(--muted); font-size:1.05rem; line-height:1.6; margin-top:.9rem;}
.cta{
  display:inline-flex; align-items:center; gap:.5rem; background:var(--accent); color:var(--accent-ink);
  padding:1.05rem 2.1rem; border-radius:999px; font-weight:800; font-size:1rem; text-decoration:none; border:none;
  text-transform:uppercase; letter-spacing:.03em;
  box-shadow:0 6px 18px -4px color-mix(in srgb, var(--accent) 55%, transparent);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cta:hover{transform:translateY(-2px); box-shadow:0 10px 22px -4px color-mix(in srgb, var(--accent) 65%, transparent);}
.cta.ghost{background:var(--raised); color:var(--ink); border:2px solid var(--line); box-shadow:var(--shadow);}
.cta.ghost:hover{border-color:var(--accent); color:var(--accent);}
.cta.big{padding:1.25rem 2.6rem; font-size:1.08rem;}
.cta-wrap{display:flex; justify-content:center; align-items:center; margin-top:1.75rem; flex-direction:column; gap:.75rem;}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin:1.75rem 0;}
.stat{background:var(--raised); padding:1.1rem 1rem;}
.stat .n{font-family:'Fraunces',serif; font-size:1.9rem; font-weight:600;}
.stat .l{font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); margin-top:.2rem;}
.card-list{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line); margin-top:1.5rem;}
.card{padding:1.25rem 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:1.5rem; align-items:center;}
.card h3{font-size:1.05rem; font-weight:600; font-family:'Public Sans',sans-serif;}
.card p{color:var(--muted); font-size:.94rem; margin:.35rem 0 0; line-height:1.55;}
.tag{font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); background:var(--raised); border:2px solid var(--line); padding:.5rem .9rem; border-radius:999px; white-space:nowrap; text-decoration:none;}
.tag:hover{border-color:var(--accent);}
.step-list{counter-reset:step; margin:1.75rem 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:1.1rem;}
.step-list li{counter-increment:step; display:flex; gap:1rem; align-items:flex-start;}
.step-list li::before{
  content:counter(step); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.85rem;
  background:var(--ink); color:var(--paper); width:1.6rem; height:1.6rem; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:.1rem;
}
.step-list h3{font-size:1rem; font-weight:700; font-family:'Public Sans',sans-serif;}
.step-list p{color:var(--muted); font-size:.95rem; margin:.25rem 0 0; line-height:1.6;}
.action-block{margin-top:.9rem; display:flex; flex-wrap:wrap; align-items:center; gap:.7rem;}
.subject-chip{font-family:'IBM Plex Mono',monospace; font-size:.82rem; background:var(--paper); border:1.5px dashed var(--line); border-radius:8px; padding:.6rem .9rem; color:var(--ink);}
.subject-chip b{color:var(--accent);}
.callout{background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:1.75rem; box-shadow:var(--shadow); margin-top:1.75rem;}
.callout.alert{border-color:var(--alert); background:var(--alert-soft);}
.foot{margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--line); color:var(--muted-2); font-size:.78rem; line-height:1.6;}
.faq dt{font-weight:700; margin-top:1.1rem;}
.faq dd{margin:.35rem 0 0; color:var(--muted); font-size:.95rem; line-height:1.6;}
@media (max-width:520px){
  .card{flex-direction:column; align-items:flex-start; gap:.6rem;}
  .card > a.tag{align-self:stretch; text-align:center;}
}

.quiz-head{display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:1.25rem;}
.progress{font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--muted);}
.qcard{border:1px solid var(--line); border-radius:8px; padding:1.4rem; margin-top:1.25rem; background:var(--raised); box-shadow:var(--shadow);}
.qn{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--muted-2); display:flex; justify-content:space-between;}
.qtext{margin-top:.6rem; font-size:1rem; line-height:1.55; white-space:pre-wrap;}
.domain-pill{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.04em; text-transform:uppercase; background:var(--paper); border:1px solid var(--line); padding:.2rem .55rem; border-radius:3px; color:var(--muted);}
.opts{display:flex; flex-direction:column; gap:.55rem; margin-top:1.1rem;}
.opt{display:flex; gap:.7rem; align-items:flex-start; border:1px solid var(--line); border-radius:6px; padding:.65rem .8rem; font-size:.92rem; line-height:1.45;}
.opt input{margin-top:.25rem;} .letter{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--muted-2);}
.opt.correct{border-color:var(--correct); background:color-mix(in srgb, var(--correct) 14%, var(--raised));}
.opt.wrong{border-color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, var(--raised));}
.quiz-actions{display:flex; justify-content:center; margin-top:2rem; gap:.75rem;}
.score-panel{border:1px solid var(--line); border-radius:8px; padding:1.5rem; background:var(--raised); margin-top:1.25rem; box-shadow:var(--shadow);}
.score-big{font-family:'Fraunces',serif; font-size:2.4rem; font-weight:600;}
.domain-bars{display:flex; flex-direction:column; gap:.5rem; margin-top:1.25rem;}
.dbar-row{display:grid; grid-template-columns:minmax(120px,200px) 1fr 3.2rem; gap:.6rem; align-items:center; font-size:.82rem;}
.dbar-track{height:8px; background:var(--paper); border:1px solid var(--line); border-radius:4px; overflow:hidden;}
.dbar-fill{height:100%; background:var(--correct);}
.dname{color:var(--muted);} .dpct{font-family:'IBM Plex Mono',monospace; text-align:right; color:var(--muted-2);}
</style>
</head>
<body>

<div class="page wide">
  <div class="quiz-head">
    <div><div class="eyebrow">Self-hosted · no rationales shown</div><h1 style="font-size:1.5rem;">Simulation Test 4</h1></div>
    <span class="progress" id="quiz-progress"></span>
  </div>
  <div id="quiz-body"></div>
  <div class="quiz-actions">
    <button class="cta ghost" id="btn-reset" style="display:none;">Restart</button>
    <button class="cta" id="btn-submit">Submit test</button>
  </div>
  <div id="score-area"></div>
</div>
<script>
function runQuiz(questions, domainOrder){
  const body = document.getElementById('quiz-body');
  const answers = {};
  questions.forEach(function(q){
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = '<div class="qn"><span>Question ' + q.n + ' / ' + questions.length + '</span><span class="domain-pill">' + (q.domain||'') + '</span></div><div class="qtext"></div><div class="opts"></div>';
    card.querySelector('.qtext').textContent = q.q;
    const opts = card.querySelector('.opts');
    ['a','b','c','d'].forEach(function(letter){
      const label = document.createElement('label');
      label.className = 'opt';
      label.dataset.letter = letter.toUpperCase();
      label.innerHTML = '<input type="radio" name="q' + q.n + '" value="' + letter.toUpperCase() + '"><span><span class="letter">' + letter.toUpperCase() + '.</span> <span class="opttext"></span></span>';
      label.querySelector('.opttext').textContent = q[letter];
      label.querySelector('input').addEventListener('change', function(){ answers[q.n] = letter.toUpperCase(); updateProgress(); });
      opts.appendChild(label);
    });
    body.appendChild(card);
  });
  function updateProgress(){
    document.getElementById('quiz-progress').textContent = Object.keys(answers).length + ' / ' + questions.length + ' answered';
  }
  updateProgress();
  document.getElementById('btn-submit').addEventListener('click', function(){
    let correct = 0;
    const byDomain = {};
    questions.forEach(function(q){
      const given = answers[q.n];
      const isCorrect = given === q.correct;
      if(isCorrect) correct++;
      const d = q.domain || 'Other';
      byDomain[d] = byDomain[d] || {correct:0,total:0};
      byDomain[d].total++;
      if(isCorrect) byDomain[d].correct++;
      const card = document.querySelectorAll('.qcard')[q.n-1];
      card.querySelectorAll('.opt').forEach(function(opt){
        opt.querySelector('input').disabled = true;
        if(opt.dataset.letter === q.correct) opt.classList.add('correct');
        else if(opt.dataset.letter === given) opt.classList.add('wrong');
      });
    });
    const pct = Math.round((correct/questions.length)*100);
    const scoreArea = document.getElementById('score-area');
    let bars = '';
    domainOrder.filter(function(d){return byDomain[d];}).forEach(function(d){
      const s = byDomain[d];
      const p = Math.round((s.correct/s.total)*100);
      bars += '<div class="dbar-row"><span class="dname">' + d + '</span><div class="dbar-track"><div class="dbar-fill" style="width:' + p + '%"></div></div><span class="dpct">' + s.correct + '/' + s.total + '</span></div>';
    });
    scoreArea.innerHTML = '<div class="score-panel"><div class="eyebrow">Result \u2014 no rationales shown, readiness signal only</div><div class="score-big">' + correct + ' / ' + questions.length + ' <span style="font-size:1.1rem; color:var(--muted); font-family:\'Public Sans\',sans-serif; font-weight:500;">(' + pct + '%)</span></div><div class="domain-bars">' + bars + '</div></div>';
    document.getElementById('btn-submit').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'inline-flex';
    scoreArea.scrollIntoView({behavior:'smooth', block:'nearest'});
  });
  document.getElementById('btn-reset').addEventListener('click', function(){ window.location.reload(); });
}

runQuiz([{"n": 1, "q": "The practical nurse has just received report on four clients. Which client should the nurse assess first?\n\nA. A client with chronic obstructive pulmonary disease whose oxygen saturation is 91%, the same as earlier today\nB. A client with a urinary tract infection who has a temperature of 100.4°F (38°C)\nC. A client 6 hours after thyroid surgery who reports a feeling of neck tightness and difficulty swallowing\nD. A client with a pressure injury who needs a scheduled dressing change", "a": "A client with chronic obstructive pulmonary disease whose oxygen saturation is 91%, the same as earlier today", "b": "A client with a urinary tract infection who has a temperature of 100.4°F (38°C)", "c": "A client 6 hours after thyroid surgery who reports a feeling of neck tightness and difficulty swallowing", "d": "A client with a pressure injury who needs a scheduled dressing change", "correct": "C", "domain": "Coordinated Care"}, {"n": 2, "q": "A client is being transferred from a medical unit to a rehabilitation facility. Which information is most essential for the practical nurse to include in the transfer report to promote continuity of care?\n\nA. The names of staff members who cared for the client during this admission\nB. The client's current functional status, mobility limitations, recent vital sign trends, medications, and ongoing care needs\nC. The client's opinion about hospital food and sleep quality\nD. A detailed summary of every normal laboratory value since admission", "a": "The names of staff members who cared for the client during this admission", "b": "The client's current functional status, mobility limitations, recent vital sign trends, medications, and ongoing care needs", "c": "The client's opinion about hospital food and sleep quality", "d": "A detailed summary of every normal laboratory value since admission", "correct": "B", "domain": "Coordinated Care"}, {"n": 3, "q": "A UAP reports that a client refused a scheduled bath and became tearful when encouraged. What should the practical nurse do next?\n\nA. Tell the UAP to insist because hygiene is required\nB. Ask the UAP to chart that the client was noncompliant\nC. Assess the client to explore the reason for refusal and determine whether further intervention is needed\nD. Cancel all hygiene care for the rest of the day", "a": "Tell the UAP to insist because hygiene is required", "b": "Ask the UAP to chart that the client was noncompliant", "c": "Assess the client to explore the reason for refusal and determine whether further intervention is needed", "d": "Cancel all hygiene care for the rest of the day", "correct": "C", "domain": "Coordinated Care"}, {"n": 4, "q": "A practical nurse in an assisted-living facility is notified of these client situations. Which client should the nurse assess first?\n\nA. A client with type 2 diabetes who is sweating, shaky, and has a capillary blood glucose of 54 mg/dL\nB. A client with chronic obstructive pulmonary disease who asks for the next scheduled inhaler treatment in 30 minutes\nC. A client with rheumatoid arthritis who reports morning hand stiffness rated 6/10\nD. A client with constipation who has not had a bowel movement in 2 days and requests a laxative", "a": "A client with type 2 diabetes who is sweating, shaky, and has a capillary blood glucose of 54 mg/dL", "b": "A client with chronic obstructive pulmonary disease who asks for the next scheduled inhaler treatment in 30 minutes", "c": "A client with rheumatoid arthritis who reports morning hand stiffness rated 6/10", "d": "A client with constipation who has not had a bowel movement in 2 days and requests a laxative", "correct": "A", "domain": "Coordinated Care"}, {"n": 5, "q": "A practical nurse is part of a team trying to reduce specimen collection errors in a clinic. The team plans to try a new labeling step with one staff member during the afternoon shift for 3 days before using it clinic-wide. What is the best reason for this approach?", "a": "It allows the team to test the change on a small scale before broader implementation", "b": "It guarantees the new process will eliminate all labeling errors", "c": "It replaces the need to collect data after the change is started", "d": "It ensures the change will work the same way on every shift", "correct": "A", "domain": "Coordinated Care"}, {"n": 6, "q": "A client who signed consent for an elective colonoscopy asks the nurse, “What happens if I choose not to have this today?” Which response is best?", "a": "You have the right to refuse, and the provider should discuss the possible consequences and other options with you", "b": "Because you already signed, refusing now would require court approval", "c": "If you refuse, the facility can discharge you for noncompliance", "d": "Once the IV is started, refusal is no longer allowed", "correct": "A", "domain": "Coordinated Care"}, {"n": 7, "q": "A long-term care unit wants to reduce skin tears during evening care. Before changing supplies or routines, the team reviews incident reports from the past 3 months and notices that many skin tears occur when adhesive dressings are removed. Which action is the best next step in the quality improvement process?", "a": "Implement a facility-wide policy requiring daily wound specialist rounds", "b": "Test a gentler adhesive-removal technique with a small group of residents and track skin tear rates", "c": "Counsel the staff members who reported the highest number of skin tears", "d": "Stop using all adhesive dressings on the unit immediately", "correct": "B", "domain": "Coordinated Care"}, {"n": 8, "q": "A client with chronic kidney disease is being discharged with a new low-potassium diet. The practical nurse has completed teaching. Which action best evaluates whether the teaching was effective?", "a": "Ask the client whether the instructions seemed clear", "b": "Give the client a printed list of foods to review at home", "c": "Have the client choose a meal from several options and explain why it fits the diet", "d": "Ask the family member if the client usually follows diet instructions", "correct": "C", "domain": "Coordinated Care"}, {"n": 9, "q": "A client with hearing impairment is scheduled for a procedure requiring informed consent. The client uses hearing aids and reads written information well. Which nursing action best supports valid consent?", "a": "Remove the hearing aids to limit distraction during the explanation", "b": "Rely only on the client's nodding because it shows agreement", "c": "Ensure communication aids are available and that the client can receive and ask about the explanation", "d": "Ask a family member to decide whether the client understood enough to sign", "correct": "C", "domain": "Coordinated Care"}, {"n": 10, "q": "A practical nurse is preparing a client for transfer to a rehabilitation facility. The client's spouse is at the bedside and says, \"I need a copy of the medication list and discharge plan so I can help at home.\" The client is alert and says, \"Please give my spouse whatever is needed.\" What should the nurse do next?", "a": "Provide the information needed for continuity of care because the client gave permission", "b": "Refuse to share any information until the spouse shows legal power of attorney", "c": "Ask the spouse to wait until after transfer because discharge information cannot be shared on the unit", "d": "Share only the medication names, but not the discharge plan, because treatment details are always private", "correct": "A", "domain": "Coordinated Care"}, {"n": 11, "q": "A practical nurse in a community clinic cares for a pregnant 16-year-old client accompanied by an adult partner who refuses to leave the exam room. The client avoids eye contact, has a healing wrist injury, and becomes tearful when asked general safety questions. The partner answers for the client and says, \"She gets confused, so just ask me.\" What is the nurse's best next action to support possible mandatory reporting needs?", "a": "Ask more detailed questions about the injury with the partner present so the history can be compared immediately", "b": "Arrange to speak with the client alone in a private setting and continue the assessment", "c": "End the visit quickly to avoid escalating the partner's behavior in the clinic", "d": "Tell the partner that a report will be filed now because the situation appears suspicious", "correct": "B", "domain": "Coordinated Care"}, {"n": 12, "q": "A practical nurse is updating a client care whiteboard in a semiprivate room. Which information is most appropriate to write on the board to support care while protecting confidentiality?", "a": "The client's full diagnosis and planned procedure time", "b": "The client's medication schedule and most recent laboratory results", "c": "The nurse's name, the date, and the day's mobility goal", "d": "The client's insurance status and expected discharge destination", "correct": "C", "domain": "Coordinated Care"}, {"n": 13, "q": "During admission, an alert adult client says, \"I completed an advance directive a few years ago, but I forgot to bring it with me.\" What is the nurse's most appropriate action?", "a": "Ask the client to summarize the document and enter the summary in the chart as the legal directive", "b": "Document that the client reports having an advance directive and ask the client or family to provide a copy for the record", "c": "Tell the client the prior directive cannot be considered unless a new one is completed in the hospital", "d": "Delay admission care until the advance directive is brought to the unit", "correct": "B", "domain": "Coordinated Care"}, {"n": 14, "q": "Near the end of a shift, a practical nurse realizes that a medication was administered 45 minutes late because the dose had been stored in the wrong drawer. The client remains stable and reports no symptoms. The nurse is worried about disciplinary action. Which action is most appropriate?", "a": "Document the medication as having been given at the scheduled time to keep the record consistent", "b": "Tell the oncoming nurse privately so the delay does not need to be entered in the chart", "c": "Record the actual administration time, assess the client, and follow facility procedure for reporting the medication variance", "d": "Wait to see whether the client develops a problem before documenting anything further", "correct": "C", "domain": "Coordinated Care"}, {"n": 15, "q": "A practical nurse in a community clinic assesses a 72-year-old client who has moderate dementia and arrives with a neighbor. The client appears withdrawn, has poor hygiene, and has lost weight since the last visit. The neighbor says, \"I do what I can, but sometimes I just leave food out and lock the door so wandering isn't a problem.\" What is the nurse's best action?", "a": "Wait to report until the provider confirms that neglect has occurred", "b": "Discuss the concern with the neighbor and report only if the explanation changes", "c": "Make a mandatory report based on reasonable suspicion and document objective findings", "d": "Respect the neighbor's caregiving decisions because the client cannot speak clearly", "correct": "C", "domain": "Coordinated Care"}, {"n": 16, "q": "A client says, “I do not want any students involved in my care today.” What is the nurse’s best response?", "a": "“You have the right to refuse student participation, and I will respect that choice.”", "b": "“Students are part of the team, so you cannot refuse.”", "c": "“Let the student come in once, and then decide.”", "d": "“Refusing students may delay your care.”", "correct": "A", "domain": "Coordinated Care"}, {"n": 17, "q": "A practical nurse receives change-of-shift report on four clients with diabetes. Which client should the nurse assess first?\n\nA. A client whose fingerstick glucose is 62 mg/dL and who is sweaty and confused\nB. A client whose fingerstick glucose is 240 mg/dL and who is thirsty\nC. A client who asks for a different breakfast tray because of food preferences\nD. A client who needs teaching about rotating insulin injection sites", "a": "A client whose fingerstick glucose is 62 mg/dL and who is sweaty and confused", "b": "A client whose fingerstick glucose is 240 mg/dL and who is thirsty", "c": "A client who asks for a different breakfast tray because of food preferences", "d": "A client who needs teaching about rotating insulin injection sites", "correct": "A", "domain": "Coordinated Care"}, {"n": 18, "q": "A practical nurse documents suspected abuse and submits the required report. Which additional nursing action is most appropriate?", "a": "Independently notify local media so the case is taken seriously", "b": "Continue to assess, document new findings, and follow the plan to protect the client", "c": "Stop charting the issue because the report already contains the important details", "d": "Question the suspected abuser alone to determine whether the report was accurate", "correct": "B", "domain": "Coordinated Care"}, {"n": 19, "q": "A practical nurse is supervising an assistive personnel (AP) on a telemetry unit. Which situation requires the nurse to intervene before delegation?", "a": "The AP is asked to obtain a finger-stick blood glucose level for a client with diabetes who is alert and scheduled for a routine premeal check", "b": "The AP is asked to record oral intake for a stable client who is being monitored for hydration status", "c": "The AP is asked to assist a client to the bathroom after the nurse has confirmed the client transfers with one-person assistance", "d": "The AP is asked to take routine vital signs on a client who returned from surgery 15 minutes ago", "correct": "D", "domain": "Coordinated Care"}, {"n": 20, "q": "A practical nurse is supervising an assistive personnel (AP) worker in a skilled nursing facility. Which task is most appropriate to delegate to the AP?", "a": "Teach a client how to use a newly prescribed walker", "b": "Apply a warm compress to a stable client using a treatment plan already established by the nurse", "c": "Assess a client's swallowing ability before the first meal after a stroke", "d": "Decide whether a client's PRN pain medication is effective", "correct": "B", "domain": "Coordinated Care"}, {"n": 21, "q": "An adult client quietly tells the practical nurse, \"My partner shoved me, but I do not want police called.\" The client is alert, oriented, and in no immediate life-threatening distress. What should the nurse do first?", "a": "Respect the statement by doing nothing further", "b": "Move the conversation to a private setting and continue focused assessment and safety planning within agency policy", "c": "Call the partner into the room to hear both sides", "d": "Tell the client that treatment will be stopped unless a report is filed", "correct": "B", "domain": "Coordinated Care"}, {"n": 22, "q": "A nurse receives a client from the emergency department with no allergy band in place. The client is awake and says, “Penicillin made my lips swell once.” Which action should the nurse take first?", "a": "Administer scheduled medications and add the allergy information after admission is completed", "b": "Document the reported allergy and apply the appropriate allergy alert according to facility policy", "c": "Ask the provider to remove all antibiotic orders from the chart", "d": "Tell the client to report the allergy again when the next nurse comes on duty", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 23, "q": "A practical nurse is assisting with a sterile bedside procedure. After surgical hand antisepsis and donning sterile gloves, the nurse keeps both hands clasped together at waist level while waiting for the provider to begin. Which statement best describes the nurse's technique?", "a": "The technique is correct because sterile gloves remain sterile as long as the hands are touching each other.", "b": "The technique is incorrect because sterile hands should be kept below waist level to avoid blocking the sterile field.", "c": "The technique is incorrect because sterile gloved hands should be kept above waist level and in view.", "d": "The technique is correct because the outside of sterile gloves can touch any part of the sterile gown sleeves.", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 24, "q": "During transfer training, a student nurse asks why a transfer belt should not be placed over a client's axillae. Which response by the nurse is best?\n\nA. \"It can shift the client's center of gravity too far forward.\"\nB. \"It can cause discomfort and possible injury to the chest and underarm area.\"\nC. \"It makes the transfer take longer than needed.\"\nD. \"It prevents the nurse from bending at the knees.\"", "a": "\"It can shift the client's center of gravity too far forward.\"", "b": "\"It can cause discomfort and possible injury to the chest and underarm area.\"", "c": "\"It makes the transfer take longer than needed.\"", "d": "\"It prevents the nurse from bending at the knees.\"", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 25, "q": "A nurse finds a bottle of cleaning solution on the medication cart with no label. No one has used it yet. Which action is best?", "a": "Smell the solution to identify it, then relabel it", "b": "Set it aside and ask the next shift whether they know what it is", "c": "Remove it from use according to facility policy and report the unsafe condition", "d": "Leave it in place because it is probably housekeeping’s supply", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 26, "q": "A nurse preparing a client's noon enteral feeding compares the formula bag with the prescription and notices the bag was mixed for a different client with a renal formula instead of the standard formula ordered. The feeding has not been started, and the client has no adverse effects. Which action is most appropriate?", "a": "Hang the prescribed formula instead and continue care without further follow-up because no harm occurred", "b": "Discard the incorrect formula bag, obtain the correct feeding, and report the near miss according to facility policy", "c": "Start the incorrect formula temporarily so the client does not miss the scheduled feeding, then notify the provider", "d": "Ask another nurse whether the renal formula would still be acceptable for this client before deciding what to do", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 27, "q": "The nurse is reviewing a plan of care for a client at risk for injury from confusion. Which planned intervention best reflects least-restrictive restraint principles?", "a": "Use restraints at bedtime because confusion usually worsens overnight", "b": "Keep the client in bed all day to reduce the chance of falls", "c": "Provide regular pain assessment, toileting, and close observation to reduce unsafe behavior", "d": "Apply mitt restraints whenever the nurse leaves the room", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 28, "q": "The nurse is caring for a client who becomes agitated every evening and starts trying to remove the dressing on a healing leg wound. Which nursing action best supports least-restrictive care?", "a": "Apply elbow restraints before the behavior begins each evening", "b": "Keep the room brightly lit and active so the client stays awake", "c": "Provide calm reorientation, meet needs such as pain relief and toileting, and reduce stimulation", "d": "Move the client to the hallway so staff can watch from a distance", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 29, "q": "A newly licensed nurse is preparing to use an unfamiliar bladder scanner. Which action is most appropriate?", "a": "Use the scanner after watching a coworker use it once", "b": "Review the operating instructions and obtain help if needed before use", "c": "Try the scanner on the client and repeat the scan until the readings seem right", "d": "Skip the scan and document that the equipment was unavailable", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 30, "q": "A nurse is planning a transfer for a client who is alert and able to follow commands. The client has severe trunk instability, cannot bear weight, and is at risk for sliding out of a seated position during movement. Which transfer device is the safest choice?", "a": "Transfer board", "b": "Sit-to-stand lift", "c": "Full-body mechanical lift with a supportive sling", "d": "Gait belt with a one-person pivot transfer", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 31, "q": "A nurse prepares to use a portable commode for a client after surgery. Which instruction is best to include when teaching the client about safe use of the equipment?", "a": "Push up on the commode frame as you stand if you feel weak", "b": "Lean forward quickly so you can stand before dizziness starts", "c": "Call for assistance before getting on or off the commode", "d": "Keep both feet on the foot ring while transferring", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 32, "q": "A practical nurse is assisting with a sterile dressing change and has just donned sterile gloves. While arranging supplies on the sterile field, the nurse feels an itch on the cheek beneath the mask. Which action is best?", "a": "Use the sterile glove to quickly scratch the cheek, then continue the procedure", "b": "Ask another staff member to adjust the mask area, or step away and reglove if the face must be touched", "c": "Touch the cheek with the back of the sterile glove because the outside of the glove remains sterile", "d": "Lower the mask and scratch under it, then pull the mask back into place", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 33, "q": "A nurse preparing an IV antibiotic notices that the pharmacy label lists the correct client name and medication but shows a dose of 2 g instead of the prescribed 1 g. The medication has not been administered. Which action is most appropriate?", "a": "Administer 1 g by estimating half of the prepared dose, then notify the pharmacy", "b": "Return the medication to the pharmacy, obtain the correct dose, and complete an incident report according to facility policy", "c": "Discard the medication and document that the client refused the antibiotic", "d": "Hold the antibiotic for the shift because no client harm occurred", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 34, "q": "A nurse preparing an inhaled medication notices that the medication canister for one client is stored in a bin with another client's respiratory supplies. The clients have similar last names. No medication has been administered. Which factor makes this situation especially important to escalate?", "a": "Inhaled medications are always high-alert medications", "b": "The similar names and mixed storage increase the chance of a repeat identification error", "c": "Respiratory supplies do not require client-specific organization", "d": "Near misses should be discussed only if the clients complain", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 35, "q": "A nurse is collecting data from the parent of a 10-month-old infant during a health maintenance visit. Which parent statement describes an expected developmental finding?", "a": "My baby says 3-word sentences when asking for toys.", "b": "My baby pulls to a standing position while holding onto the couch.", "c": "My baby uses a spoon independently at each meal.", "d": "My baby rides a tricycle in the driveway with supervision.", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 36, "q": "A nurse is teaching a client about foot care. The client speaks clearly and answers appropriately, but repeatedly rubs the temples and closes the eyes. The client received pain medication 15 minutes ago. Which interpretation is most appropriate?", "a": "The client is bored and does not value the teaching", "b": "Medication effects may be interfering with the client's ability to learn", "c": "The client has a language barrier", "d": "The client is demonstrating defiant behavior", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 37, "q": "A nurse is teaching a client with newly prescribed warfarin about food and medication precautions. The client says, \"I take eight pills a day already, and I get confused about which one is which.\" Which nursing action best addresses this barrier?", "a": "Teach all the information in one long session so the client hears it only once", "b": "Use an organized medication schedule with clear labeling and review the highest-risk points first", "c": "Tell the client to stop taking over-the-counter medications completely", "d": "Ask the provider to change warfarin to a medication that needs no teaching", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 38, "q": "A nurse is screening clients before vaccination. Which finding requires the most immediate follow-up before the vaccine is given?\n", "a": "The client is anxious about needles", "b": "The client ate breakfast 2 hours ago", "c": "The client reports a history of severe allergy to a vaccine component", "d": "The client had mild soreness after a prior injection", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 39, "q": "A stable postpartum client asks when Kegel exercises may be helpful. Which response by the nurse is best?", "a": "They strengthen pelvic floor muscles and can improve muscle tone.", "b": "They help the uterus return to its prepregnant size faster.", "c": "They stop lochia from lasting more than a few days.", "d": "They prevent breast engorgement during milk production.", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 40, "q": "A client is 5 ft 6 in tall and weighs 98 lb. During the baseline assessment, the client says, \"I haven't really been trying to lose weight.\" Which follow-up question is most important?", "a": "Do you prefer sweet or salty foods?", "b": "How many hours do you sleep each night?", "c": "How much weight have you lost, and over what time period?", "d": "Do you usually cook your meals at home?", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 41, "q": "A nurse evaluates several children during health screening. Which child demonstrates the most age-appropriate fine motor skill?", "a": "A 10-month-old who uses a crude pincer grasp to pick up a cereal piece", "b": "A 6-month-old who draws a stick figure", "c": "A 2-year-old who ties shoelaces independently", "d": "A 3-year-old who writes in cursive", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 42, "q": "A parent asks what information is most helpful to bring to a child's vaccination visit. Which response by the nurse is best?", "a": "A complete record of previous immunizations, if available", "b": "The child's favorite toy for distraction only", "c": "A list of all foods the child dislikes", "d": "The child's most recent school grades", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 43, "q": "A nurse is obtaining a health history from a client who recently had a stroke. The client understands questions but answers slowly with single words and becomes frustrated when rushed. Which action by the nurse is best to reduce this communication barrier?", "a": "Ask the client's family member to answer most of the questions", "b": "Repeat each question several times until the client responds more quickly", "c": "Use short, simple questions and allow extra time for the client to respond", "d": "Speak loudly and continuously rephrase the questions in different ways", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 44, "q": "A client scheduled for cardiac catheterization later today says to the nurse, \"I know they explained it, but all I heard was that something could go wrong.\" Which response by the nurse is most therapeutic?", "a": "\"There is no reason to worry because complications are rare.\"", "b": "\"Tell me more about what concerns you most about the procedure.\"", "c": "\"You need to stay calm so your blood pressure does not go up.\"", "d": "\"The provider already explained everything, so try to focus on the benefits.\"", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 45, "q": "A client in the emergency department states, \"I'm transgender, and every time I come to a hospital people focus on that instead of why I'm here.\" The client has severe abdominal pain rated 8 out of 10. Which nursing approach is best?", "a": "Begin a detailed discussion of the client's transition history before addressing the pain", "b": "Avoid asking any questions related to sex assigned at birth or reproductive organs because that topic may be upsetting", "c": "Acknowledge the concern, focus first on assessment and relief of the abdominal pain, and ask only clinically necessary questions in a respectful manner", "d": "Reassure the client that staff members are trained and therefore bias will not affect care", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 46, "q": "A client with chronic pain calls out frequently and presses the call light every few minutes even after needs have been met. Which nursing strategy is most appropriate?", "a": "Tell the client that using the call light too much is manipulative", "b": "Respond only when the client stops calling out", "c": "Develop a scheduled plan for contact and pain assessment", "d": "Ask different staff members to answer each call for variety", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 47, "q": "A postoperative client is legally blind and says, \"Please don't keep changing nurses. I get nervous when I don't know who is here.\" Which nursing action best addresses this concern?", "a": "Limit all staff interactions to reduce stimulation", "b": "Arrange care so staff identify themselves each time they enter and explain what they are going to do", "c": "Encourage the client to rely on family instead of staff whenever possible", "d": "Avoid conversation unless giving medications or treatments", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 48, "q": "A nurse is caring for a client with mild dementia who becomes upset during morning care. The client pulls away, raises a hand as if to strike, and says, \"You're trying to hurt me.\" Which action by the nurse is most appropriate first to de-escalate the situation?", "a": "Step back, speak calmly, and explain each action in short, simple phrases", "b": "Firmly remind the client that hitting staff is not allowed", "c": "Ask another staff member to help complete the care quickly", "d": "Continue the care task while distracting the client with unrelated conversation", "correct": "A", "domain": "Psychosocial Integrity"}, {"n": 49, "q": "A nurse in a community health clinic is interviewing a client who is upset about losing a job. During the interview, the client suddenly leans forward, speaks in a harsh voice, and says, \"My supervisor ruined my life. I bought a gun yesterday, and I know where he parks after work.\" Which action should the nurse take first?", "a": "Ask the client to describe the argument with the supervisor in more detail", "b": "Notify the provider and follow agency procedure for an immediate threat of violence", "c": "Encourage the client to use deep-breathing techniques to calm down", "d": "Reassure the client that these feelings will likely pass with time", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 50, "q": "A client with mild cognitive impairment is embarrassed by forgetfulness and asks the practical nurse, \"What can I do so I don't miss my medications at home?\" Which suggestion is best?", "a": "Stop taking the medications until a family member can move in", "b": "Use a pill organizer and keep a consistent daily routine", "c": "Hide the medications in different places to prevent theft", "d": "Take all medications at bedtime to simplify the schedule", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 51, "q": "The practical nurse enters a room and finds a client with dementia searching under the bed and saying, \"Someone stole my purse.\" What is the most therapeutic response?", "a": "No one stole it. You must have forgotten where you put it.", "b": "That sounds upsetting. Let's look for your purse together.", "c": "You are accusing the staff, and that is unacceptable.", "d": "If you calm down, I will tell you whether it was stolen.", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 52, "q": "A nurse is caring for a client who frequently asks, \"Am I dying?\" The client has had this conversation several times during the shift. Which response is most therapeutic?", "a": "Why do you keep asking me that question?", "b": "Try not to think about that right now.", "c": "Tell me what you are thinking about when you ask that.", "d": "No one knows exactly when death will occur.", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 53, "q": "A client becomes irritated when the nurse begins asking several admission questions in rapid succession. The client crosses the arms, raises the voice, and says, \"Stop firing questions at me.\" Which action should the nurse take next?", "a": "Continue the questions to finish the assessment quickly", "b": "Pause, lower the voice, and ask one simple question at a time", "c": "Tell the client that the questions are required and cannot wait", "d": "Ask another staff member to repeat the same questions", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 54, "q": "The adult child of a dying client asks the nurse, \"Should I tell my mother that she is dying? No one in the family wants to say it.\" What is the nurse's best response?", "a": "Yes, clients should always be told directly, even if they resist the discussion.", "b": "No, it's better to avoid the subject so she does not lose hope.", "c": "Let's talk about what your mother seems to understand and how your family communicates about difficult news.", "d": "That decision belongs only to the provider, not the family.", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 55, "q": "A nurse is admitting a client who says, “I’m transgender, and I go by Maya. My pronouns are she and her.” Which action by the nurse is most appropriate?", "a": "Document the client by the legal name only and avoid using pronouns", "b": "Use the client’s stated name and pronouns during care and communication", "c": "Ask the client to explain the reasons for the gender transition", "d": "Tell the client staff will decide what is easiest to use in the chart", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 56, "q": "A client with a weak grasp asks for help eating soup. Which nursing intervention best promotes independence while reducing frustration?", "a": "Feed the client the entire meal", "b": "Offer a built-up handled spoon and position the tray within easy reach", "c": "Replace the soup with finger foods only, without asking the client", "d": "Tell the client to wait for family members to assist with meals", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 57, "q": "A practical nurse is monitoring a client on strict intake and output. The client had 360 mL of urine, 120 mL of liquid stool, and 80 mL from a wound drainage device during the shift. The client also had one small formed stool. What total output should the nurse record?", "a": "480 mL", "b": "560 mL", "c": "600 mL", "d": "640 mL", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 58, "q": "An immobile client is beginning to develop weakness from bed rest. Which activity best helps maintain muscle strength when the client can participate safely?", "a": "Passive range-of-motion only", "b": "Active range-of-motion exercises", "c": "Strict bed rest with pillows for support", "d": "Massage of the calves twice daily", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 59, "q": "A client is on bed rest with an abduction pillow in place after hip surgery. The nurse explains that the main purpose of this device is to prevent which problem?", "a": "Hip adduction that could dislocate the prosthesis", "b": "Pressure injury formation on the heels", "c": "Venous stasis in the lower legs", "d": "Lumbar muscle spasm from prolonged immobility", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 60, "q": "A practical nurse is reviewing a 4-hour record for a client receiving continuous bladder irrigation after urologic surgery. During the 4 hours, 2,000 mL of irrigating solution was infused, and 2,450 mL drained into the urinary catheter bag. What amount should the nurse record as urine output for that 4-hour period?", "a": "450 mL", "b": "2,000 mL", "c": "2,450 mL", "d": "4,450 mL", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 61, "q": "A client with low back pain from prolonged bed rest asks what the nurse can do right now to help without medication. Which action is the best initial nonpharmacologic intervention?\n", "a": "Reposition the client with pillows to support body alignment", "b": "Encourage the client to delay movement until the pain passes", "c": "Lower the head of the bed completely to keep the spine flat", "d": "Massage the painful area vigorously for several minutes", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 62, "q": "A client is on strict intake and output. At breakfast, the client drinks 4 oz of orange juice and 6 oz of coffee, eats 1/2 cup of yogurt, and receives 30 mL of liquid medication by mouth. Later, the client has 8 oz of ice chips. If ice chips count as half their measured volume when melted, how much intake should the practical nurse record?", "a": "510 mL", "b": "570 mL", "c": "630 mL", "d": "690 mL", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 63, "q": "A practical nurse is reinforcing home-safety teaching for a client who has decreased sensation in both feet from peripheral neuropathy. Which instruction is most appropriate?", "a": "Test bath water temperature with the elbow before getting in", "b": "Wear elastic socks at night to improve circulation", "c": "Soak the feet in hot water for 20 minutes each evening", "d": "Walk barefoot at home to strengthen the feet", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 64, "q": "A nurse is reviewing the medication administration record for four clients before bedtime. Which medication should the nurse recognize as most likely to interfere with the client's ability to sleep?", "a": "Furosemide given at 2100", "b": "Docusate sodium given at 2100", "c": "Acetaminophen given at 2100", "d": "Heparin subcutaneous injection given at 2100", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 65, "q": "A nurse is calculating a client's intake and output for an 8-hour shift. The client drank 8 oz of coffee, 240 mL of juice, and 6 oz of water. The client also received 500 mL of IV fluid. Urine output was 900 mL. How many milliliters should the nurse document as the client's total intake for the shift?", "a": "920 mL", "b": "1,160 mL", "c": "1,220 mL", "d": "1,400 mL", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 66, "q": "A nurse is preparing to administer an IV dose of furosemide using a client's existing peripheral line. The client is receiving total parenteral nutrition (TPN) through that line. After checking the compatibility reference, the nurse finds that furosemide is incompatible with the TPN solution. Which action should the nurse take?", "a": "Stop the TPN briefly, flush the line, administer the furosemide, and restart the TPN", "b": "Add the furosemide directly to the TPN bag to avoid wasting supplies", "c": "Administer the furosemide through a separate IV line or obtain another compatible access site", "d": "Slow the TPN rate and administer the furosemide through the same line at the same time", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 67, "q": "A practical nurse is reviewing a newly admitted client's belongings and finds a bottle of oxycodone tablets prescribed by another provider. The client says, \"I keep these with me in case my back starts hurting.\" What should the nurse do first?", "a": "Place the bottle in the client's bedside drawer so it is available if pain occurs", "b": "Send the medication home with the family without documenting it", "c": "Secure the medication according to facility policy and notify the charge nurse or provider", "d": "Administer one tablet if the client rates the pain greater than 6 out of 10", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 68, "q": "A nurse is teaching a client how to store four medications at home. Which client statement shows correct understanding?", "a": "I will keep my medicines on the bathroom shelf so I remember them each day.", "b": "I will store all of my medicines in the refrigerator unless the label says not to.", "c": "I will keep medications in a dry place away from heat unless the label gives different storage directions.", "d": "I will combine pills from different bottles into one container to save space.", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 69, "q": "A nurse receives a telephone report that a newly admitted client takes alprazolam at home. There is no current prescription for it in the facility record. The client now requests the medication and says, \"I always take it at bedtime.\" What is the best action?", "a": "Administer the client's home supply after verifying the label", "b": "Chart the home medication as given since the client normally takes it", "c": "Explain that the medication cannot be given until it is reconciled and prescribed for use in the facility", "d": "Substitute another client's benzodiazepine dose of similar strength", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 70, "q": "A nurse needs to administer 300 mL of IV solution over 2 hr using gravity tubing with a drop factor of 12 gtt/mL. What flow rate should the nurse regulate in drops per minute?", "a": "20 gtt/min", "b": "25 gtt/min", "c": "30 gtt/min", "d": "36 gtt/min", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 71, "q": "A nurse is preparing to administer an IV dose of phenytoin through a peripheral line. The client is currently receiving 5% dextrose in water (D5W) at 75 mL/hr. Which action should the nurse take first?", "a": "Administer the phenytoin through the line without changes because the maintenance fluid is infusing slowly", "b": "Mix the phenytoin into the bag of D5W to dilute the medication before infusion", "c": "Stop the D5W infusion and verify compatibility before administering the phenytoin", "d": "Flush the line with sterile water and then administer the phenytoin", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 72, "q": "A nurse is administering an oral medication and notices the client quickly place the tablet under the tongue, then turn away. Which action best supports medication rights?", "a": "Document the medication as given because the tablet entered the client's mouth", "b": "Offer water and verify that the client actually swallowed the medication if swallowing is intended", "c": "Leave the room to preserve the client's privacy and return later", "d": "Immediately request a replacement dose from the pharmacy", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 73, "q": "A practical nurse enters a client's room to give a prescribed controlled pain medication and finds several visitors at the bedside. The client quietly says, \"Please don't talk about my pain medicine in front of them.\" Which action by the nurse is best?", "a": "Ask the visitors to leave the room, verify the medication privately with the client, and administer it according to policy", "b": "Explain to the visitors that the medication is a controlled substance and must be discussed before it can be given", "c": "Tell the client that medication teaching must be done out loud before any controlled drug can be administered", "d": "Return the medication to storage and document that the client refused the dose", "correct": "A", "domain": "Pharmacological Therapies"}, {"n": 74, "q": "A client with limited English proficiency is admitted with several home medications. The family member at the bedside offers to translate the medication names and instructions. Which approach best supports accurate medication reconciliation?", "a": "Use the family member as the sole interpreter because the client knows them best", "b": "Ask yes-or-no questions only, since medication names are hard to interpret", "c": "Use qualified interpretation resources and verify medication names, doses, and schedules carefully", "d": "Skip reconciliation until the provider rounds and can ask the family directly", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 75, "q": "While reviewing the MAR, the nurse notices that yesterday's 1800 dose of an antibiotic is missing any signature or omission code. The next dose is due now, and the antibiotic must be given on schedule. Which action is best?", "a": "Assume the 1800 dose was given because the client is improving", "b": "Skip the current dose to avoid possible duplication", "c": "Investigate the undocumented prior dose while preparing to give the currently due dose if appropriate", "d": "Sign for the missed 1800 dose and then give the current one", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 76, "q": "A practical nurse receives a verbal report that a client has a new prescription for a controlled opioid after surgery. Before removing the medication from secure storage, which action is most appropriate?", "a": "Ask the unlicensed assistive personnel to bring the medication to the room", "b": "Review the medication administration record and verify the prescription and time due", "c": "Remove the medication now so it is ready if the client reports pain", "d": "Wait until the end of the shift to give the first dose with the next scheduled medications", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 77, "q": "The health care provider orders 1,000 mL of 0.9% sodium chloride to infuse over 8 hours using an infusion pump. What rate should the nurse set in mL/hr?", "a": "100 mL/hr", "b": "125 mL/hr", "c": "128 mL/hr", "d": "250 mL/hr", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 78, "q": "A nurse caring for a client with a central line sees an order to infuse calcium gluconate and ceftriaxone through the same line at the same time. Which nursing action is best?", "a": "Administer both together to reduce line access time", "b": "Mix both medications in the same syringe before infusion", "c": "Question the plan and verify compatibility before co-administration", "d": "Infuse the calcium first, then immediately start ceftriaxone without flushing", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 79, "q": "A nurse is caring for a client who is 2 hours postpartum after a vaginal birth. The client reports, \"I feel pressure, and I need to push again.\" Which focused assessment should the nurse perform first?", "a": "Inspect the perineum for bulging or a hematoma", "b": "Ask when the client last voided", "c": "Check the fundal height and firmness", "d": "Review the amount of lochia on the perineal pad", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 80, "q": "A client with type 1 diabetes has these laboratory findings: blood glucose 420 mg/dL, serum bicarbonate 14 mEq/L, and positive urine ketones. Which interpretation is most important for the nurse to recognize?", "a": "The client is showing evidence of diabetic ketoacidosis", "b": "The client is experiencing hypoglycemia", "c": "The findings suggest excessive anticoagulation", "d": "The results are expected after a high-carbohydrate meal", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 81, "q": "A practical nurse notes that an adult client's radial pulse is irregular. What is the best next action?", "a": "Count the radial pulse for 15 seconds and multiply by 4", "b": "Count the apical pulse for 1 full minute", "c": "Document the pulse as normal if the rate is under 100/min", "d": "Ask the client to cough and then recheck the radial pulse", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 82, "q": "While performing venipuncture, the nurse notices the blood stops flowing into the collection tube before the needed amount is obtained. The needle appears to have been inserted correctly at first. Which action should the nurse take first?", "a": "Probe the tissue by moving the needle side to side", "b": "Release the tourniquet and remove the needle immediately without checking anything else", "c": "Slightly adjust the needle position to see whether blood flow resumes", "d": "Pump the client's fist repeatedly to increase venous pressure", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 83, "q": "A client is returning from a liver biopsy. Which finding should the nurse report first?", "a": "Complaint of soreness at the puncture site", "b": "Blood pressure lower than preprocedure baseline and increasing pulse rate", "c": "Request for oral fluids", "d": "Small amount of drainage on the dressing", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 84, "q": "A nurse is preparing to obtain a venous blood specimen from an adult client for coagulation studies. The nurse must collect more than one tube of blood. Which action is most important to reduce the risk of an inaccurate laboratory result related to additive carryover?", "a": "Use the smallest needle available for the venipuncture", "b": "Fill the collection tubes in the correct order of draw", "c": "Ask the client to repeatedly open and close the fist during collection", "d": "Keep the tourniquet in place until all tubes have been filled", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 85, "q": "A nurse performs a bedside capillary blood glucose test and obtains a reading of 28 mg/dL. The client is awake, talking with family, has warm dry skin, and denies dizziness, shakiness, or weakness. Which action is most appropriate first?", "a": "Administer oral glucose immediately based on the meter reading", "b": "Repeat the test with a new strip after checking for possible sampling or equipment error", "c": "Document the finding as asymptomatic hypoglycemia and recheck in 1 hour", "d": "Notify the provider that the client is experiencing severe hypoglycemia", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 86, "q": "A client returns to the unit after a bronchoscopy. Which finding should the practical nurse identify as the clearest ongoing risk that requires delaying oral intake?", "a": "The client reports a mild sore throat", "b": "The client is sleepy from the sedative", "c": "The gag reflex has not yet returned", "d": "The respiratory rate is 18/min", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 87, "q": "A client with emphysema becomes increasingly sleepy while receiving oxygen at 2 L/min by nasal cannula. Which focused data should the nurse obtain first?", "a": "The client's preferred bedtime routine", "b": "Respiratory rate, depth, and pulse oximetry", "c": "How many pillows the client uses at home", "d": "The date of the client's last influenza vaccine", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 88, "q": "A nurse is caring for a client who is receiving a continuous heparin infusion for treatment of a deep-vein thrombosis. The client suddenly reports a severe headache and says, \"My vision looks blurry.\" Which focused assessment should the nurse perform first?", "a": "Check the client's pupils, level of consciousness, and hand grasps", "b": "Inspect the client's gums for bleeding", "c": "Ask the client to rate the headache on a 0 to 10 scale", "d": "Assess the client's abdomen for bruising", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 89, "q": "A provider orders a midstream clean-catch urine culture for an ambulatory client. Which client statement indicates correct understanding of the teaching?", "a": "I will collect the first urine that comes out into the cup", "b": "I will cleanse the area, start urinating, and then collect the urine in the container", "c": "I should save the last drops of urine because they are the most concentrated", "d": "I can touch the inside of the cup if I need to hold it steady", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 90, "q": "A client at 32 weeks' gestation reports a sudden gush of clear fluid from the vagina that continues to leak. Which action should the nurse take first?", "a": "Check the fetal heart rate", "b": "Perform a digital vaginal examination", "c": "Encourage the client to walk to stimulate labor", "d": "Place the client in a warm tub bath", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 91, "q": "A nurse is caring for a client who has syndrome of inappropriate antidiuretic hormone secretion (SIADH). Which finding best indicates that treatment has been effective?", "a": "Urine specific gravity increases from 1.020 to 1.035", "b": "Serum sodium level rises from 124 mEq/L to 136 mEq/L", "c": "Urine output decreases from 45 mL/hr to 20 mL/hr", "d": "Body weight increases by 0.9 kg (2 lb) in 24 hours", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 92, "q": "A client with heart failure is on continuous telemetry. The monitor alarm sounds, and the rhythm appears as a flat line in lead II. The client is awake in bed and talking with the nurse. Which action should the nurse take first?", "a": "Begin chest compressions immediately", "b": "Check the client for a pulse for 5 to 10 seconds", "c": "Assess the monitor leads and cable connections", "d": "Prepare for transcutaneous pacing", "correct": "C", "domain": "Physiological Adaptation"}, {"n": 93, "q": "A postoperative client with an ileostomy reports crampy abdominal pain and nausea. The nurse notes minimal ostomy output, abdominal distention, and a swollen stoma. Which action is the priority?", "a": "Encourage the client to increase high-fiber foods", "b": "Notify the provider of possible obstruction", "c": "Irrigate the ileostomy with tap water", "d": "Reassure the client that output commonly stops for a day", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 94, "q": "A nurse assesses a pressure injury on a client's heel. The wound bed is completely covered with yellow-brown tissue, and the depth cannot be determined. How should the nurse document this wound?", "a": "Stage 2 pressure injury", "b": "Stage 3 pressure injury", "c": "Unstageable pressure injury", "d": "Deep tissue pressure injury", "correct": "C", "domain": "Physiological Adaptation"}, {"n": 95, "q": "A client with a temporary transvenous pacemaker is being monitored after insertion for complete heart block. The nurse notes that each pacing spike is followed by a QRS complex on the monitor. The client's heart rate is 80/min, blood pressure is 118/72 mm Hg, skin is warm, and the client denies dizziness. How should the nurse interpret this finding?", "a": "The pacemaker is failing to capture", "b": "The pacemaker is functioning appropriately", "c": "The pacemaker is failing to sense intrinsic activity", "d": "The client is developing pacemaker-induced dysrhythmia", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 96, "q": "A client admitted with bacterial meningitis suddenly has a generalized tonic-clonic seizure. Which nursing action is the priority?", "a": "Insert an oral airway between the teeth", "b": "Restrain the client's arms and legs", "c": "Turn the client to the side and protect the head", "d": "Offer water after the seizure begins to prevent dehydration", "correct": "C", "domain": "Physiological Adaptation"}, {"n": 97, "q": "The nurse is caring for a client on mechanical ventilation with positive end-expiratory pressure (PEEP). Which statement best explains a possible effect of high PEEP that the nurse should monitor for?", "a": "It can decrease venous return and lower blood pressure", "b": "It always increases cardiac output by improving oxygenation", "c": "It prevents all alveolar collapse regardless of lung condition", "d": "It mainly causes hypoglycemia by reducing metabolic demand", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 98, "q": "The nurse is caring for a client with a tracheostomy and notes bright red blood coming from the tracheostomy site. What is the nurse's priority action?", "a": "Document the amount of drainage and recheck in 30 minutes", "b": "Suction the tracheostomy to remove blood from the airway", "c": "Apply oxygen by nasal cannula", "d": "Call for immediate assistance and notify the provider at once", "correct": "D", "domain": "Physiological Adaptation"}, {"n": 99, "q": "A client has a chest tube drainage system with a collection chamber that contained 120 mL of drainage 1 hour ago and now contains 260 mL. The drainage is bright red. What is the nurse's priority action?", "a": "Document the finding as expected after chest tube insertion", "b": "Lower the drainage system below chest level", "c": "Notify the provider immediately", "d": "Milk the chest tube to clear a possible clot", "correct": "C", "domain": "Physiological Adaptation"}, {"n": 100, "q": "A client receiving mechanical ventilation becomes agitated, and the high-pressure alarm sounds. Which action should the nurse take first?", "a": "Increase the tidal volume setting", "b": "Suction the client's airway", "c": "Disconnect the ventilator and silence the alarm", "d": "Lower the oxygen concentration", "correct": "B", "domain": "Physiological Adaptation"}], ["Safety and Infection Prevention and Control", "Health Promotion and Maintenance", "Psychosocial Integrity", "Basic Care and Comfort", "Pharmacological Therapies", "Reduction of Risk Potential", "Physiological Adaptation", "Coordinated Care"]);</script>
