<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation Test 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#2a2419; --paper:#faf7f1; --raised:#ffffff; --line:#e6ddc9;
  --accent:#2f6f9e; --accent-ink:#ffffff; --alert:#b9791f; --alert-soft:#fbeed7;
  --danger:#b1483a; --correct:#3f9463; --muted:#5f574a; --muted-2:#7c7364;
  --shadow: 0 1px 2px rgba(42,36,25,.05), 0 10px 28px -14px rgba(42,36,25,.18);
}
*{box-sizing:border-box;}
body{background:var(--paper); color:var(--ink); font-family:'Public Sans',system-ui,sans-serif; margin:0; line-height:1.5; font-size:16.5px;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0; letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:inherit;} button{font-family:inherit; cursor:pointer;}
.page{max-width:640px; margin:0 auto; padding:3rem clamp(1.25rem,5vw,2rem) 4rem;}
.page.wide{max-width:880px;}
.back-link{font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--muted-2); text-decoration:none; display:inline-block; margin-bottom:1.5rem;}
.hero{text-align:center;}
.hero .eyebrow{display:flex; justify-content:center;}
.hero .lede{max-width:520px; margin-left:auto; margin-right:auto;}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600;}
.lede{color:var(--muted); font-size:1.05rem; line-height:1.6; margin-top:.9rem;}
.cta{
  display:inline-flex; align-items:center; gap:.5rem; background:var(--accent); color:var(--accent-ink);
  padding:1.05rem 2.1rem; border-radius:999px; font-weight:800; font-size:1rem; text-decoration:none; border:none;
  text-transform:uppercase; letter-spacing:.03em;
  box-shadow:0 6px 18px -4px color-mix(in srgb, var(--accent) 55%, transparent);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cta:hover{transform:translateY(-2px); box-shadow:0 10px 22px -4px color-mix(in srgb, var(--accent) 65%, transparent);}
.cta.ghost{background:var(--raised); color:var(--ink); border:2px solid var(--line); box-shadow:var(--shadow);}
.cta.ghost:hover{border-color:var(--accent); color:var(--accent);}
.cta.big{padding:1.25rem 2.6rem; font-size:1.08rem;}
.cta-wrap{display:flex; justify-content:center; align-items:center; margin-top:1.75rem; flex-direction:column; gap:.75rem;}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin:1.75rem 0;}
.stat{background:var(--raised); padding:1.1rem 1rem;}
.stat .n{font-family:'Fraunces',serif; font-size:1.9rem; font-weight:600;}
.stat .l{font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); margin-top:.2rem;}
.card-list{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line); margin-top:1.5rem;}
.card{padding:1.25rem 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:1.5rem; align-items:center;}
.card h3{font-size:1.05rem; font-weight:600; font-family:'Public Sans',sans-serif;}
.card p{color:var(--muted); font-size:.94rem; margin:.35rem 0 0; line-height:1.55;}
.tag{font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); background:var(--raised); border:2px solid var(--line); padding:.5rem .9rem; border-radius:999px; white-space:nowrap; text-decoration:none;}
.tag:hover{border-color:var(--accent);}
.step-list{counter-reset:step; margin:1.75rem 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:1.1rem;}
.step-list li{counter-increment:step; display:flex; gap:1rem; align-items:flex-start;}
.step-list li::before{
  content:counter(step); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.85rem;
  background:var(--ink); color:var(--paper); width:1.6rem; height:1.6rem; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:.1rem;
}
.step-list h3{font-size:1rem; font-weight:700; font-family:'Public Sans',sans-serif;}
.step-list p{color:var(--muted); font-size:.95rem; margin:.25rem 0 0; line-height:1.6;}
.action-block{margin-top:.9rem; display:flex; flex-wrap:wrap; align-items:center; gap:.7rem;}
.subject-chip{font-family:'IBM Plex Mono',monospace; font-size:.82rem; background:var(--paper); border:1.5px dashed var(--line); border-radius:8px; padding:.6rem .9rem; color:var(--ink);}
.subject-chip b{color:var(--accent);}
.callout{background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:1.75rem; box-shadow:var(--shadow); margin-top:1.75rem;}
.callout.alert{border-color:var(--alert); background:var(--alert-soft);}
.foot{margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--line); color:var(--muted-2); font-size:.78rem; line-height:1.6;}
.faq dt{font-weight:700; margin-top:1.1rem;}
.faq dd{margin:.35rem 0 0; color:var(--muted); font-size:.95rem; line-height:1.6;}
@media (max-width:520px){
  .card{flex-direction:column; align-items:flex-start; gap:.6rem;}
  .card > a.tag{align-self:stretch; text-align:center;}
}

.quiz-head{display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:1.25rem;}
.progress{font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--muted);}
.qcard{border:1px solid var(--line); border-radius:8px; padding:1.4rem; margin-top:1.25rem; background:var(--raised); box-shadow:var(--shadow);}
.qn{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--muted-2); display:flex; justify-content:space-between;}
.qtext{margin-top:.6rem; font-size:1rem; line-height:1.55; white-space:pre-wrap;}
.domain-pill{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.04em; text-transform:uppercase; background:var(--paper); border:1px solid var(--line); padding:.2rem .55rem; border-radius:3px; color:var(--muted);}
.opts{display:flex; flex-direction:column; gap:.55rem; margin-top:1.1rem;}
.opt{display:flex; gap:.7rem; align-items:flex-start; border:1px solid var(--line); border-radius:6px; padding:.65rem .8rem; font-size:.92rem; line-height:1.45;}
.opt input{margin-top:.25rem;} .letter{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--muted-2);}
.opt.correct{border-color:var(--correct); background:color-mix(in srgb, var(--correct) 14%, var(--raised));}
.opt.wrong{border-color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, var(--raised));}
.quiz-actions{display:flex; justify-content:center; margin-top:2rem; gap:.75rem;}
.score-panel{border:1px solid var(--line); border-radius:8px; padding:1.5rem; background:var(--raised); margin-top:1.25rem; box-shadow:var(--shadow);}
.score-big{font-family:'Fraunces',serif; font-size:2.4rem; font-weight:600;}
.domain-bars{display:flex; flex-direction:column; gap:.5rem; margin-top:1.25rem;}
.dbar-row{display:grid; grid-template-columns:minmax(120px,200px) 1fr 3.2rem; gap:.6rem; align-items:center; font-size:.82rem;}
.dbar-track{height:8px; background:var(--paper); border:1px solid var(--line); border-radius:4px; overflow:hidden;}
.dbar-fill{height:100%; background:var(--correct);}
.dname{color:var(--muted);} .dpct{font-family:'IBM Plex Mono',monospace; text-align:right; color:var(--muted-2);}
</style>
</head>
<body>

<div class="page wide">
  <div class="quiz-head">
    <div><div class="eyebrow">Self-hosted · no rationales shown</div><h1 style="font-size:1.5rem;">Simulation Test 1</h1></div>
    <span class="progress" id="quiz-progress"></span>
  </div>
  <div id="quiz-body"></div>
  <div class="quiz-actions">
    <button class="cta ghost" id="btn-reset" style="display:none;">Restart</button>
    <button class="cta" id="btn-submit">Submit test</button>
  </div>
  <div id="score-area"></div>
</div>
<script>
function runQuiz(questions, domainOrder){
  const body = document.getElementById('quiz-body');
  const answers = {};
  questions.forEach(function(q){
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = '<div class="qn"><span>Question ' + q.n + ' / ' + questions.length + '</span><span class="domain-pill">' + (q.domain||'') + '</span></div><div class="qtext"></div><div class="opts"></div>';
    card.querySelector('.qtext').textContent = q.q;
    const opts = card.querySelector('.opts');
    ['a','b','c','d'].forEach(function(letter){
      const label = document.createElement('label');
      label.className = 'opt';
      label.dataset.letter = letter.toUpperCase();
      label.innerHTML = '<input type="radio" name="q' + q.n + '" value="' + letter.toUpperCase() + '"><span><span class="letter">' + letter.toUpperCase() + '.</span> <span class="opttext"></span></span>';
      label.querySelector('.opttext').textContent = q[letter];
      label.querySelector('input').addEventListener('change', function(){ answers[q.n] = letter.toUpperCase(); updateProgress(); });
      opts.appendChild(label);
    });
    body.appendChild(card);
  });
  function updateProgress(){
    document.getElementById('quiz-progress').textContent = Object.keys(answers).length + ' / ' + questions.length + ' answered';
  }
  updateProgress();
  document.getElementById('btn-submit').addEventListener('click', function(){
    let correct = 0;
    const byDomain = {};
    questions.forEach(function(q){
      const given = answers[q.n];
      const isCorrect = given === q.correct;
      if(isCorrect) correct++;
      const d = q.domain || 'Other';
      byDomain[d] = byDomain[d] || {correct:0,total:0};
      byDomain[d].total++;
      if(isCorrect) byDomain[d].correct++;
      const card = document.querySelectorAll('.qcard')[q.n-1];
      card.querySelectorAll('.opt').forEach(function(opt){
        opt.querySelector('input').disabled = true;
        if(opt.dataset.letter === q.correct) opt.classList.add('correct');
        else if(opt.dataset.letter === given) opt.classList.add('wrong');
      });
    });
    const pct = Math.round((correct/questions.length)*100);
    const scoreArea = document.getElementById('score-area');
    let bars = '';
    domainOrder.filter(function(d){return byDomain[d];}).forEach(function(d){
      const s = byDomain[d];
      const p = Math.round((s.correct/s.total)*100);
      bars += '<div class="dbar-row"><span class="dname">' + d + '</span><div class="dbar-track"><div class="dbar-fill" style="width:' + p + '%"></div></div><span class="dpct">' + s.correct + '/' + s.total + '</span></div>';
    });
    scoreArea.innerHTML = '<div class="score-panel"><div class="eyebrow">Result \u2014 no rationales shown, readiness signal only</div><div class="score-big">' + correct + ' / ' + questions.length + ' <span style="font-size:1.1rem; color:var(--muted); font-family:\'Public Sans\',sans-serif; font-weight:500;">(' + pct + '%)</span></div><div class="domain-bars">' + bars + '</div></div>';
    document.getElementById('btn-submit').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'inline-flex';
    scoreArea.scrollIntoView({behavior:'smooth', block:'nearest'});
  });
  document.getElementById('btn-reset').addEventListener('click', function(){ window.location.reload(); });
}

runQuiz([{"n": 1, "q": "A practical nurse is calling the provider about a client with heart failure who has increased shortness of breath. Which report best supports effective interdisciplinary decision-making?\n\nA client with heart failure is more short of breath than this morning. Breath sounds now have crackles at the bases, oxygen saturation decreased from 95% to 89% on room air, respirations are 28/min, and bilateral ankle edema is 2+.\n\nWhich additional information is most important for the nurse to include?", "a": "The client watched television most of the afternoon", "b": "The client gained 2.2 lb (1 kg) since yesterday", "c": "The client's daughter visited during lunch", "d": "The client prefers to sleep with the door closed", "correct": "B", "domain": "Coordinated Care"}, {"n": 2, "q": "A practical nurse in a long-term care facility is told about four client situations during medication pass. Which client should the nurse see first?", "a": "A client with Parkinson disease who is 20 minutes late for a scheduled dose of carbidopa-levodopa", "b": "A client with chronic heart failure who has gained 2 lb since yesterday and has mild ankle edema", "c": "A client with diabetes who is pale, sweating, and difficult to awaken before lunch", "d": "A client with osteoarthritis who reports knee pain of 7/10 while walking to the dining room", "correct": "C", "domain": "Coordinated Care"}, {"n": 3, "q": "A nurse is preparing an alert adult client for a scheduled knee arthroscopy. The client looks at the consent form and says, \"I want the surgery, but I don't want to read all of this. Just tell me where to sign.\" Which action by the nurse is most appropriate?", "a": "Ask the client to sign because agreeing to the surgery is enough to show informed consent", "b": "Explain the procedure, risks, and alternatives in detail before the client signs", "c": "Witness the signature only after confirming the provider has already obtained informed consent", "d": "Have a family member review the form with the client and decide whether the client should sign", "correct": "C", "domain": "Coordinated Care"}, {"n": 4, "q": "A client is being discharged after treatment for cellulitis of the left leg. The provider prescribes an oral antibiotic for 10 days and a follow-up visit in 3 days. The client tells the nurse, \"I don't have a primary care provider, and I usually go to urgent care when I get sick.\" Which nursing action is most appropriate before discharge?", "a": "Ask the client to call a clinic after discharge if the leg gets worse", "b": "Request a referral to a primary care provider or outpatient clinic before the client leaves", "c": "Teach the client to stop the antibiotic if redness improves in 2 to 3 days", "d": "Delay all discharge teaching until a family member arrives", "correct": "B", "domain": "Coordinated Care"}, {"n": 5, "q": "A practical nurse is supervising an assistive personnel (AP) on a medical unit. Which task should the nurse assign to the AP?", "a": "Reinforce discharge teaching for a client newly prescribed warfarin", "b": "Apply a sterile dressing to a stage 3 pressure injury", "c": "Assist a stable client with eating breakfast after the nurse verifies swallowing is safe", "d": "Assess a client’s pain 30 minutes after receiving an opioid medication", "correct": "C", "domain": "Coordinated Care"}, {"n": 6, "q": "The practical nurse asks an assistive personnel (AP) to measure a client's intake and output for the shift. Later, the AP reports that the client had a large amount of emesis after lunch and says, \"I didn't measure it exactly, but I emptied it already.\" What is the nurse's best response?", "a": "Tell the AP to estimate the amount and document the estimate as exact", "b": "Instruct the AP to report unmeasured output right away in the future and document that emesis occurred", "c": "Advise the AP to ignore emesis unless the client vomits more than once", "d": "Ask the AP to wait until the end of the shift before mentioning any missing measurements", "correct": "B", "domain": "Coordinated Care"}, {"n": 7, "q": "Which client is most appropriate for the practical nurse to assign to a UAP for routine feeding assistance?", "a": "A client newly admitted with dehydration who is lethargic", "b": "A client with advanced Parkinson disease who has frequent choking episodes", "c": "A client 1 day after cataract surgery who is alert and able to swallow normally", "d": "A client with a recent stroke who is awaiting a swallowing evaluation", "correct": "C", "domain": "Coordinated Care"}, {"n": 8, "q": "A client is scheduled for elective knee arthroscopy this afternoon. The client is alert, oriented, and has no legal restrictions on decision-making. The spouse tells the nurse, \"Don't tell my husband that the surgeon mentioned a chance of nerve injury. He gets anxious and might cancel.\" What is the nurse's best response?", "a": "Respect the spouse's request because reducing stress is therapeutic", "b": "Ask the surgeon to speak only with the spouse about the risks", "c": "Explain that the client has the right to receive complete information and make the decision personally", "d": "Document the spouse's concern and continue preparing the client for surgery", "correct": "C", "domain": "Coordinated Care"}, {"n": 9, "q": "A unit's pressure-injury prevention team finds that turning documentation is often incomplete on night shift. One staff member says, \"Let's just remind everyone to chart better.\" Which response best reflects stronger quality improvement reasoning?", "a": "That is enough because documentation problems are usually caused by carelessness", "b": "The team should first examine whether workflow, staffing, prompts, or the record design contribute to missed documentation", "c": "Night-shift staff should receive formal warnings before more data are reviewed", "d": "The best solution is to assign all turning documentation to one nurse each night", "correct": "B", "domain": "Coordinated Care"}, {"n": 10, "q": "A client is alert, oriented, and able to make decisions. The client tells the nurse, \"I want to update my advance directive because my preferences have changed since I wrote it.\" The client's spouse says, \"No, keep the old one. You already signed it.\" Which action by the nurse is most appropriate?", "a": "Tell the client the previous directive must stay in effect until reviewed by the family", "b": "Ask the provider to decide whether the client is allowed to make changes", "c": "Support the client's request to revise the directive and follow facility policy for updating the document", "d": "Postpone any changes until the client is discharged to avoid conflict", "correct": "C", "domain": "Coordinated Care"}, {"n": 11, "q": "A practical nurse asks a UAP to report a postoperative client’s urine output for the last 4 hours. The UAP reports 20 mL total. Which action by the nurse is best?", "a": "Document the finding as expected after surgery", "b": "Ask the UAP to encourage more oral fluids and recheck at the end of the shift", "c": "Assess the client and review possible causes of low urine output immediately", "d": "Instruct the UAP to irrigate the urinary catheter tubing", "correct": "C", "domain": "Coordinated Care"}, {"n": 12, "q": "A client is preparing for discharge after hospitalization for a diabetic foot ulcer. The wound is improving, but the client must continue dressing changes and pressure-relief measures at home. During discharge planning, the client says, \"I live in a rural area, my internet is unreliable, and the clinic is over an hour away. My son can bring me in only once a month.\" Which action by the nurse best supports a safe discharge plan?", "a": "Arrange home health services for wound assessment and care, if eligible", "b": "Instruct the client to return to the emergency department for all future dressing changes", "c": "Advise the client to stop walking on the foot until the next monthly clinic visit", "d": "Postpone discharge until the client can travel weekly to the clinic", "correct": "A", "domain": "Coordinated Care"}, {"n": 13, "q": "A clinic reviews its no-show rate for follow-up visits and finds that missed appointments are highest among clients who depend on public transportation. Which quality improvement response is most appropriate?", "a": "Discharge clients who miss more than one appointment", "b": "Schedule every client at the same time of day for consistency", "c": "Explore barriers and test reminders or transportation-support referrals for affected clients", "d": "Document the pattern and wait 6 months to see whether it improves on its own", "correct": "C", "domain": "Coordinated Care"}, {"n": 14, "q": "The practical nurse is deciding which task to complete first during morning rounds. Which action has the highest priority?\n\nA. Reposition a client who is due for turning and skin care in 20 minutes\nB. Reinforce incentive spirometer teaching for a client scheduled for discharge tomorrow\nC. Check a client with diabetes who received regular insulin and is now pale and diaphoretic before breakfast arrives\nD. Refill the water pitcher for a client on a regular diet", "a": "Reposition a client who is due for turning and skin care in 20 minutes", "b": "Reinforce incentive spirometer teaching for a client scheduled for discharge tomorrow", "c": "Check a client with diabetes who received regular insulin and is now pale and diaphoretic before breakfast arrives", "d": "Refill the water pitcher for a client on a regular diet", "correct": "C", "domain": "Coordinated Care"}, {"n": 15, "q": "A practical nurse is helping with a quality improvement project on a medical unit after several clients waited a long time for prescribed pain medication. Which project aim is written most appropriately?", "a": "Improve pain medication administration as much as possible soon", "b": "Decrease the average time from client request to pain medication administration on the medical unit from 35 minutes to 20 minutes within 8 weeks", "c": "Make sure every nurse gives pain medication faster starting today", "d": "Reduce all medication errors and client complaints on every unit this month", "correct": "B", "domain": "Coordinated Care"}, {"n": 16, "q": "During discharge teaching, a client asks, \"What is the main purpose of a durable power of attorney for health care?\" Which response by the nurse is best?", "a": "It allows a person you choose to make health care decisions for you if you become unable to decide for yourself", "b": "It lists every treatment you will accept or refuse in each possible future situation", "c": "It prevents providers from discussing your condition with your family under any circumstances", "d": "It becomes active whenever you are admitted to a hospital, even if you can still make decisions", "correct": "A", "domain": "Coordinated Care"}, {"n": 17, "q": "A practical nurse is assisting with discharge planning. An older client with mild hearing loss says, \"I do not want my neighbor involved in my care.\" Later, while the client is in the bathroom, the neighbor says, \"I drove her here and manage her pills at home. Just hand me the discharge instructions.\" What is the nurse's best action?", "a": "Give the instructions to the neighbor because the neighbor helps with medications", "b": "Wait until the client returns and ask whether the client wants the neighbor included", "c": "Provide the medication list only, but not the full instructions", "d": "Assume implied consent because the neighbor brought the client to the facility", "correct": "B", "domain": "Coordinated Care"}, {"n": 18, "q": "A client is being discharged after hospitalization for a new ileostomy. The client can empty the pouch independently but says, \"I'm worried about paying for supplies after the first box runs out.\" The prescribed medications have been filled, and the client has transportation to the follow-up visit. Which action by the nurse is most appropriate before discharge?", "a": "Arrange a referral to a social worker or case manager to help the client obtain ostomy supply resources", "b": "Instruct the client to reuse ostomy supplies as long as they appear clean", "c": "Tell the client to discuss supply costs at the follow-up visit after going home", "d": "Delay discharge until the client can pay for several months of supplies", "correct": "A", "domain": "Coordinated Care"}, {"n": 19, "q": "The practical nurse delegated routine premeal finger-stick glucose checks to a trained UAP for several stable clients. Which situation requires the nurse to intervene because the task is not appropriate to continue as assigned?", "a": "One client asks what the glucose number means for insulin dosing", "b": "A client says the lancet stings each time", "c": "A client requests the test be done before washing hands", "d": "The UAP has already checked glucose on two other clients successfully", "correct": "A", "domain": "Coordinated Care"}, {"n": 20, "q": "A practical nurse on a telemetry unit is notified of these client developments at the same time. Which client should the nurse assess first?", "a": "A client with atrial fibrillation whose heart rate is now 132/min and who reports new dizziness", "b": "A client with stable angina who wants assistance to the bathroom", "c": "A client 1 day after pacemaker insertion who reports mild incisional soreness rated 3/10", "d": "A client with hypertension whose scheduled breakfast tray has not arrived", "correct": "A", "domain": "Coordinated Care"}, {"n": 21, "q": "A practical nurse delegates routine morning weights to a UAP on a pediatric unit. Which client should the nurse instruct the UAP to weigh first because the result is most time-sensitive?", "a": "A child with nephrotic syndrome receiving diuretic therapy", "b": "A child with a healed arm fracture waiting for breakfast", "c": "A child admitted for observation after a mild concussion who is sleeping", "d": "A child with eczema scheduled for discharge teaching later in the day", "correct": "A", "domain": "Coordinated Care"}, {"n": 22, "q": "A practical nurse is caring for a client who has a large, uncontained draining abscess on the thigh. The provider has prescribed contact precautions. Which instruction is most appropriate to give the client's family members who want to visit?", "a": "They should wear a gown and gloves when they may have contact with the client or contaminated items in the room.", "b": "They should wear an N95 respirator whenever they enter the room.", "c": "They should avoid visiting until the drainage has completely stopped.", "d": "They should wear a sterile gown and sterile gloves before touching any item in the room.", "correct": "A", "domain": "Safety and Infection Prevention and Control"}, {"n": 23, "q": "The nurse is caring for a client with a new central venous catheter dressing. Which observation during the dressing change indicates a break in sterile technique?", "a": "The nurse uses a mask during the procedure", "b": "The nurse cleanses from the insertion site outward", "c": "The nurse places sterile gauze on the field after reaching across it", "d": "The nurse keeps sterile supplies above waist level", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 24, "q": "A student nurse prepares a sterile field and says, 'I can use this as long as I don't touch it.' Which response by the practical nurse is most accurate?", "a": "That is correct if the field stays dry", "b": "That is correct if the room door stays closed", "c": "That is incorrect because a sterile field must also remain in view and be protected from contamination", "d": "That is incorrect because sterile fields are used only in procedure rooms", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 25, "q": "A client with delirium is trying to climb over the bed rails and strike at staff during attempts to reorient. The nurse has already reduced noise, treated pain, offered toileting, and assigned one-to-one observation, but the behavior continues and the client is at immediate risk of injury. What is the best next action?", "a": "Continue verbal redirection only because restraints should never be used", "b": "Apply the most restrictive device available to guarantee immobility", "c": "Use a restraint only if necessary for immediate safety and continue reassessing for early removal", "d": "Wait for family to arrive before taking any further action", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 26, "q": "A nurse is preparing a client for surgery and reviews the preoperative checklist. The client reports a previous anaphylactic reaction to chlorhexidine used during a procedure. The skin-prep applicator placed in the room contains chlorhexidine, and the provider says, \"We use this for everyone.\" Which response by the nurse is most appropriate?", "a": "Proceed with the prep because the reaction happened in the past and may not recur", "b": "Apply a small amount first to check whether the client still reacts", "c": "Remove the chlorhexidine product and request an alternative prep solution before the procedure continues", "d": "Use the chlorhexidine prep but keep emergency medications available at the bedside", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 27, "q": "A practical nurse is preparing a sterile field for a central line dressing change. After opening the outer wrapper, the nurse notices a small tear in the sterile package containing the dressing supplies. The inner contents do not appear wet or visibly soiled. What should the nurse do?", "a": "Use the supplies because the contents still look clean", "b": "Use the supplies only if the tear is along the edge of the package", "c": "Tape the tear shut and continue with the dressing change", "d": "Discard the package and obtain a new sterile set", "correct": "D", "domain": "Safety and Infection Prevention and Control"}, {"n": 28, "q": "A newly licensed practical nurse asks when standard precautions should be used. Which response by the charge nurse is best?", "a": "Only when a client is known to have a communicable disease", "b": "Only in intensive care areas", "c": "With every client, regardless of diagnosis", "d": "With clients who require a private room", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 29, "q": "A nurse working in a dialysis center calls a client from the waiting room by first name. Two clients stand up. What should the nurse do next?", "a": "Choose the client who arrived first because the schedule is usually in order", "b": "Ask each client to state identifying information and verify it against the treatment record before proceeding", "c": "Have both clients sit near the dialysis station and sort it out with the charge nurse later", "d": "Use the client's appearance from prior visits to decide who is correct", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 30, "q": "A nurse in full PPE for isolation care is called to silence a beeping infusion pump in the hallway outside the room. What is the nurse's best action?", "a": "Touch the hallway pump with gloved hands because the task will take only a few seconds", "b": "Remove contaminated PPE as appropriate, perform hand hygiene, and then handle the pump", "c": "Ask the client to wait while the nurse handles the hallway pump without changing PPE", "d": "Use an alcohol wipe on the gloves, then adjust the hallway pump", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 31, "q": "A nurse preparing to check a client's blood glucose notices that the lancet device at the bedside appears to have been left in the room from the previous occupant. The nurse has not used the device, and no client exposure has occurred. Which action is most appropriate?", "a": "Use the device after wiping it with an alcohol pad because there was no direct client contact", "b": "Set the device aside, obtain appropriate single-client equipment, and report the near miss according to facility policy", "c": "Ask the client whether the previous occupant had any infections before deciding what to do", "d": "Document that no harm occurred and continue care without reporting the situation", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 32, "q": "Which statement by a newly licensed nurse shows correct understanding of incident reporting?", "a": "Only events that cause injury need to be reported", "b": "Near misses should be reported so the team can identify safety problems", "c": "Incident reports replace charting in the medical record", "d": "Reporting an incident means the nurse is admitting fault", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 33, "q": "A nurse notices that the wrong-size blood pressure cuff was used earlier on a client, producing a falsely high reading that was entered in the chart. No treatment was based on the reading. What is the best reason to report and correct this event?", "a": "Only treatment errors matter, so reporting is unnecessary here", "b": "Incorrect assessment data can influence later decisions even if no immediate action was taken", "c": "The reading should stay in the chart because it was recorded at the time", "d": "The nurse should wait to see if the next blood pressure is also high", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 34, "q": "A nurse must transfer a client from bed to a chair. The client can follow directions and move the arms well but has a new below-knee amputation, poor standing balance, and is ordered not to bear weight on the remaining foot until fitted with protective footwear. Which transfer method is most appropriate?\n\nA. Stand-pivot transfer with a gait belt\nB. Transfer board with close assistance\nC. Sit-to-stand lift\nD. Have the client hop to the chair with one assistant", "a": "Stand-pivot transfer with a gait belt", "b": "Transfer board with close assistance", "c": "Sit-to-stand lift", "d": "Have the client hop to the chair with one assistant", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 35, "q": "A nurse is reinforcing teaching with the parent of a 6-month-old infant. Which observation should the nurse identify as an expected developmental finding?", "a": "The infant pulls to a standing position while holding onto furniture", "b": "The infant sits briefly leaning forward on both hands", "c": "The infant uses 2-word phrases to request a toy", "d": "The infant hops on one foot without support", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 36, "q": "A nurse is teaching a pregnant client about daily fetal movement awareness. Which statement by the client shows correct understanding?", "a": "If I notice the baby is moving much less than usual, I should contact my healthcare provider", "b": "The baby should move the same number of times every hour, every day", "c": "I only need to monitor movement if I have abdominal pain", "d": "Fetal movement usually disappears near the end of pregnancy because space is limited", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 37, "q": "A nurse is assessing a stable postpartum client 2 hours after birth. Which finding is most concerning and requires immediate follow-up?", "a": "Pulse rate of 58/min", "b": "Temperature of 37.4°C (99.3°F)", "c": "Saturating a perineal pad in 15 minutes", "d": "Mild shivering", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 38, "q": "During an intake interview at a family clinic, a practical nurse collects health information from several adult clients. Which client information most strongly suggests the need for individualized screening recommendations rather than relying only on routine age-based screening?", "a": "A client reports drinking 1 cup of coffee each morning.", "b": "A client states that both a parent and a sibling were diagnosed with the same type of cancer.", "c": "A client says they usually sleep 7 hours each night.", "d": "A client reports walking the dog for 20 minutes most evenings.", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 39, "q": "A nurse is reinforcing teaching with the parent of a 3-month-old infant. Which observation should the nurse expect the parent to report?", "a": "The infant smiles socially at familiar people", "b": "The infant says three clear words", "c": "The infant walks while holding on to furniture", "d": "The infant drinks from a cup without spilling", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 40, "q": "A nurse is collecting a health history from an adult client who states, \"I haven't been sleeping well lately.\" Which follow-up question is best to further assess this concern?", "a": "What time do you usually go to bed and wake up?", "b": "How many hours of exercise do you get each week?", "c": "Did either of your parents have trouble sleeping?", "d": "Have you ever had surgery for a sleep problem?", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 41, "q": "A nurse is providing instructions about infant immunizations to a client. During the conversation, the client repeatedly looks away, fidgets with the blanket, and says, \"I don't want to ask a dumb question.\" Which response by the nurse is best to reduce this communication barrier?", "a": "“The instructions are simple, so just follow the schedule I gave you.”", "b": "“Save your questions for the provider, since immunizations can be complicated.”", "c": "“Many people have questions about vaccines. What concerns do you have?”", "d": "“If you are unsure later, read the handout again at home.”", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 42, "q": "A nurse is reinforcing discharge teaching for the parent of a 15-month-old child who received several routine immunizations at a well-child visit. Which instruction should the nurse include about the injection sites?", "a": "Apply a warm, moist compress to the sites if they become sore", "b": "Massage the sites for 5 minutes every hour while the child is awake", "c": "Cover the sites with airtight dressings for 24 hours", "d": "Clean the sites with alcohol every 2 hours for the rest of the day", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 43, "q": "A nurse is teaching a client about self-administration of insulin. The client says, \"I didn't sleep at all last night because my baby cried the whole time.\" During the teaching session, the client yawns, loses track of the steps, and asks the nurse to start over twice. Which action by the nurse is best?", "a": "Continue the teaching session and provide a printed handout for the client to read later", "b": "Ask a family member to listen to the teaching and explain it to the client afterward", "c": "Postpone the teaching until the client is more rested and then re-teach the skill in short steps", "d": "Speak more loudly and repeat each instruction several times without changing the timing", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 44, "q": "A resident with moderate dementia is sitting in the day room folding and unfolding a washcloth. The resident asks the practical nurse, \"What time is the train leaving? I need to meet my husband.\" The resident appears calm and is not trying to leave the unit. Which response by the practical nurse is most appropriate?", "a": "“There is no train. You live here now, and your husband died years ago.”", "b": "“Your husband knows where you are. Tell me about where you used to meet him.”", "c": "“You already asked that several times, so try to remember what I told you.”", "d": "“If you stop talking about the train, I will help you find a snack.”", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 45, "q": "A client with a new colostomy looks away and says, \"Don't even show me that bag.\" Which response by the nurse is most therapeutic at this time?", "a": "You need to learn this before discharge.", "b": "Many clients get used to it within a few days.", "c": "What concerns you most when you look at it?", "d": "If you avoid it now, recovery will be harder later.", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 46, "q": "A client who was recently diagnosed with Parkinson disease tells the nurse, \"I keep thinking about how much worse this will get, so I haven't read any of the teaching materials or told my family yet.\" Which response by the nurse is most appropriate to promote effective coping?", "a": "“Try not to think about the future right now, because stress can make symptoms worse.”", "b": "“Let’s focus on one manageable step today, such as reviewing the information together and deciding whom you would like to tell first.”", "c": "“You should tell your family everything tonight so they can start making plans for you.”", "d": "“It is normal to feel overwhelmed, so you can wait until you feel ready to deal with this.”", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 47, "q": "An older adult with moderate dementia is becoming more confused during meals and often stops eating after a few bites. The practical nurse notices the client is seated in a noisy dining room near a television and several other residents who are talking loudly. Which intervention is most appropriate to support the client's food intake?", "a": "Move the client to a quieter area with fewer distractions during meals", "b": "Offer several different foods at once to increase the client's interest", "c": "Ask different staff members to encourage the client throughout the meal", "d": "Remind the client repeatedly that finishing the meal is necessary", "correct": "A", "domain": "Psychosocial Integrity"}, {"n": 48, "q": "A nurse is caring for a client who is scheduled for surgery the next morning. The client says, \"In my culture, major family decisions are discussed with my older brother before I agree.\" The client is alert, oriented, and able to make decisions. Which action by the nurse is most appropriate?", "a": "Tell the client that medical decisions must be made independently without family involvement", "b": "Ask the client whether they would like the older brother included in the discussion before making a decision", "c": "Contact the older brother and ask him to provide consent for the surgery", "d": "Delay all teaching until the older brother arrives, even if the client wants information now", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 49, "q": "A client with terminal liver disease who is receiving end-of-life care tells the nurse, \"I want my roommate from the shelter to visit, but my family says only relatives should be here now.\" Which nursing action is most appropriate?", "a": "Tell the family that visitation decisions must be made only by the healthcare team", "b": "Ask the client whom they want included in visits and support that preference as able", "c": "Explain to the client that family members have the right to limit visitors at the end of life", "d": "Delay the visit until the family agrees so conflict can be avoided", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 50, "q": "A nurse is preparing discharge instructions for a client who had a myocardial infarction. The client says, \"Please explain the plan to my wife first. In our family, she manages health decisions and medicines.\" The client is alert, oriented, and states, \"I want to be part of the discussion too.\" Which action by the nurse is most appropriate?", "a": "Provide all instructions only to the wife because the client identified her as the decision-maker", "b": "Ask the client for permission to include the wife, then review the instructions with both of them together", "c": "Tell the client that discharge teaching must be given only to the client, not to family members", "d": "Delay all teaching until the provider can determine who should receive the information", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 51, "q": "A client with moderate dementia becomes upset when asked to brush their teeth and says, \"I already did that! Leave me alone.\" The practical nurse sees that the toothbrush is dry and the sink has not been used. Which action is most appropriate?", "a": "Tell the client firmly that the teeth must be brushed now to prevent infection", "b": "Argue briefly with the client to remind them that they have not brushed their teeth yet", "c": "Offer the toothbrush, give one simple step at a time, and provide calm praise during the task", "d": "Skip oral care for the day to avoid increasing the client's frustration", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 52, "q": "A nurse is interviewing a client with a history of substance misuse. Which statement by the nurse uses therapeutic communication?", "a": "You need to promise that you will stop using drugs today", "b": "Why would you do this to yourself after treatment?", "c": "Tell me what substance use has been like for you recently", "d": "If you don't quit now, your life will get worse", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 53, "q": "A nurse is caring for a client who becomes tense before each dressing change. Which intervention is best to reduce anticipatory stress?", "a": "Perform the dressing change as quickly as possible without explaining the steps", "b": "Teach the client to use a relaxation technique shortly before and during the procedure", "c": "Delay the dressing change until the client no longer mentions feeling stressed", "d": "Ask family members to leave so the client can face the procedure alone", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 54, "q": "A client who identifies as genderqueer is admitted for treatment of pneumonia. During report, the nurse learns that several staff members have been unsure what terms to use when discussing the client's body parts during care. Which nursing action is best to support safe, respectful care?", "a": "Ask the client which name, pronouns, and anatomy terms they prefer staff to use during care and document this information for the team", "b": "Use the terminology listed in the medical record so all staff members remain consistent", "c": "Avoid discussing anatomy unless the client brings it up first to prevent embarrassment", "d": "Limit communication to yes-or-no questions until the primary provider clarifies the client's gender status", "correct": "A", "domain": "Psychosocial Integrity"}, {"n": 55, "q": "A client who lost a job 2 weeks ago tells the nurse, \"I stay in bed most of the day, and I stopped answering calls from my friends.\" Which nursing response is most appropriate to promote coping?", "a": "“You need to force yourself to get out more so you do not become depressed.”", "b": "“What activities or people have helped you handle stressful times in the past?”", "c": "“It is best to avoid talking about the loss until you feel ready.”", "d": "“You should focus on finding a new job right away to stay busy.”", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 56, "q": "A client with osteomyelitis of the lower leg reports throbbing pain that becomes worse when the leg hangs down while sitting in a chair. Which nonpharmacologic intervention should the nurse implement first?", "a": "Encourage the client to ambulate in the hallway every 2 hours", "b": "Elevate the affected leg on pillows while the client is resting", "c": "Massage the painful leg for 10 minutes every 4 hours", "d": "Apply a heating pad to the lower leg continuously", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 57, "q": "Which client observation should the practical nurse report first as a possible sign of fluid volume deficit?", "a": "Urine output of 20 mL over 2 hours", "b": "Pale yellow urine in the drainage bag", "c": "Client requests water with meals", "d": "Moist oral mucosa after mouth care", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 58, "q": "A nurse is reinforcing teaching for a client who is trying to prevent constipation without medication. Which client statement shows correct understanding?", "a": "I should ignore the urge to have a bowel movement until it is more convenient.", "b": "I will try to set aside time each day for bowel elimination.", "c": "I should limit fluid intake so my abdomen does not feel full.", "d": "I will stay in bed more to conserve energy.", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 59, "q": "A nurse is assisting a client who has left-sided weakness to climb stairs using a cane. Which instruction should the nurse give the client?", "a": "Advance the cane and weaker left leg first when going up the stairs", "b": "Lead with the stronger right leg when going up the stairs", "c": "Place the cane on the upper step before moving either leg down the stairs", "d": "Lead with the weaker left leg when going down the stairs", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 60, "q": "A nurse is caring for a client who has a left above-the-elbow amputation and is learning to perform personal hygiene independently. Which nursing action best promotes the client's ability to complete this activity of daily living?", "a": "Encourage the client to practice grooming with adaptive devices and allow extra time to complete the task", "b": "Complete the hygiene routine for the client to prevent frustration", "c": "Ask a family member to perform hygiene care until the client receives a prosthesis", "d": "Limit hygiene to once daily to reduce the client's energy use", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 61, "q": "A hospitalized client says, \"I can never sleep because someone is always coming into my room.\" Which nursing action best addresses this concern?", "a": "Explain that sleep loss is unavoidable in the hospital", "b": "Ask the provider for a sedative each night", "c": "Coordinate care so treatments and assessments are done together when possible", "d": "Encourage the client to stay awake during the day and all evening", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 62, "q": "A client who is on bed rest slides down in bed and is repositioned upward several times during the shift. Which intervention best helps prevent skin injury related to this movement?", "a": "Massage the reddened areas after each repositioning", "b": "Raise the head of the bed to 60 degrees at all times", "c": "Use a lift sheet to move the client up in bed", "d": "Place powder on the sheets to reduce moisture", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 63, "q": "A nurse is preparing to obtain a stool specimen for occult blood testing. Which instruction should the nurse give the client?", "a": "Collect the specimen from water in the toilet bowl", "b": "Avoid contaminating the stool with urine", "c": "Store the specimen without labeling it until transport", "d": "Mix the stool with tissue paper to absorb extra moisture", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 64, "q": "A client on strict intake and output receives a continuous enteral feeding at 50 mL/hr from 8:00 a.m. to 2:00 p.m. The nurse also administers 60 mL of water to flush the tube at 10:00 a.m. and again at 2:00 p.m. How much intake should the nurse record for this time period?", "a": "300 mL", "b": "360 mL", "c": "420 mL", "d": "480 mL", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 65, "q": "While providing skin care around a feeding tube site, the nurse notes moist redness where gastric drainage has been leaking onto the surrounding skin. Which intervention is most appropriate to help protect the skin?", "a": "Apply a skin barrier product around the site", "b": "Massage the reddened area twice per shift", "c": "Cover the area with a heating pad", "d": "Tighten the external device to stop all movement", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 66, "q": "The nurse receives these prescriptions for the same patient. Which route should the nurse clarify with the provider before administration because it is unsafe based on route designation alone?\n\n1. Carbamide peroxide drops: 5 drops in the left ear\n2. Artificial tears: 2 drops in each eye\n3. Enteric-coated aspirin: crush and give through the mouth\n4. Albuterol: 2 puffs by inhalation", "a": "1", "b": "2", "c": "3", "d": "4", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 67, "q": "A client with angina pectoris receives sublingual nitroglycerin for chest pain rated 7/10. Which finding best indicates the medication has had the intended therapeutic effect?", "a": "The client's blood pressure decreases from 148/86 mm Hg to 118/72 mm Hg", "b": "The client reports chest pain has decreased to 1/10 within 5 minutes", "c": "The client develops a mild throbbing headache", "d": "The client's heart rate increases from 76/min to 92/min", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 68, "q": "A practical nurse is preparing a client's 0900 medications. The MAR lists metoprolol tartrate 25 mg PO daily. While reviewing the chart, the nurse sees a provider prescription entered at 0700 that changes the dose to metoprolol tartrate 12.5 mg PO daily because of low blood pressure overnight. The MAR has not been updated yet, and the 0900 dose has not been given. What is the nurse's best action?", "a": "Administer 25 mg as listed on the MAR because it is the current administration record", "b": "Administer 12.5 mg based on the most recent prescription after following facility procedure to resolve the MAR discrepancy", "c": "Hold the medication and wait until the next day for the MAR to update automatically", "d": "Ask the client whether 25 mg or 12.5 mg is the usual home dose before giving the medication", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 69, "q": "A nurse is reconciling medications for a client transferred from a rehabilitation facility. The transfer record lists digoxin 0.125 mg PO daily. The new admission orders also include digoxin 0.25 mg PO daily, and both entries appear active on the MAR. The client's apical pulse is 58/min, and the latest digoxin level is not yet available. What is the nurse's best action?", "a": "Administer the lower dose only, since it is less likely to cause harm", "b": "Administer both doses because both are active on the MAR and clarify later", "c": "Hold digoxin and urgently clarify which order is correct before administration", "d": "Delete the transfer entry from the MAR because new admission orders always replace prior medications", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 70, "q": "A nurse is preparing a dose of nystatin oral suspension for an infant and finds that the bottle has been stored in the medication refrigerator. Which action is most appropriate before administering the medication?", "a": "Shake the bottle well and administer the medication as scheduled", "b": "Warm the medication in the microwave for 10 seconds before use", "c": "Hold the dose and ask the pharmacy to dispense a new bottle", "d": "Mix the medication with formula to improve tolerance", "correct": "A", "domain": "Pharmacological Therapies"}, {"n": 71, "q": "The nurse is about to Y-site two IV medications and cannot confirm compatibility in the available references. What is the best action?", "a": "Administer them together because both are prescribed for the same client", "b": "Flush the line with sterile water and proceed", "c": "Use separate IV access or separate administration times until compatibility is verified", "d": "Mix a small sample of the medications in a syringe and observe for particles", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 72, "q": "A client says, \"I don't want that pain pill right now.\" Which nursing action best supports the client's medication rights?", "a": "Crush the medication and mix it in pudding", "b": "Tell the client the dose cannot be skipped once prepared", "c": "Document the refusal and assess the reason for declining", "d": "Leave the medication at the bedside in case the client changes their mind", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 73, "q": "A practical nurse gives a prescribed controlled opioid to a client at 1400. At 1600, the client tells the nurse, \"I think you forgot my pain medicine earlier.\" The medication administration record shows the dose was documented as given at 1400. Which action by the nurse is best?", "a": "Tell the client the medication was already documented and cannot be discussed further", "b": "Document the client statement and give another dose to maintain comfort", "c": "Assess the client, verify the medication record, and investigate the concern according to facility policy", "d": "Ask another nurse to decide whether the medication was actually given", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 74, "q": "A patient takes linezolid for a resistant skin infection. During discharge teaching, which over-the-counter medication should the nurse instruct the patient to avoid unless approved by the provider?", "a": "Pseudoephedrine nasal decongestant", "b": "Calcium carbonate antacid", "c": "Docusate stool softener", "d": "Artificial tears", "correct": "A", "domain": "Pharmacological Therapies"}, {"n": 75, "q": "A nurse is deciding whether a prescribed medication should be given by the intramuscular or subcutaneous route. Which factor is most important to verify first?", "a": "The nurse's personal preference for injection technique", "b": "Whether the patient ate within the last hour", "c": "The medication's prescribed route and formulation", "d": "Whether the patient prefers the left side of the body", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 76, "q": "A nurse needs to administer 180 mL of IV antibiotic over 90 minutes using tubing calibrated at 10 gtt/mL. How many drops per minute should the nurse regulate?", "a": "12 gtt/min", "b": "20 gtt/min", "c": "30 gtt/min", "d": "45 gtt/min", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 77, "q": "A nurse is comparing medication routes for a patient who has intermittent nausea, poor appetite, and an intact skin surface. Which route would provide continuous systemic delivery over many hours without requiring swallowing?", "a": "Transdermal", "b": "Sublingual", "c": "Inhalation", "d": "Ophthalmic", "correct": "A", "domain": "Pharmacological Therapies"}, {"n": 78, "q": "A patient takes simvastatin every evening. Which new prescription should the nurse identify as creating the greatest risk for a serious interaction?", "a": "Azithromycin", "b": "Amoxicillin", "c": "Erythromycin", "d": "Cephalexin", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 79, "q": "A nurse is about to perform a bedside urine dipstick test for a client with suspected dehydration. While gathering supplies, the nurse notices the reagent strip container expired 3 days ago but has remained tightly capped and appears dry. What is the nurse's best action?", "a": "Use the strips because the container was sealed and expired only recently", "b": "Use the strips for this client, but document that the expiration date has passed", "c": "Discard the expired strips and obtain a new, in-date reagent strip container", "d": "Perform the test with the expired strip, then confirm only abnormal results with the laboratory", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 80, "q": "A nurse is preparing to obtain a venous blood specimen from an adult client. The client repeatedly pumps and opens the fist while the tourniquet is in place to make the veins easier to see. Which nursing action is most appropriate?", "a": "Continue with the procedure because fist pumping improves vein access without affecting results", "b": "Ask the client to relax the hand and keep the fist still while the nurse proceeds", "c": "Remove the tourniquet and apply it more tightly above the selected site", "d": "Have the client lower the arm below heart level and keep pumping the fist until the vein enlarges", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 81, "q": "A nurse needs to obtain a blood culture from a client with suspected sepsis. Which action is most important to reduce contamination of the specimen?", "a": "Collect the specimen immediately after administering the first antibiotic dose", "b": "Use sterile technique and cleanse the site thoroughly before collection", "c": "Draw the specimen through any available peripheral IV line to avoid another needle stick", "d": "Apply the tourniquet and leave it in place until all bottles are filled", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 82, "q": "A practical nurse is reviewing data for a client receiving packed red blood cells. Which new finding should be identified as the greatest risk for an acute transfusion reaction?\n\nA. Temperature increase from 98.4°F to 100.4°F (36.9°C to 38.0°C), chills, and low back pain 15 minutes after the infusion started\nB. Urine output of 45 mL/hr during the transfusion\nC. Mild sleepiness after receiving an antihistamine before the transfusion\nD. Blood pressure remaining at the client's baseline", "a": "Temperature increase from 98.4°F to 100.4°F (36.9°C to 38.0°C), chills, and low back pain 15 minutes after the infusion started", "b": "Urine output of 45 mL/hr during the transfusion", "c": "Mild sleepiness after receiving an antihistamine before the transfusion", "d": "Blood pressure remaining at the client's baseline", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 83, "q": "The practical nurse is reassessing a client with dehydration after several hours of IV fluid therapy. Which change best suggests improvement?", "a": "Heart rate decreases from 118/min to 92/min", "b": "Temperature increases from 98.7°F (37.1°C) to 100.2°F (37.9°C)", "c": "Respirations increase from 18/min to 26/min", "d": "Blood pressure decreases from 110/70 mm Hg to 90/58 mm Hg", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 84, "q": "A pregnant client with type 1 diabetes tells the nurse, \"I keep having shakiness and sweating before lunch.\" Which response is best?", "a": "Those are expected discomforts of pregnancy and do not need treatment.", "b": "You may be having hypoglycemia; check your blood glucose and treat it promptly.", "c": "Skip breakfast so your blood sugar will not rise too much in the morning.", "d": "Reduce all carbohydrate intake for the rest of the pregnancy.", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 85, "q": "A nurse is caring for a client receiving warfarin therapy. Which laboratory result best indicates that the medication is having its intended effect?", "a": "International normalized ratio (INR) is prolonged into the prescribed therapeutic range", "b": "Platelet count has increased above the expected reference range", "c": "White blood cell count has decreased", "d": "Serum sodium level has normalized", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 86, "q": "A client is scheduled for a cardiac catheterization in 1 hour. Which finding is most important for the nurse to report to the provider before the procedure?", "a": "The client ate a full breakfast 3 hours ago", "b": "The client reports an allergy to iodine-based antiseptics", "c": "The client takes acetaminophen for headaches", "d": "The client has a blood pressure of 138/84 mm Hg", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 87, "q": "A client is scheduled for an electroencephalogram (EEG) this afternoon. Which statement by the client requires the nurse to follow up before the test?", "a": "I washed my hair this morning and did not use conditioner.", "b": "I had coffee and an energy drink to help me stay awake for the test.", "c": "I removed my metal hair clips before coming to the hospital.", "d": "I understand that the test records electrical activity in my brain.", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 88, "q": "A nurse is preparing to obtain a venous blood specimen from an adult client. After cleansing the site with antiseptic, the nurse palpates the vein again with an ungloved finger just before inserting the needle. Which action should the nurse take next?", "a": "Insert the needle because the site was already cleaned", "b": "Cleanse the site again with antiseptic and allow it to dry", "c": "Apply the tourniquet more tightly before inserting the needle", "d": "Ask the client to make a fist repeatedly while the needle is inserted", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 89, "q": "A practical nurse is asked to recheck a blood pressure that seemed unexpectedly low. Which finding most strongly suggests the original reading may have been falsely low due to technique?", "a": "The cuff bladder was too narrow for the client's arm", "b": "The client had smoked a cigarette just before the reading", "c": "The client's arm was positioned above heart level", "d": "The client was talking during the measurement", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 90, "q": "A nurse performs a bedside urine dipstick test on a client with dysuria. The specimen appears cloudy and dark orange. The dipstick shows a positive leukocyte esterase result but a negative nitrite result. Which interpretation is most appropriate?", "a": "A urinary tract infection is ruled out because the nitrite result is negative", "b": "The specimen is invalid because cloudy urine cannot be tested with a dipstick", "c": "The findings may still be consistent with urinary tract irritation or infection and should be correlated with the client's symptoms", "d": "The positive leukocyte esterase result confirms contamination from vaginal secretions", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 91, "q": "A nurse is caring for an older adult with a urinary tract infection. Which change is most important to recognize as a possible sign of worsening condition?", "a": "The client refuses breakfast", "b": "The client becomes acutely disoriented to place", "c": "The client reports burning with urination", "d": "The client requests an extra blanket", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 92, "q": "The nurse is caring for a client on a ventilator. Which finding requires immediate action?", "a": "Pulse oximetry decreases from 97% to 88%", "b": "The client needs oral care", "c": "Condensation is visible in the ventilator tubing", "d": "The client has mild abdominal distention", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 93, "q": "A client 6 hours after a carotid endarterectomy suddenly becomes difficult to arouse. The nurse notes a blood pressure of 198/104 mm Hg, a severe headache, and weakness of the right arm. Which action should the nurse take first?", "a": "Document the findings and recheck the client in 15 minutes", "b": "Place the client flat in bed to improve cerebral perfusion", "c": "Notify the provider or rapid response team immediately", "d": "Administer the prescribed PRN opioid for headache relief", "correct": "C", "domain": "Physiological Adaptation"}, {"n": 94, "q": "A client with heart failure is receiving furosemide. Which assessment finding requires the nurse's immediate follow-up?", "a": "Irregular pulse and generalized weakness", "b": "Blood pressure of 132/78 mm Hg", "c": "Urine output of 900 mL over 8 hours", "d": "Complaint of increased thirst after breakfast", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 95, "q": "A nurse is caring for a client with a tracheostomy who has noisy respirations, visible secretions at the opening, and an oxygen saturation that has dropped from 96% to 90%. What is the nurse's priority action?", "a": "Suction the tracheostomy", "b": "Change the tracheostomy ties", "c": "Clean the stoma with saline", "d": "Obtain a sputum specimen", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 96, "q": "The nurse reviews laboratory results for four clients. Which result should the nurse identify as most consistent with dehydration?", "a": "Hematocrit 53%", "b": "Hemoglobin 11 g/dL", "c": "White blood cell count 8,000/mm3", "d": "Platelet count 250,000/mm3", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 97, "q": "A client with long-standing osteoporosis asks the practical nurse how to lower the risk of fractures at home. Which instruction is most appropriate?", "a": "Keep walkways clear and use nonskid footwear when walking", "b": "Limit daily activity to avoid putting stress on the bones", "c": "Bend from the waist when lifting light objects from the floor", "d": "Take calcium supplements only when bone pain occurs", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 98, "q": "A client with chronic heart failure is prescribed a 2-gram sodium diet. During meal planning, which lunch choice is most appropriate?", "a": "Canned tomato soup with crackers and deli turkey slices", "b": "Baked chicken breast, brown rice, and steamed green beans", "c": "Ham and cheese sandwich with pickles", "d": "Instant noodles with a side of cottage cheese", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 99, "q": "A client 2 days after a subtotal gastrectomy suddenly reports severe abdominal pain. The nurse finds the abdomen rigid and distended, temperature 38.9°C (102°F), heart rate 124/min, blood pressure 88/54 mm Hg, and respirations 28/min. Which complication should the nurse suspect?", "a": "Peritonitis from an anastomotic leak", "b": "Dumping syndrome", "c": "Postoperative atelectasis", "d": "Paralytic ileus", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 100, "q": "A nurse is assessing a client's wound 3 days after a drain was removed. Which finding should the nurse identify as most concerning and report to the provider?", "a": "A small amount of clear pink drainage on the outer dressing", "b": "Wound edges that are slightly swollen and tender", "c": "A sudden increase in wound drainage with a bulging area beneath the incision", "d": "Mild itching at the incision site", "correct": "C", "domain": "Physiological Adaptation"}], ["Safety and Infection Prevention and Control", "Health Promotion and Maintenance", "Psychosocial Integrity", "Basic Care and Comfort", "Pharmacological Therapies", "Reduction of Risk Potential", "Physiological Adaptation", "Coordinated Care"]);</script>
