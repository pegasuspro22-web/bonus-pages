<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation Test 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#2a2419; --paper:#faf7f1; --raised:#ffffff; --line:#e6ddc9;
  --accent:#2f6f9e; --accent-ink:#ffffff; --alert:#b9791f; --alert-soft:#fbeed7;
  --danger:#b1483a; --correct:#3f9463; --muted:#5f574a; --muted-2:#7c7364;
  --shadow: 0 1px 2px rgba(42,36,25,.05), 0 10px 28px -14px rgba(42,36,25,.18);
}
*{box-sizing:border-box;}
body{background:var(--paper); color:var(--ink); font-family:'Public Sans',system-ui,sans-serif; margin:0; line-height:1.5; font-size:16.5px;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0; letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:inherit;} button{font-family:inherit; cursor:pointer;}
.page{max-width:640px; margin:0 auto; padding:3rem clamp(1.25rem,5vw,2rem) 4rem;}
.page.wide{max-width:880px;}
.back-link{font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--muted-2); text-decoration:none; display:inline-block; margin-bottom:1.5rem;}
.hero{text-align:center;}
.hero .eyebrow{display:flex; justify-content:center;}
.hero .lede{max-width:520px; margin-left:auto; margin-right:auto;}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600;}
.lede{color:var(--muted); font-size:1.05rem; line-height:1.6; margin-top:.9rem;}
.cta{
  display:inline-flex; align-items:center; gap:.5rem; background:var(--accent); color:var(--accent-ink);
  padding:1.05rem 2.1rem; border-radius:999px; font-weight:800; font-size:1rem; text-decoration:none; border:none;
  text-transform:uppercase; letter-spacing:.03em;
  box-shadow:0 6px 18px -4px color-mix(in srgb, var(--accent) 55%, transparent);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cta:hover{transform:translateY(-2px); box-shadow:0 10px 22px -4px color-mix(in srgb, var(--accent) 65%, transparent);}
.cta.ghost{background:var(--raised); color:var(--ink); border:2px solid var(--line); box-shadow:var(--shadow);}
.cta.ghost:hover{border-color:var(--accent); color:var(--accent);}
.cta.big{padding:1.25rem 2.6rem; font-size:1.08rem;}
.cta-wrap{display:flex; justify-content:center; align-items:center; margin-top:1.75rem; flex-direction:column; gap:.75rem;}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin:1.75rem 0;}
.stat{background:var(--raised); padding:1.1rem 1rem;}
.stat .n{font-family:'Fraunces',serif; font-size:1.9rem; font-weight:600;}
.stat .l{font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); margin-top:.2rem;}
.card-list{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line); margin-top:1.5rem;}
.card{padding:1.25rem 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:1.5rem; align-items:center;}
.card h3{font-size:1.05rem; font-weight:600; font-family:'Public Sans',sans-serif;}
.card p{color:var(--muted); font-size:.94rem; margin:.35rem 0 0; line-height:1.55;}
.tag{font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); background:var(--raised); border:2px solid var(--line); padding:.5rem .9rem; border-radius:999px; white-space:nowrap; text-decoration:none;}
.tag:hover{border-color:var(--accent);}
.step-list{counter-reset:step; margin:1.75rem 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:1.1rem;}
.step-list li{counter-increment:step; display:flex; gap:1rem; align-items:flex-start;}
.step-list li::before{
  content:counter(step); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.85rem;
  background:var(--ink); color:var(--paper); width:1.6rem; height:1.6rem; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:.1rem;
}
.step-list h3{font-size:1rem; font-weight:700; font-family:'Public Sans',sans-serif;}
.step-list p{color:var(--muted); font-size:.95rem; margin:.25rem 0 0; line-height:1.6;}
.action-block{margin-top:.9rem; display:flex; flex-wrap:wrap; align-items:center; gap:.7rem;}
.subject-chip{font-family:'IBM Plex Mono',monospace; font-size:.82rem; background:var(--paper); border:1.5px dashed var(--line); border-radius:8px; padding:.6rem .9rem; color:var(--ink);}
.subject-chip b{color:var(--accent);}
.callout{background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:1.75rem; box-shadow:var(--shadow); margin-top:1.75rem;}
.callout.alert{border-color:var(--alert); background:var(--alert-soft);}
.foot{margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--line); color:var(--muted-2); font-size:.78rem; line-height:1.6;}
.faq dt{font-weight:700; margin-top:1.1rem;}
.faq dd{margin:.35rem 0 0; color:var(--muted); font-size:.95rem; line-height:1.6;}
@media (max-width:520px){
  .card{flex-direction:column; align-items:flex-start; gap:.6rem;}
  .card > a.tag{align-self:stretch; text-align:center;}
}

.quiz-head{display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:1.25rem;}
.progress{font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--muted);}
.qcard{border:1px solid var(--line); border-radius:8px; padding:1.4rem; margin-top:1.25rem; background:var(--raised); box-shadow:var(--shadow);}
.qn{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--muted-2); display:flex; justify-content:space-between;}
.qtext{margin-top:.6rem; font-size:1rem; line-height:1.55; white-space:pre-wrap;}
.domain-pill{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.04em; text-transform:uppercase; background:var(--paper); border:1px solid var(--line); padding:.2rem .55rem; border-radius:3px; color:var(--muted);}
.opts{display:flex; flex-direction:column; gap:.55rem; margin-top:1.1rem;}
.opt{display:flex; gap:.7rem; align-items:flex-start; border:1px solid var(--line); border-radius:6px; padding:.65rem .8rem; font-size:.92rem; line-height:1.45;}
.opt input{margin-top:.25rem;} .letter{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--muted-2);}
.opt.correct{border-color:var(--correct); background:color-mix(in srgb, var(--correct) 14%, var(--raised));}
.opt.wrong{border-color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, var(--raised));}
.quiz-actions{display:flex; justify-content:center; margin-top:2rem; gap:.75rem;}
.score-panel{border:1px solid var(--line); border-radius:8px; padding:1.5rem; background:var(--raised); margin-top:1.25rem; box-shadow:var(--shadow);}
.score-big{font-family:'Fraunces',serif; font-size:2.4rem; font-weight:600;}
.domain-bars{display:flex; flex-direction:column; gap:.5rem; margin-top:1.25rem;}
.dbar-row{display:grid; grid-template-columns:minmax(120px,200px) 1fr 3.2rem; gap:.6rem; align-items:center; font-size:.82rem;}
.dbar-track{height:8px; background:var(--paper); border:1px solid var(--line); border-radius:4px; overflow:hidden;}
.dbar-fill{height:100%; background:var(--correct);}
.dname{color:var(--muted);} .dpct{font-family:'IBM Plex Mono',monospace; text-align:right; color:var(--muted-2);}
</style>
</head>
<body>

<div class="page wide">
  <div class="quiz-head">
    <div><div class="eyebrow">Self-hosted · no rationales shown</div><h1 style="font-size:1.5rem;">Simulation Test 2</h1></div>
    <span class="progress" id="quiz-progress"></span>
  </div>
  <div id="quiz-body"></div>
  <div class="quiz-actions">
    <button class="cta ghost" id="btn-reset" style="display:none;">Restart</button>
    <button class="cta" id="btn-submit">Submit test</button>
  </div>
  <div id="score-area"></div>
</div>
<script>
function runQuiz(questions, domainOrder){
  const body = document.getElementById('quiz-body');
  const answers = {};
  questions.forEach(function(q){
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = '<div class="qn"><span>Question ' + q.n + ' / ' + questions.length + '</span><span class="domain-pill">' + (q.domain||'') + '</span></div><div class="qtext"></div><div class="opts"></div>';
    card.querySelector('.qtext').textContent = q.q;
    const opts = card.querySelector('.opts');
    ['a','b','c','d'].forEach(function(letter){
      const label = document.createElement('label');
      label.className = 'opt';
      label.dataset.letter = letter.toUpperCase();
      label.innerHTML = '<input type="radio" name="q' + q.n + '" value="' + letter.toUpperCase() + '"><span><span class="letter">' + letter.toUpperCase() + '.</span> <span class="opttext"></span></span>';
      label.querySelector('.opttext').textContent = q[letter];
      label.querySelector('input').addEventListener('change', function(){ answers[q.n] = letter.toUpperCase(); updateProgress(); });
      opts.appendChild(label);
    });
    body.appendChild(card);
  });
  function updateProgress(){
    document.getElementById('quiz-progress').textContent = Object.keys(answers).length + ' / ' + questions.length + ' answered';
  }
  updateProgress();
  document.getElementById('btn-submit').addEventListener('click', function(){
    let correct = 0;
    const byDomain = {};
    questions.forEach(function(q){
      const given = answers[q.n];
      const isCorrect = given === q.correct;
      if(isCorrect) correct++;
      const d = q.domain || 'Other';
      byDomain[d] = byDomain[d] || {correct:0,total:0};
      byDomain[d].total++;
      if(isCorrect) byDomain[d].correct++;
      const card = document.querySelectorAll('.qcard')[q.n-1];
      card.querySelectorAll('.opt').forEach(function(opt){
        opt.querySelector('input').disabled = true;
        if(opt.dataset.letter === q.correct) opt.classList.add('correct');
        else if(opt.dataset.letter === given) opt.classList.add('wrong');
      });
    });
    const pct = Math.round((correct/questions.length)*100);
    const scoreArea = document.getElementById('score-area');
    let bars = '';
    domainOrder.filter(function(d){return byDomain[d];}).forEach(function(d){
      const s = byDomain[d];
      const p = Math.round((s.correct/s.total)*100);
      bars += '<div class="dbar-row"><span class="dname">' + d + '</span><div class="dbar-track"><div class="dbar-fill" style="width:' + p + '%"></div></div><span class="dpct">' + s.correct + '/' + s.total + '</span></div>';
    });
    scoreArea.innerHTML = '<div class="score-panel"><div class="eyebrow">Result \u2014 no rationales shown, readiness signal only</div><div class="score-big">' + correct + ' / ' + questions.length + ' <span style="font-size:1.1rem; color:var(--muted); font-family:\'Public Sans\',sans-serif; font-weight:500;">(' + pct + '%)</span></div><div class="domain-bars">' + bars + '</div></div>';
    document.getElementById('btn-submit').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'inline-flex';
    scoreArea.scrollIntoView({behavior:'smooth', block:'nearest'});
  });
  document.getElementById('btn-reset').addEventListener('click', function(){ window.location.reload(); });
}

runQuiz([{"n": 1, "q": "A provider obtained consent for a procedure from a client yesterday. Overnight, the client developed acute confusion from hypoxia and can no longer understand questions. The procedure is elective and can safely be postponed. What is the nurse's best action?", "a": "Send the client as scheduled because the consent was signed while the client was competent", "b": "Proceed because the provider, not the nurse, decides whether consent remains valid", "c": "Hold the procedure and notify the provider that the client's current condition affects the ability to confirm ongoing consent", "d": "Have the client's roommate verify that the client wanted the procedure", "correct": "C", "domain": "Coordinated Care"}, {"n": 2, "q": "The practical nurse is supervising an assistive personnel (AP) who is obtaining finger-stick glucose results for stable clients before breakfast. Which finding should the AP report to the nurse first?\n\nA. A client says, \"I am hungry and want breakfast soon.\"\nB. A client has a glucose reading of 58 mg/dL and feels shaky\nC. A client asks whether the lancet will leave a scar\nD. A client says breakfast usually comes later on weekends", "a": "A client says, \"I am hungry and want breakfast soon.\"", "b": "A client has a glucose reading of 58 mg/dL and feels shaky", "c": "A client asks whether the lancet will leave a scar", "d": "A client says breakfast usually comes later on weekends", "correct": "B", "domain": "Coordinated Care"}, {"n": 3, "q": "A practical nurse in a clinic notices that older adults who do not use the online portal are less likely to complete follow-up appointments after abnormal test results. Which clinic action best promotes equitable access to care?", "a": "Require all clients to use the portal so the process stays consistent", "b": "Send the same portal reminder twice instead of once", "c": "Offer follow-up scheduling through phone calls as well as the portal", "d": "Post instructions in the waiting room on how to create an online account", "correct": "C", "domain": "Coordinated Care"}, {"n": 4, "q": "An alert adult client with newly diagnosed diabetes tells the nurse, \"Please do not discuss my condition while my employer is visiting. I haven't told anyone at work.\" A few minutes later, the employer arrives and says, \"I'm like family. Just tell me what the doctor said so I can help.\" What is the nurse's best response?", "a": "Explain the diagnosis because the employer states a close relationship with the client", "b": "Ask the employer to step out briefly, then confirm with the client what information, if any, may be shared", "c": "Give a general update without naming the diagnosis so the employer can still be helpful", "d": "Tell the employer to wait until discharge, when the client can decide whether to share information", "correct": "B", "domain": "Coordinated Care"}, {"n": 5, "q": "A client with mild developmental disability is scheduled for a nonemergency procedure. The client can explain what the procedure is for, ask relevant questions, and clearly state a choice. The client’s sibling says, “Just talk to me instead. I always make the decisions.” What is the nurse’s best response?", "a": "Direct the discussion to the sibling because a disability prevents valid consent", "b": "Include the sibling only if the client wants support, but continue addressing the client as the decision-maker", "c": "Ask the provider to postpone the procedure until the sibling can sign the consent", "d": "Obtain consent from both the client and sibling to avoid conflict", "correct": "B", "domain": "Coordinated Care"}, {"n": 6, "q": "A practical nurse is caring for a client who has decision-making capacity and a written advance directive refusing artificial tube feedings. After the client becomes unable to speak, the client's adult son tells the nurse, \"Start the feeding anyway. My mother would want every chance to live.\" Which action by the nurse is most appropriate?", "a": "Insert the feeding tube because the son is the next of kin and can override the document", "b": "Follow the advance directive and notify the charge nurse and provider of the son's concerns", "c": "Ask another family member to decide whether the advance directive should still apply", "d": "Delay all care until the ethics committee meets and makes a final decision", "correct": "B", "domain": "Coordinated Care"}, {"n": 7, "q": "A practical nurse is preparing to call the provider about a client with chronic kidney disease whose morning laboratory results show potassium 6.1 mEq/L. Which additional information is most important for the nurse to gather before making the report?", "a": "The client's most recent cardiac rhythm and electrocardiogram changes", "b": "How many visitors the client had overnight", "c": "The date of the client's last bowel movement", "d": "Whether the client prefers morning or evening medications", "correct": "A", "domain": "Coordinated Care"}, {"n": 8, "q": "A practical nurse in a clinic notices that a 10-year-old child has a cigarette-shaped burn on the forearm and several fading bruises on the back. The caregiver states the child is \"always getting hurt,\" but the injury pattern seems inconsistent. Which action by the nurse is most appropriate?", "a": "Wait to report until the nurse can confirm abuse with photographs and witness statements", "b": "Ask the caregiver to explain the injuries again and decide about reporting after the visit", "c": "Report the suspicion according to facility policy and document objective findings", "d": "Tell the child that the nurse will keep the information secret unless the child agrees to a report", "correct": "C", "domain": "Coordinated Care"}, {"n": 9, "q": "A practical nurse in a clinic has four actions to complete at the same time. Which action should the nurse prioritize first?", "a": "Call back a client taking furosemide who reports new muscle weakness and palpitations", "b": "Provide routine teaching to a client newly prescribed iron tablets", "c": "Fax a completed insurance form for a client referral", "d": "Document a resolved dressing change from earlier in the morning", "correct": "A", "domain": "Coordinated Care"}, {"n": 10, "q": "An older adult client says, “I don’t understand these advance directive forms very well.” Which nursing action is best?", "a": "Hand the client the paperwork and ask for a signature before discharge.", "b": "Ask the client's roommate to explain the forms in simple terms.", "c": "Provide clear explanations, answer questions, and offer the appropriate resources for further assistance.", "d": "Tell the client to wait until an emergency occurs to decide.", "correct": "C", "domain": "Coordinated Care"}, {"n": 11, "q": "A health system launches a telehealth follow-up program after hospital discharge. Thirty days later, readmissions fall overall, but the drop occurs mainly among insured clients with home broadband. Which next step best reflects equitable access to care?", "a": "Expand telehealth only, because the program improved the main outcome", "b": "End telehealth, because any unequal benefit means the program failed", "c": "Keep telehealth as one option and add alternative follow-up pathways for clients with limited digital access", "d": "Use the same telehealth model and ask high-risk clients to try harder to connect", "correct": "C", "domain": "Coordinated Care"}, {"n": 12, "q": "A practical nurse is asked during rounds whether a client with pneumonia is ready for discharge later today. Which response best supports sound interdisciplinary decision-making?", "a": "Yes, because the client says he wants to go home.", "b": "Probably, because the fever is lower than yesterday.", "c": "The client still becomes short of breath walking to the bathroom, needs 2 L/min oxygen to keep saturation above 92%, and has not demonstrated correct inhaler use.", "d": "That is mainly the provider's decision.", "correct": "C", "domain": "Coordinated Care"}, {"n": 13, "q": "A practical nurse is planning the order of care for four clients. Which client should be seen first?\n\nA. A client with a new colostomy who is embarrassed about emptying the pouch\nB. A client receiving IV potassium who reports burning at the insertion site and has redness along the vein\nC. A client with chronic back pain who requests a warm compress\nD. A client scheduled for discharge who needs printed instructions reviewed", "a": "A client with a new colostomy who is embarrassed about emptying the pouch", "b": "A client receiving IV potassium who reports burning at the insertion site and has redness along the vein", "c": "A client with chronic back pain who requests a warm compress", "d": "A client scheduled for discharge who needs printed instructions reviewed", "correct": "B", "domain": "Coordinated Care"}, {"n": 14, "q": "A practical nurse overhears an assistive personnel staff member discussing a client's cancer diagnosis in the cafeteria. What should the nurse do?", "a": "Wait to see whether the client complains before acting", "b": "Join the conversation so the details are accurate", "c": "Address the staff member promptly and follow facility reporting procedures for the breach", "d": "Document the diagnosis more clearly in the chart", "correct": "C", "domain": "Coordinated Care"}, {"n": 15, "q": "A practical nurse notices that clients with limited English proficiency often arrive prepared for the wrong procedure because reminder calls use only automated English messages. Which intervention would most directly improve equitable access?", "a": "Ask family members to translate all reminder messages", "b": "Require clients to come in person to verify every appointment", "c": "Provide appointment reminders in the client's preferred language using qualified language-support processes", "d": "Schedule these clients only on days when the clinic is less busy", "correct": "C", "domain": "Coordinated Care"}, {"n": 16, "q": "The practical nurse is assigning tasks after change of shift. Which assignment is inappropriate for a UAP?", "a": "Collect a clean-catch urine specimen from a stable client after the nurse explains the procedure to the client", "b": "Measure the amount of drainage in a Hemovac and report the total to the nurse", "c": "Remove a peripheral IV catheter from a client being discharged", "d": "Provide oral hygiene to a stable client with partial dentures", "correct": "C", "domain": "Coordinated Care"}, {"n": 17, "q": "A practical nurse is preparing a client for discharge. The client's spouse says, \"I handle all the bills, so give me the written instructions and medication list.\" The client is alert and says, \"I want to look at everything myself first, and then I'll decide what to share.\" Which action should the nurse take?", "a": "Give the spouse the papers because spouses usually assist after discharge", "b": "Provide one copy to the spouse and one to the client", "c": "Give the materials to the client and involve the spouse only as the client allows", "d": "Refuse to include the spouse in any discharge discussion", "correct": "C", "domain": "Coordinated Care"}, {"n": 18, "q": "A client is discharged with instructions to monitor blood pressure daily and upload the readings through a phone app. The client says, \"My phone service gets turned off some months.\" Which revision to the plan best supports equitable access?", "a": "Keep the current plan because the app is the fastest way to report data", "b": "Advise the client to use free public Wi-Fi whenever possible", "c": "Arrange an alternative reporting option, such as written logs reviewed by phone or in-person follow-up", "d": "Delay discharge until the client can guarantee reliable phone service", "correct": "C", "domain": "Coordinated Care"}, {"n": 19, "q": "A practical nurse in a long-term care facility sees a nursing assistant roughly pull a resident up in bed while the resident cries out, \"Stop, you're hurting me.\" What should the nurse do first?", "a": "Complete an incident form at the end of the shift", "b": "Remove the assistant from the resident's care and ensure the resident's immediate safety", "c": "Ask other staff whether they have had problems with the assistant", "d": "Wait to report the event until the charge nurse returns from lunch", "correct": "B", "domain": "Coordinated Care"}, {"n": 20, "q": "A practical nurse working in a long-term care facility receives this written note from a client's daughter: \"Mom forgets everything. Please leave all updates and test results with me, even if she says not to.\" The client is awake, usually able to make needs known, and has previously asked that some information not be shared with family. What should the nurse do next?\n\nA. Follow the daughter's request because family usually manages long-term care decisions.\nB. Review the client's current preferences and share information only as authorized.\nC. Stop documenting discussions with the client to avoid family conflict.\nD. Give the daughter complete access because memory problems automatically remove privacy rights.", "a": "Follow the daughter's request because family usually manages long-term care decisions.", "b": "Review the client's current preferences and share information only as authorized.", "c": "Stop documenting discussions with the client to avoid family conflict.", "d": "Give the daughter complete access because memory problems automatically remove privacy rights.", "correct": "B", "domain": "Coordinated Care"}, {"n": 21, "q": "A client with cognitive impairment arrives in the emergency department with burns on both hands. The caregiver says the client \"grabbed a pan by accident,\" but the pattern suggests forced immersion. The caregiver insists on staying during all questions and keeps answering for the client. Which finding most strongly supports the nurse's suspicion of abuse?", "a": "The caregiver appears anxious and speaks quickly", "b": "The client is older and has memory problems", "c": "The injury pattern is inconsistent with the explanation given", "d": "The client arrived at the emergency department in the evening", "correct": "C", "domain": "Coordinated Care"}, {"n": 22, "q": "A client with mumps must be moved from a semiprivate room because a roommate is newly immunocompromised. Which new placement is best?", "a": "A private room with droplet precautions", "b": "A private room with contact precautions only", "c": "A room near the nurses' station with no special precautions", "d": "A positive-pressure room with visitors restricted", "correct": "A", "domain": "Safety and Infection Prevention and Control"}, {"n": 23, "q": "A practical nurse is helping a client with oral care. The client has no isolation orders, but while the nurse is brushing the client's teeth, the client suddenly coughs and sprays saliva onto the nurse's forearm. Which action best follows standard precautions?", "a": "Continue the oral care, then wash the area with soap and water after leaving the room", "b": "Stop the procedure, remove the contaminated gloves, and document the exposure before completing care", "c": "Clean the forearm promptly, perform hand hygiene as needed, and replace any contaminated PPE before resuming care", "d": "Ask another staff member to finish the oral care because exposure to saliva requires reassignment", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 24, "q": "A community clinic nurse is obtaining a capillary blood sample from a client who speaks very little English. A trained interpreter is present by video. Which action best supports safe client identification?", "a": "Ask the interpreter to identify the client by appearance", "b": "Have the interpreter ask the client to state identifying information, then compare it with the clinic record", "c": "Use the appointment time as the second identifier because language barriers make direct verification impractical", "d": "Ask another client in the waiting area to confirm who arrived with the interpreter connection", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 25, "q": "A practical nurse enters a resident's room in an assisted-living facility and notes several conditions after the resident's family brought personal items from home. Which finding should the nurse address first?", "a": "A decorative throw rug is placed at the bedside", "b": "A portable halogen lamp is positioned with its shade touching the bedspread", "c": "A stack of magazines is stored on the lower shelf of the bedside table", "d": "A cell phone charger is plugged into the wall outlet behind the chair", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 26, "q": "A nurse enters a room to administer an oral medication and finds a cup of pills at the bedside that was left by another nurse. The client says, “I haven’t taken them yet.” The nurse cannot confirm what the pills are from the cup alone. What is the best action?", "a": "Ask the client to take the pills while the nurse checks the medication record afterward", "b": "Discard the pills according to policy, identify the ordered medications in the MAR, and notify the appropriate nurse or provider per facility policy", "c": "Give the pills if the client states they are the usual morning medications", "d": "Document that the client refused the medication and leave the room", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 27, "q": "The nurse is preparing to use a blood pressure machine that has a frayed electrical cord. Which action is most appropriate?", "a": "Wrap the cord with tape and use the machine for this one reading", "b": "Plug it into a different outlet to see if it works better", "c": "Tag the machine as unsafe and remove it from service", "d": "Use the machine only if the client is not touching metal", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 28, "q": "A practical nurse is preparing to insert a rectal suppository for a client who has no isolation orders. The client has diarrhea, and the nurse expects contact with feces during the procedure. Which action best reflects standard precautions?", "a": "Put on clean gloves before the procedure and perform hand hygiene after glove removal", "b": "Wear a sterile gown and sterile gloves because stool is always considered sterile-site contamination", "c": "Use no gloves if the client's skin is intact and there are no visible open areas", "d": "Apply a surgical mask because standard precautions require a mask for all medication administration", "correct": "A", "domain": "Safety and Infection Prevention and Control"}, {"n": 29, "q": "A nurse is preparing to apply a protective skin barrier and ostomy pouch for a client with a new ileostomy. During the assessment, the client states, \"I had a severe rash and shortness of breath after using a product with pectin before.\" The supply package the nurse plans to use lists pectin as an ingredient. What should the nurse do first?", "a": "Apply the pouch because the reaction was limited to a previous product", "b": "Hold the product and obtain a non-pectin alternative before proceeding", "c": "Premedicate the client with an antihistamine and continue with the same supplies", "d": "Apply the barrier to a small area first to see whether a reaction occurs", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 30, "q": "While setting up a sterile field on a waist-high table, the nurse drops a sterile gauze pad. The pad lands 2 inches below the top edge of the drape without touching anything else. Which action is most appropriate?", "a": "Leave the gauze in place because it is still on the drape", "b": "Move the gauze to the center of the field with sterile forceps", "c": "Consider the gauze contaminated and discard it", "d": "Use the gauze only for the final outer wipe", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 31, "q": "A nurse receives an order for a cephalosporin antibiotic for a client whose chart lists a severe allergy to cephalexin. What is the nurse's best action?", "a": "Give the medication because it is a different cephalosporin", "b": "Hold the medication and clarify the order due to the listed allergy", "c": "Premedicate with an antihistamine and then administer the drug", "d": "Ask the client whether the previous reaction required hospitalization, then decide", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 32, "q": "The nurse is planning care for a client on airborne precautions. Which room setup is most appropriate?", "a": "A semi-private room with the curtain pulled", "b": "A private room with special air handling", "c": "A room near the nurses' station with the door left open for observation", "d": "A treatment room used only during daytime hours", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 33, "q": "A client 1 day after a stroke becomes restless and repeatedly tries to remove the nasal cannula. The client is not violent, can follow simple commands, and becomes calmer when the nurse reduces noise in the room and explains the oxygen equipment. Which action should the nurse take next to follow least-restrictive restraint principles?", "a": "Apply soft wrist restraints to prevent removal of the oxygen tubing", "b": "Use a sheet to secure the client's hands at the sides", "c": "Continue nonrestraint measures such as close observation, reorientation, and redirection", "d": "Raise all 4 side rails and leave the room", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 34, "q": "A client with a recent abdominal surgery needs assistance to stand. The nurse plans to use a transfer belt. Which additional action is most appropriate?\n\nA. Place the belt directly over the incision to provide firm support\nB. Avoid the transfer belt and select another safe method if the belt would press on the surgical area\nC. Tighten the belt as much as possible to limit trunk movement\nD. Position the belt under the client's rib cage to avoid the waistline", "a": "Place the belt directly over the incision to provide firm support", "b": "Avoid the transfer belt and select another safe method if the belt would press on the surgical area", "c": "Tighten the belt as much as possible to limit trunk movement", "d": "Position the belt under the client's rib cage to avoid the waistline", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 35, "q": "The nurse is obtaining a baseline pulse oximetry reading. Which factor could make the reading less accurate?", "a": "The client is wearing dark nail polish", "b": "The client is resting quietly in bed", "c": "The client's hand is supported on a pillow", "d": "The client has just answered orientation questions", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 36, "q": "A nurse is reinforcing teaching with the parent of a 3-year-old child about expected language development. Which statement by the parent indicates understanding?", "a": "My child should be able to speak in short sentences of about 3 to 4 words.", "b": "My child should mostly communicate by pointing to objects and grunting.", "c": "My child should be able to read simple picture books independently.", "d": "My child should use about 2 or 3 words total during the day.", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 37, "q": "A client in active labor says, \"I feel a strong urge to push.\" The nurse checks and notes the cervix is 8 cm dilated. What is the nurse's best action?", "a": "Encourage the client to bear down with each contraction", "b": "Instruct the client to pant or blow through contractions", "c": "Place the client flat on the back with legs extended", "d": "Prepare the client for immediate delivery", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 38, "q": "A practical nurse is assisting with a health-promotion class for adults. Which activity is the best example of screening rather than prevention?", "a": "Teaching clients to use seat belts on every car ride", "b": "Checking fasting blood glucose levels at a community fair for adults without symptoms", "c": "Administering an influenza vaccine before flu season", "d": "Instructing a client with diabetes about daily foot care", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 39, "q": "A client at 40 weeks' gestation is in active labor and receiving an oxytocin infusion. The nurse notes contractions lasting 95 to 110 seconds and occurring every 1.5 to 2 minutes. The fetal heart rate baseline is 150/min with recurrent late decelerations. Which action should the nurse take first?", "a": "Increase the oxytocin infusion rate to strengthen labor", "b": "Turn the client to a side-lying position", "c": "Perform a vaginal examination to check dilation", "d": "Encourage the client to begin pushing with contractions", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 40, "q": "A client in labor develops a temperature of 38.3°C (100.9°F), maternal pulse 112/min, uterine tenderness, and fetal tachycardia. Which complication should the nurse suspect?", "a": "Chorioamnionitis", "b": "Placenta previa", "c": "Precipitous labor", "d": "Normal transition phase", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 41, "q": "The practical nurse is caring for an adolescent who says, \"I don't want my parent in the room while I talk.\" Which action is most appropriate first?", "a": "Tell the adolescent that the parent must stay for the entire visit", "b": "Ask the parent to leave immediately without explanation", "c": "Explore the adolescent's concerns and support a private discussion if appropriate", "d": "Document that the adolescent is refusing family involvement", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 42, "q": "A practical nurse is helping with a community prevention program. Which activity is the best example of primary prevention?", "a": "Teaching adults how to limit saturated fat intake before they develop heart disease", "b": "Referring a client with a breast lump for diagnostic testing", "c": "Checking a client's blood pressure at a follow-up visit after medication changes", "d": "Providing range-of-motion exercises to a client after a stroke", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 43, "q": "A nurse is preparing to teach a client about wound care before discharge. The client winces, clutches the incision site, and says, \"Can we do this later? It really hurts right now.\" Which action by the nurse is best to reduce this communication barrier?", "a": "Continue the teaching now so the client receives all instructions before discharge", "b": "Ask a family member to listen instead and explain the instructions to the client later", "c": "Administer prescribed pain medication if available and return when the client is more comfortable", "d": "Speak more loudly and repeat each step slowly while the client rests in bed", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 44, "q": "A nurse enters a room and finds a client staring at the wall. The client quietly says, \"There isn't any point in trying anymore.\" Which response is the nurse's priority?", "a": "Everyone feels discouraged sometimes.", "b": "What has made things so difficult for you today?", "c": "Are you thinking about harming yourself?", "d": "You need to stay positive and focus on recovery.", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 45, "q": "A nurse is speaking with a client whose blood glucose check is delayed because the unit is short-staffed. The client suddenly stands up, knocks a water cup onto the floor, and says in a loud voice, \"This is ridiculous. Nobody here cares if something happens to me.\" The client is breathing quickly and glaring at the nurse but is not advancing toward anyone. Which response by the nurse is most appropriate?", "a": "“You need to lower your voice right now or I will have to call security.”", "b": "“I can see that you are very frustrated. Let's move to a quieter area so we can talk and I can stay with you.”", "c": "“There is no reason to act like this. Your blood glucose will be checked when staff are available.”", "d": "“If you sit back down and calm yourself, I will come back when you are ready to speak respectfully.”", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 46, "q": "A client says, “I avoid health care because people judge me for being transgender.” Which nursing response is best?", "a": "“You should report every person who has ever offended you.”", "b": "“Most health care workers are professional, so try not to worry.”", "c": "“That sounds very difficult. What concerns do you have about receiving care today?”", "d": "“If you expect judgment, you may come across as defensive.”", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 47, "q": "On an inpatient unit, a client frequently curses at staff when redirected but has not threatened harm or moved toward anyone. Which nursing action is most appropriate?", "a": "State that abusive language is not acceptable and continue the interaction in a calm manner", "b": "Immediately call security to remove the client from the area", "c": "Ignore the behavior completely so it is not reinforced", "d": "Argue with the client until the client admits the behavior is wrong", "correct": "A", "domain": "Psychosocial Integrity"}, {"n": 48, "q": "A client on a behavioral health unit says to the nurse, \"That man in the next room keeps staring at me. I'm about to make him stop.\" The client is standing rigidly and breathing faster. Which nursing action is the priority?", "a": "Ask the other client whether staring has occurred", "b": "Move the client to a quieter area and remain with the client while setting clear limits", "c": "Tell the client that the belief is false and irrational", "d": "Document the threat and continue routine observations", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 49, "q": "A nurse is assessing pain in a client from a cultural background unfamiliar to the nurse. Which approach is best?", "a": "Assume the client's pain tolerance is higher than average", "b": "Use the same pain scale for every client and ignore cultural factors", "c": "Ask the client how pain is usually expressed or managed in their family and assess current pain using standard measures", "d": "Rely mainly on the family's description of the client's pain", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 50, "q": "A nurse is caring for a client who recently gave birth. Several family members insist on performing a cultural newborn ritual at the bedside. The newborn is stable, but the ritual would interfere with a scheduled medication administration for the client that is time-sensitive. Which action is best?", "a": "Cancel the ritual because medical care always has absolute priority over cultural practices", "b": "Delay the medication and document that the family requested it", "c": "Acknowledge the ritual's importance, explain the time-sensitive medication need, and work with the family to adjust timing safely", "d": "Allow the ritual to proceed and ask the next shift to handle the medication issue", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 51, "q": "A client with Ménière disease says, \"When the room starts spinning, I panic and think I'm going to lose control in front of everyone.\" Which nursing intervention is most appropriate to support the client's psychosocial coping?", "a": "Encourage the client to ignore the episodes so they do not gain attention.", "b": "Teach the client to identify early symptoms and use a quiet, low-stimulation place during an attack.", "c": "Advise the client to stay in bed as much as possible to prevent embarrassment.", "d": "Tell the client that vertigo usually is brief and should not be frightening.", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 52, "q": "A client with type 2 diabetes tells the nurse, \"When I'm stressed, I stop checking my blood sugar because I don't want one more thing to deal with.\" Which response by the nurse is most appropriate?", "a": "\"You should avoid thinking about stress until your glucose is controlled.\"", "b": "\"Stress can affect self-care, so let's identify one small step you can keep doing even on hard days.\"", "c": "\"If checking your blood sugar makes you anxious, you can skip it until you feel calmer.\"", "d": "\"The best way to handle this is to rely on willpower and push yourself harder.\"", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 53, "q": "A client who recently had a below-the-knee amputation tells the nurse, \"I don't want my grandchildren to see me like this.\" Which response by the nurse is most therapeutic?", "a": "They are your family, so they will accept you no matter what.", "b": "You should let them visit now so you can get used to it.", "c": "It sounds as though you are worried about how your grandchildren will react.", "d": "Many clients feel better once they start physical therapy.", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 54, "q": "A nurse in a primary care office is assessing a client who was asked to wait longer than expected. The client is standing, breathing hard, and repeatedly hitting a rolled-up magazine against a chair. Which finding should the nurse identify as the clearest sign that the client's risk for violence is increasing?", "a": "The client says, \"This place is always disorganized.\"", "b": "The client asks, \"How much longer is this going to take?\"", "c": "The client begins striking the chair harder and will not respond to the nurse's attempts to speak calmly.", "d": "The client tells another client, \"I had a long day before I even got here.\"", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 55, "q": "A nurse is planning care for a client who frequently becomes hostile when asked to follow unit routines. Which approach is most likely to reduce power struggles?", "a": "Offer limited choices whenever possible", "b": "Confront the client each time with a detailed explanation", "c": "Use different rules depending on the nurse on duty", "d": "Avoid setting limits so the client does not become upset", "correct": "A", "domain": "Psychosocial Integrity"}, {"n": 56, "q": "A nurse is assisting a client from the bed to a stretcher after surgery. Which action is most appropriate to promote safe movement and reduce friction during the transfer?", "a": "Pull the client across the bed by grasping under the client's arms", "b": "Ask the client to keep both legs straight and remain still while being dragged onto the stretcher", "c": "Use a draw sheet with assistance to lift and slide the client across", "d": "Raise the bed to its highest position and move the client alone as quickly as possible", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 57, "q": "A practical nurse is measuring a client's urinary output from an indwelling catheter. At 1:00 p.m., the drainage bag contains 300 mL of urine and is emptied. At 5:00 p.m., the bag contains 260 mL. The client then vomits 90 mL and has 40 mL of liquid drainage from a wound drain. What total output should the nurse record from 1:00 p.m. to 5:00 p.m.?", "a": "260 mL", "b": "350 mL", "c": "390 mL", "d": "650 mL", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 58, "q": "A nurse is caring for a client who must remain in bed for several days. Which intervention best helps prevent contractures of the hips and knees?", "a": "Keeping pillows under the knees at all times", "b": "Positioning the client in a continuous high-Fowler's position", "c": "Performing active or passive range-of-motion exercises regularly", "d": "Restricting movement to reduce discomfort", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 59, "q": "A nurse is caring for a client with a mature gastrostomy tube who receives intermittent enteral feedings. Before administering the next feeding, the nurse measures the external length of the tube and finds it is 4 cm longer than documented on the previous shift. The client denies pain, but the nurse hears air over the epigastric area after instilling air into the tube. Which action should the nurse take?", "a": "Administer the feeding because the air bolus suggests gastric placement", "b": "Advance the tube to the previous marking and secure it in place", "c": "Hold the feeding and notify the provider that tube displacement is suspected", "d": "Flush the tube with water and remeasure the external length after the flush", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 60, "q": "A client reports chronic insomnia. Which information from the nurse best explains why daily exercise is usually recommended earlier in the day rather than just before bedtime?", "a": "Exercise can increase alertness and body stimulation close to bedtime", "b": "Exercise always causes muscle pain that prevents sleep", "c": "Exercise lowers oxygen needs during sleep too much", "d": "Exercise prevents the body from entering deep sleep later that night", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 61, "q": "An immobile client is turned every 2 hours, but the nurse notes worsening redness over the greater trochanter. Which action is best to take next?", "a": "Continue the same schedule because repositioning is already being done", "b": "Reassess the turning plan, support surfaces, and positioning technique", "c": "Apply powder to the reddened area and recheck at the end of the shift", "d": "Place the client directly on the reddened side for short periods to build tolerance", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 62, "q": "A client recovering from surgery is reluctant to move because of pain. Which nonpharmacologic nursing action is most likely to promote comfort during repositioning?", "a": "Move the client quickly before the client can tense up", "b": "Explain the plan, coordinate movement, and use pillows for support after turning", "c": "Ask the client to reposition independently without assistance", "d": "Delay all turning until the client reports no pain", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 63, "q": "A client with a hearing aid asks the nurse to explain how to prepare for a bedtime blood glucose check. Before teaching begins, the client says, \"My hearing aid is whistling again.\" What should the nurse do first?", "a": "Speak louder so the client can hear over the noise", "b": "Turn off the room television and continue teaching", "c": "Check the hearing aid placement and fit before giving instructions", "d": "Write all instructions down and avoid verbal teaching", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 64, "q": "A postoperative client says guided imagery helped after a previous surgery. Which nurse action best implements this nonpharmacologic method?", "a": "Ask the client to describe a calming place and guide attention to that image during discomfort", "b": "Tell the client to concentrate on the surgical incision until the pain fades", "c": "Turn on the television loudly to block out awareness of pain", "d": "Wait to use the technique until pain reaches the highest level", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 65, "q": "A nurse is caring for a client who has a small-bore nasoenteric tube for continuous enteral feeding. The pump alarm indicates occlusion, and the nurse is unable to flush the tube easily with water. Which action should the nurse take next?", "a": "Use a 30-mL syringe to apply gentle back-and-forth pressure with warm water", "b": "Advance the tube 2 to 3 cm and attempt the flush again", "c": "Instill carbonated soda into the tube to dissolve the clog", "d": "Increase the pump rate to force the formula through the tube", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 66, "q": "A nurse is monitoring a patient during a blood transfusion. Which assessment finding is most consistent with circulatory overload rather than a hemolytic reaction?", "a": "Crackles, jugular venous distention, and increasing blood pressure", "b": "Low back pain, fever, and dark urine", "c": "Flushing, urticaria, and itching", "d": "Chills, hypotension, and a sense of impending doom", "correct": "A", "domain": "Pharmacological Therapies"}, {"n": 67, "q": "A practical nurse is admitting a client from an assisted-living facility and begins medication reconciliation. The transfer list includes prescribed medications, but the client also says, \"I use eye drops every night, a patch for motion sickness when I travel, and an herbal tea to help me sleep.\" None of these appear on the current medication list. Which action by the nurse is best?", "a": "Document only the prescribed medications because nonprescription products are not included in reconciliation", "b": "Add all reported medications and products, including over-the-counter, topical, and herbal items, for provider review", "c": "Wait until discharge planning to update the medication list because these items are taken at home", "d": "Ask the client to stop using all nonprescription products until the next clinic visit", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 68, "q": "A patient taking warfarin says, \"I started drinking a green smoothie every day to be healthier.\" Which nursing response is most appropriate?", "a": "That is fine because vegetables do not affect warfarin", "b": "Stop drinking all smoothies immediately", "c": "Keep vitamin K intake consistent and tell the prescriber about the diet change", "d": "Take an extra warfarin tablet on days you drink the smoothie", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 69, "q": "A client with rheumatoid arthritis is prescribed methotrexate 15 mg by mouth once weekly. Before administering the scheduled dose, the nurse reviews the laboratory results and notes a platelet count of 62,000/mm3. Which action is most appropriate?", "a": "Administer the medication and monitor for therapeutic response", "b": "Hold the medication and notify the provider", "c": "Give the medication with food to reduce gastrointestinal upset", "d": "Request that the dose be changed to a daily schedule", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 70, "q": "A nurse is preparing to administer furosemide 40 mg IV push. The medication label is correct, but the IV tubing is connected to a bag containing a medication that is incompatible with furosemide. Which action is most appropriate?", "a": "Give the IV push through the line anyway because the drug and dose are correct", "b": "Pause the incompatible infusion and use proper line management before administering the furosemide", "c": "Mix the furosemide into the hanging IV bag to dilute it", "d": "Change the MAR entry so the medication can be given by mouth instead", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 71, "q": "A postoperative client is prescribed patient-controlled analgesia (PCA) with IV morphine. The client's spouse says, \"She is sleeping, so I'll press the button for her to keep the pain away.\" Which response by the nurse is best?", "a": "That is helpful because it prevents pain from becoming severe", "b": "You may press the button only if the client asks you to do it", "c": "Only the client should press the PCA button because the pump is designed for patient use", "d": "You should press the button every time the lockout interval ends", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 72, "q": "A nurse is teaching a client about care of a transdermal pain patch at home. Which client statement shows correct understanding?", "a": "I will place the new patch on the exact same spot each time so I can keep track of it", "b": "If the patch loosens, I can tape directly over the medication surface", "c": "I should fold the used patch with the sticky sides together before disposal", "d": "I can cut the patch in half if the prescribed dose feels too strong", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 73, "q": "A nurse is preparing to administer the next dose of spironolactone to a client with heart failure. Which pre-administration data is most important for the nurse to review?", "a": "Serum potassium level", "b": "Apical pulse rate", "c": "Hemoglobin level", "d": "White blood cell count", "correct": "A", "domain": "Pharmacological Therapies"}, {"n": 74, "q": "A patient has been taking prednisone for several weeks and is now prescribed naproxen for joint pain. Which teaching point is most important for the nurse to include?", "a": "Take both medications on an empty stomach for best absorption", "b": "Report black, tarry stools or stomach pain promptly", "c": "Expect the naproxen to prevent steroid-related insomnia", "d": "Stop the prednisone as soon as the naproxen starts working", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 75, "q": "A nurse needs to administer 150 mL of IV medication over 45 minutes using tubing with a drop factor of 20 gtt/mL. What flow rate should the nurse regulate in drops per minute?", "a": "50 gtt/min", "b": "67 gtt/min", "c": "75 gtt/min", "d": "90 gtt/min", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 76, "q": "A patient who takes potassium chloride daily is prescribed trimethoprim-sulfamethoxazole. Which laboratory value should the nurse watch most closely for a possible interaction-related problem?", "a": "Potassium 5.8 mEq/L", "b": "Sodium 138 mEq/L", "c": "Calcium 9.1 mg/dL", "d": "Hemoglobin 13.4 g/dL", "correct": "A", "domain": "Pharmacological Therapies"}, {"n": 77, "q": "A nurse is preparing to administer packed red blood cells to a client through an existing IV line. Which IV fluid is appropriate to infuse with the blood product?", "a": "0.9% sodium chloride", "b": "5% dextrose in water", "c": "Lactated Ringer's solution", "d": "0.45% sodium chloride", "correct": "A", "domain": "Pharmacological Therapies"}, {"n": 78, "q": "An IV antibiotic of 250 mL is ordered to infuse over 1 hour 45 minutes. What pump rate should the nurse program?", "a": "125 mL/hr", "b": "143 mL/hr", "c": "150 mL/hr", "d": "175 mL/hr", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 79, "q": "A nurse is preparing to collect several blood specimens by venipuncture. The client asks why the nurse is checking the labels before the draw instead of after the tubes are filled. Which response best reflects safe practice?", "a": "Labeling must be completed before the puncture so the nurse will not forget the room number", "b": "Verifying identifiers before the draw helps ensure the specimen is collected from the correct client", "c": "Laboratory tubes cannot be used unless the labels are attached before blood enters them", "d": "Checking labels first mainly helps the laboratory decide which tests should be run first", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 80, "q": "A nurse is caring for a client on telemetry. The monitor alarm sounds, and the screen displays a flat line. The client is sitting up in bed, talking with family, and denies any symptoms. Which action should the nurse take first?", "a": "Call the rapid response team immediately", "b": "Assess the client and check the lead connections", "c": "Document artifact due to movement", "d": "Administer oxygen by nasal cannula", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 81, "q": "A client 18 hours after thyroid surgery says, \"My neck feels tight.\" Which focused assessment should the nurse perform first?", "a": "Check the surgical dressing and the area behind the neck for swelling or bleeding", "b": "Ask whether the client has had a bowel movement", "c": "Assess handgrip strength bilaterally", "d": "Inspect the urine for cloudiness", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 82, "q": "A nurse is preparing to collect a blood specimen for blood cultures from a client who has newly developed chills and a temperature of 39.2 C (102.6 F). Which action is most appropriate when obtaining the specimen?", "a": "Draw the specimen from the existing peripheral IV tubing after stopping the infusion for 5 minutes", "b": "Clean the tops of the culture bottles and the venipuncture site with antiseptic before collecting the specimen", "c": "Collect one culture bottle now and the second bottle after the first dose of antibiotics is given", "d": "Use sterile gloves only and avoid skin antisepsis so normal flora are not disturbed", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 83, "q": "A client with a history of heart disease reports, \"I have pressure in the middle of my chest.\" Which focused assessment should the nurse perform first?", "a": "Ask the client about usual exercise habits", "b": "Assess the pain quality, radiation, and associated symptoms", "c": "Review the client's cholesterol results from last year", "d": "Determine whether the client prefers to sit in a chair", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 84, "q": "A practical nurse is collecting data in a clinic on four clients. Which client should the nurse identify as being at greatest risk for infection?", "a": "A client with type 2 diabetes who has a fasting blood glucose of 248 mg/dL", "b": "A client with a healed ankle sprain who reports mild stiffness in the morning", "c": "A client with seasonal allergies who has clear nasal drainage", "d": "A client with tension headaches relieved by rest", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 85, "q": "A nurse checks a client's bedside glucose before administering scheduled insulin. The meter displays an error message indicating insufficient sample. Which action is best?", "a": "Estimate the glucose based on the partial reading and give half the insulin dose", "b": "Repeat the test with a new strip and an adequate blood sample", "c": "Administer the insulin because the test was almost completed", "d": "Chart the result as low and notify the provider after the insulin is given", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 86, "q": "A practical nurse is checking an adult client's pulse oximetry. The client has dark blue nail polish and cold fingers. The pulse oximeter reads 82%, but the client is alert, speaking clearly, and not in visible respiratory distress. What is the nurse's best action first?", "a": "Apply oxygen immediately at a high flow rate", "b": "Document the oxygen saturation as accurate because the monitor is objective", "c": "Reassess the reading by improving sensor placement or using another site", "d": "Notify the provider that the client is in respiratory failure", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 87, "q": "A practical nurse is obtaining orthostatic vital signs for an adult client who reports dizziness when getting out of bed. After the client rests supine for 5 minutes, the blood pressure is 128/76 mm Hg and pulse is 82/min. After standing for 3 minutes, the blood pressure is 104/68 mm Hg and pulse is 102/min, and the client says, \"I feel lightheaded.\" Which interpretation is most appropriate?", "a": "These findings are expected because standing normally lowers systolic blood pressure by more than 20 mm Hg", "b": "These findings suggest orthostatic hypotension and should be reported", "c": "The standing blood pressure is inaccurate because the diastolic pressure also changed", "d": "The pulse increase shows adequate compensation, so no further action is needed", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 88, "q": "A client is receiving packed red blood cells for symptomatic anemia. Fifteen minutes after the transfusion begins, which finding most strongly indicates the nurse should stop the transfusion rather than continue monitoring for expected improvement?", "a": "The client says fatigue has not improved yet", "b": "The hemoglobin has not been rechecked yet", "c": "The client develops chills, low back pain, and dyspnea", "d": "The client asks how long the transfusion will take", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 89, "q": "A nurse is preparing to obtain a venous blood specimen from an adult client for a potassium level. After cleansing the site and allowing it to dry, the nurse is ready to insert the needle. Which client instruction is most appropriate to help obtain the specimen while reducing the risk of altering the potassium result?", "a": "“Open and close your fist several times while I insert the needle.”", "b": "“Keep your arm bent so the vein stays in place.”", "c": "“Make a gentle fist, but do not pump your hand.”", "d": "“Hold your breath until the tube is filled.”", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 90, "q": "A practical nurse is collecting data in a rehabilitation unit. Which client should the nurse identify as being at greatest risk for aspiration?", "a": "A client with a below-the-knee amputation who reports incisional pain rated 6/10", "b": "A client with Parkinson's disease who coughs while drinking water and has a soft, gurgling voice after swallowing", "c": "A client with osteoarthritis who needs help transferring from bed to chair", "d": "A client with heart failure who has bilateral ankle edema at the end of the day", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 91, "q": "A nurse is assessing a client who became chilled after receiving several units of refrigerated IV fluids rapidly during emergency treatment. Which client response reflects the body's immediate attempt to conserve heat?", "a": "Peripheral vasoconstriction", "b": "Profuse sweating", "c": "Decreased muscle activity", "d": "Peripheral vasodilation", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 92, "q": "The nurse is caring for a client with syndrome of inappropriate antidiuretic hormone secretion (SIADH). Which provider prescription should the nurse expect?", "a": "Encourage oral free water intake", "b": "Restrict fluids", "c": "Administer hypotonic IV solution", "d": "Increase sodium restriction", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 93, "q": "A client with fluid volume excess is prescribed a 2-gram sodium diet. Which statement by the client indicates a need for further teaching?", "a": "I should check food labels for sodium content.", "b": "Processed meats may be high in sodium.", "c": "I can season food with lemon juice instead of salt.", "d": "Canned soup is usually a good low-sodium choice.", "correct": "D", "domain": "Physiological Adaptation"}, {"n": 94, "q": "During morning care, the nurse finds that a ventilated client's endotracheal tube has moved outward and the centimeter marking at the lip is different from the previous documented position. What should the nurse do first?", "a": "Reposition the tube back to the previous marking", "b": "Assess breath sounds, oxygenation, and secure the airway while notifying the provider or respiratory therapist", "c": "Deflate the cuff and advance the tube", "d": "Document the new position at the end of the shift", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 95, "q": "A client with asthma is receiving oxygen by simple face mask at 6 L/min. The client says, \"This mask feels suffocating,\" and the nurse notes the oxygen tubing has become disconnected from the wall source. Which action should the nurse take first?", "a": "Reconnect the oxygen tubing to the wall source", "b": "Remove the mask and notify the provider", "c": "Lower the flow rate to 2 L/min to reduce discomfort", "d": "Switch the client to a nasal cannula at 6 L/min", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 96, "q": "A client receiving peritoneal dialysis tells the nurse, \"My abdomen feels very full, and now I'm getting short of breath.\" Which action should the nurse take first?", "a": "Slow or stop the infusion and assess the client's respiratory status", "b": "Raise the head of the bed and encourage the client to take deep breaths", "c": "Obtain a prescribed pain medication for abdominal discomfort", "d": "Document that abdominal fullness is expected during peritoneal dialysis", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 97, "q": "A nurse is caring for a client with a tracheostomy who suddenly coughs out the outer tracheostomy tube. The client is in visible distress. What should the nurse do first?", "a": "Call the provider before touching the tracheostomy site", "b": "Attempt to insert the obturator and replace the tube per facility protocol", "c": "Cover the stoma with an occlusive dressing", "d": "Turn the client to the left side and wait for respiratory therapy", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 98, "q": "The nurse is teaching a new staff member about high-quality CPR for an adult. Which compression rate should the nurse include?", "a": "40 to 60 compressions/min", "b": "60 to 80 compressions/min", "c": "100 to 120 compressions/min", "d": "140 to 160 compressions/min", "correct": "C", "domain": "Physiological Adaptation"}, {"n": 99, "q": "The nurse is caring for a client with a Jackson-Pratt drain after surgery. Which action is appropriate when emptying the drain?", "a": "Compress the bulb before replacing the plug", "b": "Leave the bulb expanded to prevent tissue trauma", "c": "Irrigate the drain with sterile water after each emptying", "d": "Clamp the tubing for 2 hours after measurement", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 100, "q": "A nurse is caring for a client who is receiving a warming blanket after exposure to cold temperatures. Which finding indicates to the nurse that the client's thermoregulation is improving?", "a": "The client begins to shiver", "b": "The client reports feeling less drowsy and becomes more alert", "c": "The client's skin remains pale and cool", "d": "The client's heart rate decreases from 60/min to 48/min", "correct": "B", "domain": "Physiological Adaptation"}], ["Safety and Infection Prevention and Control", "Health Promotion and Maintenance", "Psychosocial Integrity", "Basic Care and Comfort", "Pharmacological Therapies", "Reduction of Risk Potential", "Physiological Adaptation", "Coordinated Care"]);</script>
