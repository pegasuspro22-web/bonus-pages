<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation Test 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#2a2419; --paper:#faf7f1; --raised:#ffffff; --line:#e6ddc9;
  --accent:#2f6f9e; --accent-ink:#ffffff; --alert:#b9791f; --alert-soft:#fbeed7;
  --danger:#b1483a; --correct:#3f9463; --muted:#5f574a; --muted-2:#7c7364;
  --shadow: 0 1px 2px rgba(42,36,25,.05), 0 10px 28px -14px rgba(42,36,25,.18);
}
*{box-sizing:border-box;}
body{background:var(--paper); color:var(--ink); font-family:'Public Sans',system-ui,sans-serif; margin:0; line-height:1.5; font-size:16.5px;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0; letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:inherit;} button{font-family:inherit; cursor:pointer;}
.page{max-width:640px; margin:0 auto; padding:3rem clamp(1.25rem,5vw,2rem) 4rem;}
.page.wide{max-width:880px;}
.back-link{font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--muted-2); text-decoration:none; display:inline-block; margin-bottom:1.5rem;}
.hero{text-align:center;}
.hero .eyebrow{display:flex; justify-content:center;}
.hero .lede{max-width:520px; margin-left:auto; margin-right:auto;}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600;}
.lede{color:var(--muted); font-size:1.05rem; line-height:1.6; margin-top:.9rem;}
.cta{
  display:inline-flex; align-items:center; gap:.5rem; background:var(--accent); color:var(--accent-ink);
  padding:1.05rem 2.1rem; border-radius:999px; font-weight:800; font-size:1rem; text-decoration:none; border:none;
  text-transform:uppercase; letter-spacing:.03em;
  box-shadow:0 6px 18px -4px color-mix(in srgb, var(--accent) 55%, transparent);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cta:hover{transform:translateY(-2px); box-shadow:0 10px 22px -4px color-mix(in srgb, var(--accent) 65%, transparent);}
.cta.ghost{background:var(--raised); color:var(--ink); border:2px solid var(--line); box-shadow:var(--shadow);}
.cta.ghost:hover{border-color:var(--accent); color:var(--accent);}
.cta.big{padding:1.25rem 2.6rem; font-size:1.08rem;}
.cta-wrap{display:flex; justify-content:center; align-items:center; margin-top:1.75rem; flex-direction:column; gap:.75rem;}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin:1.75rem 0;}
.stat{background:var(--raised); padding:1.1rem 1rem;}
.stat .n{font-family:'Fraunces',serif; font-size:1.9rem; font-weight:600;}
.stat .l{font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); margin-top:.2rem;}
.card-list{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line); margin-top:1.5rem;}
.card{padding:1.25rem 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:1.5rem; align-items:center;}
.card h3{font-size:1.05rem; font-weight:600; font-family:'Public Sans',sans-serif;}
.card p{color:var(--muted); font-size:.94rem; margin:.35rem 0 0; line-height:1.55;}
.tag{font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); background:var(--raised); border:2px solid var(--line); padding:.5rem .9rem; border-radius:999px; white-space:nowrap; text-decoration:none;}
.tag:hover{border-color:var(--accent);}
.step-list{counter-reset:step; margin:1.75rem 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:1.1rem;}
.step-list li{counter-increment:step; display:flex; gap:1rem; align-items:flex-start;}
.step-list li::before{
  content:counter(step); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.85rem;
  background:var(--ink); color:var(--paper); width:1.6rem; height:1.6rem; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:.1rem;
}
.step-list h3{font-size:1rem; font-weight:700; font-family:'Public Sans',sans-serif;}
.step-list p{color:var(--muted); font-size:.95rem; margin:.25rem 0 0; line-height:1.6;}
.action-block{margin-top:.9rem; display:flex; flex-wrap:wrap; align-items:center; gap:.7rem;}
.subject-chip{font-family:'IBM Plex Mono',monospace; font-size:.82rem; background:var(--paper); border:1.5px dashed var(--line); border-radius:8px; padding:.6rem .9rem; color:var(--ink);}
.subject-chip b{color:var(--accent);}
.callout{background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:1.75rem; box-shadow:var(--shadow); margin-top:1.75rem;}
.callout.alert{border-color:var(--alert); background:var(--alert-soft);}
.foot{margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--line); color:var(--muted-2); font-size:.78rem; line-height:1.6;}
.faq dt{font-weight:700; margin-top:1.1rem;}
.faq dd{margin:.35rem 0 0; color:var(--muted); font-size:.95rem; line-height:1.6;}
@media (max-width:520px){
  .card{flex-direction:column; align-items:flex-start; gap:.6rem;}
  .card > a.tag{align-self:stretch; text-align:center;}
}

.quiz-head{display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:1.25rem;}
.progress{font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--muted);}
.qcard{border:1px solid var(--line); border-radius:8px; padding:1.4rem; margin-top:1.25rem; background:var(--raised); box-shadow:var(--shadow);}
.qn{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--muted-2); display:flex; justify-content:space-between;}
.qtext{margin-top:.6rem; font-size:1rem; line-height:1.55; white-space:pre-wrap;}
.domain-pill{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.04em; text-transform:uppercase; background:var(--paper); border:1px solid var(--line); padding:.2rem .55rem; border-radius:3px; color:var(--muted);}
.opts{display:flex; flex-direction:column; gap:.55rem; margin-top:1.1rem;}
.opt{display:flex; gap:.7rem; align-items:flex-start; border:1px solid var(--line); border-radius:6px; padding:.65rem .8rem; font-size:.92rem; line-height:1.45;}
.opt input{margin-top:.25rem;} .letter{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--muted-2);}
.opt.correct{border-color:var(--correct); background:color-mix(in srgb, var(--correct) 14%, var(--raised));}
.opt.wrong{border-color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, var(--raised));}
.quiz-actions{display:flex; justify-content:center; margin-top:2rem; gap:.75rem;}
.score-panel{border:1px solid var(--line); border-radius:8px; padding:1.5rem; background:var(--raised); margin-top:1.25rem; box-shadow:var(--shadow);}
.score-big{font-family:'Fraunces',serif; font-size:2.4rem; font-weight:600;}
.domain-bars{display:flex; flex-direction:column; gap:.5rem; margin-top:1.25rem;}
.dbar-row{display:grid; grid-template-columns:minmax(120px,200px) 1fr 3.2rem; gap:.6rem; align-items:center; font-size:.82rem;}
.dbar-track{height:8px; background:var(--paper); border:1px solid var(--line); border-radius:4px; overflow:hidden;}
.dbar-fill{height:100%; background:var(--correct);}
.dname{color:var(--muted);} .dpct{font-family:'IBM Plex Mono',monospace; text-align:right; color:var(--muted-2);}
</style>
</head>
<body>

<div class="page wide">
  <div class="quiz-head">
    <div><div class="eyebrow">Self-hosted · no rationales shown</div><h1 style="font-size:1.5rem;">Simulation Test 3</h1></div>
    <span class="progress" id="quiz-progress"></span>
  </div>
  <div id="quiz-body"></div>
  <div class="quiz-actions">
    <button class="cta ghost" id="btn-reset" style="display:none;">Restart</button>
    <button class="cta" id="btn-submit">Submit test</button>
  </div>
  <div id="score-area"></div>
</div>
<script>
function runQuiz(questions, domainOrder){
  const body = document.getElementById('quiz-body');
  const answers = {};
  questions.forEach(function(q){
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = '<div class="qn"><span>Question ' + q.n + ' / ' + questions.length + '</span><span class="domain-pill">' + (q.domain||'') + '</span></div><div class="qtext"></div><div class="opts"></div>';
    card.querySelector('.qtext').textContent = q.q;
    const opts = card.querySelector('.opts');
    ['a','b','c','d'].forEach(function(letter){
      const label = document.createElement('label');
      label.className = 'opt';
      label.dataset.letter = letter.toUpperCase();
      label.innerHTML = '<input type="radio" name="q' + q.n + '" value="' + letter.toUpperCase() + '"><span><span class="letter">' + letter.toUpperCase() + '.</span> <span class="opttext"></span></span>';
      label.querySelector('.opttext').textContent = q[letter];
      label.querySelector('input').addEventListener('change', function(){ answers[q.n] = letter.toUpperCase(); updateProgress(); });
      opts.appendChild(label);
    });
    body.appendChild(card);
  });
  function updateProgress(){
    document.getElementById('quiz-progress').textContent = Object.keys(answers).length + ' / ' + questions.length + ' answered';
  }
  updateProgress();
  document.getElementById('btn-submit').addEventListener('click', function(){
    let correct = 0;
    const byDomain = {};
    questions.forEach(function(q){
      const given = answers[q.n];
      const isCorrect = given === q.correct;
      if(isCorrect) correct++;
      const d = q.domain || 'Other';
      byDomain[d] = byDomain[d] || {correct:0,total:0};
      byDomain[d].total++;
      if(isCorrect) byDomain[d].correct++;
      const card = document.querySelectorAll('.qcard')[q.n-1];
      card.querySelectorAll('.opt').forEach(function(opt){
        opt.querySelector('input').disabled = true;
        if(opt.dataset.letter === q.correct) opt.classList.add('correct');
        else if(opt.dataset.letter === given) opt.classList.add('wrong');
      });
    });
    const pct = Math.round((correct/questions.length)*100);
    const scoreArea = document.getElementById('score-area');
    let bars = '';
    domainOrder.filter(function(d){return byDomain[d];}).forEach(function(d){
      const s = byDomain[d];
      const p = Math.round((s.correct/s.total)*100);
      bars += '<div class="dbar-row"><span class="dname">' + d + '</span><div class="dbar-track"><div class="dbar-fill" style="width:' + p + '%"></div></div><span class="dpct">' + s.correct + '/' + s.total + '</span></div>';
    });
    scoreArea.innerHTML = '<div class="score-panel"><div class="eyebrow">Result \u2014 no rationales shown, readiness signal only</div><div class="score-big">' + correct + ' / ' + questions.length + ' <span style="font-size:1.1rem; color:var(--muted); font-family:\'Public Sans\',sans-serif; font-weight:500;">(' + pct + '%)</span></div><div class="domain-bars">' + bars + '</div></div>';
    document.getElementById('btn-submit').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'inline-flex';
    scoreArea.scrollIntoView({behavior:'smooth', block:'nearest'});
  });
  document.getElementById('btn-reset').addEventListener('click', function(){ window.location.reload(); });
}

runQuiz([{"n": 1, "q": "A client with limited English proficiency is brought to the preprocedure area. The client’s bilingual teenage grandchild says, “I can interpret everything.” The client appears anxious and keeps looking between the staff and grandchild. What is the nurse’s best action?", "a": "Use the grandchild because it will be faster and more comfortable for the client", "b": "Delay important communication until a qualified interpreter can be used", "c": "Speak louder in simple English while the grandchild explains difficult words", "d": "Ask the client to sign now and review details after the procedure with an interpreter", "correct": "B", "domain": "Coordinated Care"}, {"n": 2, "q": "A competent adult client is scheduled for surgery. After the provider has explained the procedure and the client has signed consent, the client tells the nurse, \"I've changed my mind. I don't want it done.\" What should the nurse do first?", "a": "Tell the client it is too late to refuse because the form is already signed", "b": "Notify the provider and stop further preparation for the procedure", "c": "Ask the family to help persuade the client to continue", "d": "Send the client to surgery and let the surgeon discuss it there", "correct": "B", "domain": "Coordinated Care"}, {"n": 3, "q": "An assistive personnel (AP) tells the practical nurse, “I emptied 900 mL from the client’s Foley bag in 2 hours, and the urine looks much darker than it did this morning.” Which response by the nurse is best?", "a": "“Document the amount and color, and I will assess the client now.”", "b": "“Offer the client more oral fluids the next time you enter the room.”", "c": "“Clamp the tubing for 30 minutes and then recheck the output.”", "d": "“This can happen after the bag gets full, so continue routine care.”", "correct": "A", "domain": "Coordinated Care"}, {"n": 4, "q": "A practical nurse is caring for a client who is 1 day postoperative after abdominal surgery. The client has not walked since surgery. During the morning assessment, the nurse notes pain 8/10 with movement, dizziness when sitting at the bedside, and a blood pressure drop from 128/76 mm Hg lying to 102/64 mm Hg standing. Physical therapy is scheduled to arrive in 15 minutes. What is the nurse's best action to support interdisciplinary information sharing?", "a": "Wait for physical therapy to assess the client and then read the therapist's note later.", "b": "Assist the client back to bed and promptly notify the RN and physical therapist of the client's pain, dizziness, and orthostatic blood pressure change before therapy begins.", "c": "Encourage the client to continue with therapy because early ambulation is expected after surgery.", "d": "Document the findings in the chart and discuss them with the provider at the next routine rounds.", "correct": "B", "domain": "Coordinated Care"}, {"n": 5, "q": "A practical nurse is assigned to an older adult client whose daughter says, \"Do not tell my mother she has cancer. It would upset her too much.\" The client is alert and asks, \"What did the biopsy show?\" What should the nurse do first?", "a": "Tell the daughter she must leave the room", "b": "Explain to the client that the family requested privacy", "c": "Assess whether the provider has discussed the results with the client", "d": "Change the subject to avoid causing emotional distress", "correct": "C", "domain": "Coordinated Care"}, {"n": 6, "q": "A practical nurse is directing care with help from an assistive personnel (AP) in a rehabilitation unit. Which task is most appropriate to delegate to the AP?", "a": "Determine whether a client with a new ankle-foot orthosis can transfer safely from bed to wheelchair", "b": "Reinforce discharge teaching for a client who will use a walker at home", "c": "Assist a stable client who has already been assessed with grooming after breakfast", "d": "Evaluate whether a client's hand-strength exercises are improving fine motor function", "correct": "C", "domain": "Coordinated Care"}, {"n": 7, "q": "A practical nurse is caring for four clients in a skilled nursing facility with help from one assistive personnel (AP). Which task is most appropriate for the nurse to assign to the AP?", "a": "Reinforce teaching to a client newly prescribed compression stockings", "b": "Perform passive range-of-motion exercises for a client with stable contractures", "c": "Assess a client's report of new burning pain at an incision site", "d": "Evaluate the effectiveness of a PRN analgesic given 45 minutes earlier", "correct": "B", "domain": "Coordinated Care"}, {"n": 8, "q": "A practical nurse delegates routine morning care to an assistive personnel (AP) for several stable clients. Which client should the nurse instruct the AP to report immediately if that client requests to use the bathroom?\n\nA. A client with a new prescription for a stool softener\nB. A client with a history of chronic constipation\nC. A client who had a sedative 20 minutes ago and is drowsy\nD. A client scheduled for physical therapy later in the morning", "a": "A client with a new prescription for a stool softener", "b": "A client with a history of chronic constipation", "c": "A client who had a sedative 20 minutes ago and is drowsy", "d": "A client scheduled for physical therapy later in the morning", "correct": "C", "domain": "Coordinated Care"}, {"n": 9, "q": "A practical nurse is assigned to a client who says, \"I do not want any students or observers in my room today.\" A student nurse arrives with the instructor and says, \"We only need five minutes.\" What should the practical nurse do?", "a": "Explain that teaching is part of the facility's mission, so the client must cooperate", "b": "Honor the client's request and inform the instructor that the client declined", "c": "Allow the group to enter if no hands-on care is planned", "d": "Ask the family to persuade the client to help with student learning", "correct": "B", "domain": "Coordinated Care"}, {"n": 10, "q": "At the end of a shift, a practical nurse realizes that 0900 wound drainage was estimated as 20 mL in the chart, but the actual amount measured was 70 mL. Which documentation action is most appropriate?", "a": "Delete the original note and enter the correct amount without explanation", "b": "Enter a late correction according to policy, clearly identifying the error and the accurate finding", "c": "Leave the record unchanged because correcting it may create legal problems", "d": "Ask the next shift nurse to chart the corrected amount as a new assessment", "correct": "B", "domain": "Coordinated Care"}, {"n": 11, "q": "A practical nurse is contributing to an interdisciplinary care conference for a client with Parkinson disease who has had repeated coughing during meals. Which information is most important for the nurse to share with the team?", "a": "The client prefers to eat dinner later in the evening", "b": "The client has been coughing with thin liquids and takes much longer to finish meals", "c": "The client's spouse usually brings in the client's favorite soup from home", "d": "The client says the hospital food does not taste good", "correct": "B", "domain": "Coordinated Care"}, {"n": 12, "q": "A practical nurse in a community clinic is caring for a 14-year-old client who came in for treatment of abdominal pain. During the visit, the client quietly says, \"My mom's boyfriend hit my little brother with a belt last night. He has marks on his back. Please don't tell anyone because he'll get mad.\" Which action by the nurse is most appropriate?", "a": "Respect the client's request for confidentiality because the information involves another family member", "b": "Tell the client to have the brother come to the clinic so the nurse can decide whether abuse occurred", "c": "Report the suspected child abuse according to agency policy and document the client's statement objectively", "d": "Wait to report until the nurse can speak directly with the client's mother and confirm the story", "correct": "C", "domain": "Coordinated Care"}, {"n": 13, "q": "A pediatric clinic wants to improve completion of routine childhood immunizations by 24 months of age. Review of records shows that many children miss vaccines after their 12-month visit because follow-up appointments are not scheduled before families leave the clinic. The team tests a new process in which staff schedule the next vaccine visit before checkout. Which measure is the best process measure for this quality improvement project?", "a": "The percentage of eligible children who leave the clinic with their next vaccine appointment scheduled", "b": "The number of children in the community who develop vaccine-preventable illnesses", "c": "The percentage of children fully immunized by 24 months of age", "d": "The number of parents who say they are satisfied with the clinic overall", "correct": "A", "domain": "Coordinated Care"}, {"n": 14, "q": "A client with newly diagnosed seizure disorder is preparing for discharge. The client says, \"I can still bathe in the tub when I'm home, as long as I keep the bathroom door unlocked.\" Which response by the nurse is best?", "a": "That is fine if someone checks on you every 30 minutes.", "b": "You should avoid bathing until your follow-up visit.", "c": "Showers are generally safer than tub baths because of the risk of injury if a seizure occurs.", "d": "Use the tub only on days when you feel rested.", "correct": "C", "domain": "Coordinated Care"}, {"n": 15, "q": "A client who is deaf is scheduled for a nonemergency cardiac catheterization. The provider arrives with the consent form, and the client's spouse says, \"I can explain everything in sign language for my partner.\" Which action by the nurse is most appropriate?", "a": "Allow the spouse to interpret because family members know the client best", "b": "Ask the client to read the form and sign if ready", "c": "Request a qualified interpreter so the provider can obtain informed consent directly from the client", "d": "Witness the signature if the spouse states the client understands", "correct": "C", "domain": "Coordinated Care"}, {"n": 16, "q": "A practical nurse in a pediatric clinic is reinforcing an asthma action plan with a parent who has a hearing impairment and communicates primarily through American Sign Language. The child has had two recent emergency visits for asthma flare-ups. Which action by the nurse best promotes equitable access to care?", "a": "Ask the child's older sibling to explain the asthma plan at home", "b": "Provide the parent with written instructions only and speak slowly while facing the parent", "c": "Arrange for a qualified sign language interpreter during teaching and follow-up communication", "d": "Delay teaching until the parent brings a friend who can help interpret", "correct": "C", "domain": "Coordinated Care"}, {"n": 17, "q": "A practical nurse is delegating tasks to an assistive personnel (AP) in an assisted-living facility. Which task is most appropriate for the nurse to assign to the AP?", "a": "Teach a client how to use an incentive spirometer after pneumonia", "b": "Reinforce discharge instructions about a new insulin regimen", "c": "Measure and record the weight of a stable client with chronic heart failure", "d": "Assess a client who reports new burning pain with urination", "correct": "C", "domain": "Coordinated Care"}, {"n": 18, "q": "A practical nurse is caring for a client admitted for severe nausea, vomiting, and dehydration. During the shift, the nurse notes the client has had only 100 mL of urine output in 8 hours, dry mucous membranes, and dizziness when standing. The provider plans possible discharge later today if the client tolerates oral fluids. Which information should the nurse communicate to the interdisciplinary team to best support safe care planning?", "a": "The client prefers apple juice instead of broth and says the room is too warm", "b": "The client has persistent signs of dehydration, very low urine output, and orthostatic dizziness despite the planned discharge", "c": "The client asked whether discharge paperwork will take a long time to complete", "d": "The client watched television most of the morning and slept after lunch", "correct": "B", "domain": "Coordinated Care"}, {"n": 19, "q": "During interdisciplinary rounds, the practical nurse reports that a client with delirium was calm overnight after receiving a PRN sedative. Which additional information is most important for the nurse to include to avoid misleading the team?", "a": "The client used to work night shift before retirement.", "b": "The client slept 6 hours without asking for a snack.", "c": "The client became difficult to arouse this morning and required extensive assistance to take oral medications safely.", "d": "The family was pleased the client was quieter overnight.", "correct": "C", "domain": "Coordinated Care"}, {"n": 20, "q": "A client is being prepared for an elective procedure and has a signed consent form in the chart. During the preprocedure assessment, the nurse determines that the client is disoriented and cannot explain the procedure in any meaningful way. Which action is most appropriate?", "a": "Proceed because the form is already signed and filed", "b": "Ask the unlicensed assistive personnel to verify the signature with the client", "c": "Hold the procedure and notify the provider of the change in decision-making capacity", "d": "Re-explain the procedure quickly and have the client sign a new form", "correct": "C", "domain": "Coordinated Care"}, {"n": 21, "q": "A practical nurse is assigned to four clients in a skilled nursing facility. Which client should the nurse assess first?\n\nA. A client with Parkinson disease who is 20 minutes late for a scheduled dose of carbidopa-levodopa\nB. A client with heart failure who gained 2 lb since yesterday and reports increased shortness of breath when lying flat\nC. A client with chronic venous insufficiency who has dry, flaky skin on both lower legs\nD. A client with a healed stroke who wants assistance calling a family member", "a": "A client with Parkinson disease who is 20 minutes late for a scheduled dose of carbidopa-levodopa", "b": "A client with heart failure who gained 2 lb since yesterday and reports increased shortness of breath when lying flat", "c": "A client with chronic venous insufficiency who has dry, flaky skin on both lower legs", "d": "A client with a healed stroke who wants assistance calling a family member", "correct": "B", "domain": "Coordinated Care"}, {"n": 22, "q": "A nurse is preparing to obtain a capillary blood sample for bedside glucose testing from a client who is confused and unable to state their name. The electronic chart is open in the room, and the client's daughter says, \"This is my father, James Turner.\" Which action should the nurse take to identify the client correctly before performing the test?", "a": "Use the daughter's statement and proceed with the glucose test", "b": "Confirm the client's identity using the identification band and another facility-approved identifier", "c": "Rely on the electronic chart displayed in the room because it matches the assigned bed", "d": "Ask another nurse who cared for the client earlier to verify that this is James Turner", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 23, "q": "The practical nurse is removing gloves after emptying a urinary drainage bag. Which action is most important to prevent transmission of microorganisms?", "a": "Clean the drainage spout with sterile water", "b": "Remove gloves quickly to reduce contact time", "c": "Perform hand hygiene immediately after glove removal", "d": "Place the gloves in a linen hamper", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 24, "q": "A nurse is preparing to use a mechanical lift to move a client from bed to chair. The client suddenly becomes restless and says, \"I don't feel secure in this sling.\" Which action should the nurse take first?", "a": "Continue the transfer quickly to reduce the client's anxiety", "b": "Pause the transfer and reassess sling placement and attachment points", "c": "Lower the client into the chair even if alignment is off", "d": "Tell the client the sling always feels uncomfortable at first", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 25, "q": "A nurse preparing to administer 2100 medications scans a client's wristband and sees an alert that the medication administration record already shows the same sedative as given 15 minutes earlier by another nurse. The client is awake, reports not remembering whether the pill was taken, and shows no signs of oversedation. Which action is most appropriate?", "a": "Administer the medication now so the client does not miss the scheduled dose", "b": "Hold the medication, assess the client, verify whether the dose was actually given, notify the appropriate nurse or provider as needed, and complete an incident report per facility policy", "c": "Ask the client to decide whether to take the medication based on how sleepy the client feels", "d": "Document the medication as refused and return the sedative to the dispensing system", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 26, "q": "A practical nurse is assisting with tracheostomy care for a client who has thick secretions. During the procedure, the nurse uses clean gloves to remove the soiled inner cannula and then plans to open a sterile replacement package. Which action best maintains infection control?", "a": "Keep the same gloves on to avoid interrupting the procedure", "b": "Remove the gloves, perform hand hygiene, and handle the sterile package with clean technique before applying new gloves as needed", "c": "Wipe the gloved hands with sterile saline before touching the new package", "d": "Ask the client to hold the package open to save time", "correct": "B", "domain": "Safety and Infection Prevention and Control"}, {"n": 27, "q": "A practical nurse is preparing a sterile field for a central line dressing change. After opening the sterile drape correctly, the nurse notices a small tear near the center of the drape that was not visible on the outside of the package. Which action should the nurse take?", "a": "Cover the tear with a sterile towel and continue setting up the field", "b": "Use the drape if the tear does not touch the supplies", "c": "Discard the drape and obtain a new sterile drape", "d": "Avoid using the torn area and place supplies only around the edges", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 28, "q": "A fire alarm sounds on a long-term care unit. A client who uses a wheelchair is closest to the area where smoke is visible under a door. Which action is most appropriate?", "a": "Move the client away from the smoke area to a safer location", "b": "Wait in the room until the exact source of the fire is confirmed", "c": "Finish passing medications before helping with evacuation", "d": "Open the door with smoke under it to see how large the fire is", "correct": "A", "domain": "Safety and Infection Prevention and Control"}, {"n": 29, "q": "A practical nurse is preparing to move a client with varicella from the room to the treatment area for an urgent procedure. Which action is most appropriate during transport?", "a": "Place a surgical mask on the client and keep any skin lesions covered if possible", "b": "Have the client wear sterile gloves during transport", "c": "Ask transport staff to open the room door early to improve air circulation", "d": "Remove the client's isolation restrictions once the client leaves the room", "correct": "A", "domain": "Safety and Infection Prevention and Control"}, {"n": 30, "q": "A nurse is checking a client's IV pump and finds that the infusion is running faster than prescribed because the pump was programmed incorrectly. Which action should the nurse take first?", "a": "Document the total amount infused and continue to monitor", "b": "Reprogram the pump to the prescribed rate", "c": "Stop and assess the client, then correct the infusion setup", "d": "Wait until the next scheduled assessment to notify the provider", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 31, "q": "A client with suspected pulmonary tuberculosis is admitted to the unit. Which PPE should the nurse use when entering the client's room?", "a": "Surgical mask", "b": "Face shield", "c": "N95 respirator", "d": "Clean gloves", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 32, "q": "A practical nurse is preparing to obtain a sputum specimen from a client who has no isolation orders. The client is alert but has a frequent productive cough, and the nurse expects secretions may spray during collection. Which action best follows standard precautions?", "a": "Wear gloves and a face shield during specimen collection", "b": "Wear sterile gloves to prevent contamination of the specimen", "c": "Place the client in a negative-pressure room before obtaining the sample", "d": "Skip gloves if the specimen cup can be held by the client", "correct": "A", "domain": "Safety and Infection Prevention and Control"}, {"n": 33, "q": "A practical nurse on a medical-surgical unit is checking client rooms after housekeeping waxed the hallway floor. The nurse notes these conditions: a call light cord hanging off one bed, an overbed table locked in place, a yellow \"wet floor\" sign posted at one end of the hall, and a client returning from the bathroom wearing nonskid socks and stepping onto a still-glossy section of floor. Which action should the nurse take first?", "a": "Help the client back to bed or to a dry area away from the slippery floor", "b": "Move the call light cord onto the bed within the client's reach", "c": "Unlock the overbed table so it can be repositioned later", "d": "Place an additional wet floor sign at the opposite end of the hallway", "correct": "A", "domain": "Safety and Infection Prevention and Control"}, {"n": 34, "q": "A nurse enters a client's allergy information into the health record. Which documentation is most useful for future safety checks?", "a": "“Allergic to antibiotics”", "b": "“Medication allergy present”", "c": "“Penicillin allergy—rash and facial swelling after first dose 2 years ago”", "d": "“Bad reaction to medicine in the past”", "correct": "C", "domain": "Safety and Infection Prevention and Control"}, {"n": 35, "q": "A nurse is caring for a hospitalized preschooler. Which activity is most appropriate to help meet this child's developmental needs?", "a": "Providing a picture book and allowing make-believe play", "b": "Encouraging participation in a peer-led sports competition", "c": "Assigning a detailed journal about feelings and future goals", "d": "Offering complex strategy board games with strict rules", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 36, "q": "A parent asks the nurse what self-care skill is reasonable to expect from a healthy 5-year-old. Which response is best?", "a": "The child should be able to prepare full meals independently", "b": "The child should still require total help with dressing", "c": "The child may be able to dress independently except for complex fasteners", "d": "The child should consistently manage all hygiene needs without reminders", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 37, "q": "A practical nurse is admitting an adult client with severe scoliosis. Which documentation best establishes a baseline respiratory assessment for future comparison during the stay?", "a": "Client denies shortness of breath at this time", "b": "Respirations 20/min, diminished breath sounds at bilateral bases, uses 2 pillows to sleep at home, oxygen saturation 93% on room air", "c": "Chest x-ray completed in the emergency department", "d": "Breathing appears comfortable after admission", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 38, "q": "A nurse is reinforcing teaching with the parent of a 6-month-old infant about expected developmental progress. Which statement by the parent indicates understanding?", "a": "My baby should be able to sit steadily without support for long periods.", "b": "My baby may begin to transfer a toy from one hand to the other.", "c": "My baby should be able to speak several clear words.", "d": "My baby will likely be ready for daytime toilet training.", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 39, "q": "A nurse is reinforcing teaching with the parent of a 12-year-old child about expected physical changes of puberty. Which finding should the nurse identify as an expected early change in girls?", "a": "Breast budding", "b": "Voice deepening", "c": "Facial hair growth", "d": "Broadening of the shoulders", "correct": "A", "domain": "Health Promotion and Maintenance"}, {"n": 40, "q": "A nurse is preparing preoperative teaching for a client who is in severe pain, has limited English proficiency, and wears hearing aids. Which nursing plan best reduces communication barriers?", "a": "Teach immediately so all barriers are addressed at once before surgery", "b": "Ask a family member to translate while the client rests with hearing aids removed", "c": "Manage pain, ensure the hearing aids are functioning, and use a qualified interpreter for the teaching", "d": "Postpone all teaching until after surgery because communication is too difficult now", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 41, "q": "A practical nurse is reinforcing teaching for the parent of an 11-year-old who recently began menstruating and seems embarrassed to talk about it. Which parental statement indicates a need for further teaching?", "a": "\"I'll answer questions honestly and keep the conversation calm.\"", "b": "\"I'll explain that body changes can happen at different ages and still be normal.\"", "c": "\"I'll avoid bringing it up unless my child asks first, because talking about it may increase anxiety.\"", "d": "\"I'll provide supplies and privacy while staying available for support.\"", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 42, "q": "A client at 22 weeks of pregnancy reports a painful, swollen right calf. Which response by the nurse is most appropriate?", "a": "Rest with the leg elevated and mention it at the next prenatal visit", "b": "Massage the area several times a day to improve circulation", "c": "Seek immediate evaluation for the calf pain and swelling", "d": "Apply ice and continue normal activity if the pain improves", "correct": "C", "domain": "Health Promotion and Maintenance"}, {"n": 43, "q": "A nurse is preparing to teach a client about a newly prescribed low-fat diet. The client says, \"I left my dentures at home, and my mouth hurts when I chew.\" Which interpretation is most accurate?", "a": "The client is refusing to learn", "b": "The client has a physical comfort issue that may interfere with learning", "c": "The client has a language barrier that prevents teaching", "d": "The client is demonstrating adequate readiness to learn", "correct": "B", "domain": "Health Promotion and Maintenance"}, {"n": 44, "q": "A hospitalized older adult with dementia becomes increasingly agitated during the evening, pulls at the bedsheets, and says, \"People keep walking through my room.\" The practical nurse notes glare from the hallway, a loud television, and several unfamiliar staff entering and leaving the room. Which action is most appropriate first?", "a": "Ask the client to explain exactly what is being seen so the nurse can reorient the client", "b": "Reduce environmental stimulation by dimming glare, lowering noise, and limiting unnecessary traffic in the room", "c": "Tell the client firmly that no one is in the room and the behavior must stop", "d": "Apply a restraint to prevent the client from pulling at the bedsheets", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 45, "q": "A nurse is reviewing a chart before entering a client's room. The admission record lists the client's legal name as Daniel, but a note from triage states, \"Preferred name: Dani; pronouns: he/him.\" What should the nurse do when greeting the client?", "a": "Address the client as Daniel until the legal record is changed", "b": "Ask the client in front of the roommate which name the staff should use", "c": "Greet the client as Dani and use he/him pronouns unless the client requests otherwise", "d": "Avoid using any name or pronouns to prevent making a mistake", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 46, "q": "A client who identifies as transgender is admitted for treatment of asthma exacerbation. While reviewing the medication history, the nurse notes a hormone medication that is not listed on the admitting provider's initial orders. The client says, \"I was afraid to mention it because people get weird about it.\" Which nursing response is best?", "a": "“You should wait and discuss that medication only with the provider during rounds.”", "b": "“Tell me the name, dose, and schedule of the medication so I can document it and help make sure the provider is aware.”", "c": "“If it is not related to your breathing problem, it is probably not important right now.”", "d": "“Bring in the bottle later so we can decide whether you still need to take it.”", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 47, "q": "A nurse is caring for an older adult client whose family members answer every question before the client can speak. The client is alert and oriented. What is the nurse's best action?", "a": "Direct all questions to the family because they are more comfortable speaking", "b": "Privately assess the client's preference for family involvement while continuing to address the client directly", "c": "Tell the family to leave immediately because they are interfering", "d": "Assume the client has given up decision-making to the family", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 48, "q": "A client with newly diagnosed ulcerative colitis tells the nurse, \"Every time my symptoms flare up, I cancel plans, stop eating with my family, and stay in my room so no one sees me.\" Which response by the nurse is most appropriate to promote effective coping?", "a": "“You should try not to think about your illness so much when symptoms get worse.”", "b": "“What situations during a flare feel hardest for you, and what has helped you manage stress in the past?”", "c": "“It is best to avoid other people until your symptoms are completely under control.”", "d": "“If you keep a positive attitude, these feelings will probably go away on their own.”", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 49, "q": "A client who identifies as a transgender man is being admitted for cellulitis. During the interview, the client says, \"I bind my chest every day, even when I'm sick, because I panic if I don't.\" Which response by the nurse is best?", "a": "“You should stop doing that because it is unhealthy.”", "b": "“Tell me more about how binding affects your comfort and whether you are having any trouble breathing or skin irritation.”", "c": "“We can discuss that later after the admission questions are finished.”", "d": "“Most clients find it easier to avoid binding while hospitalized.”", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 50, "q": "During morning care, a client becomes tearful and says, \"I used to pray every day, but now I feel abandoned.\" Which finding is the nurse identifying?", "a": "Ineffective airway clearance", "b": "Risk for violence", "c": "Spiritual distress", "d": "Sensory-perceptual alteration", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 51, "q": "A client with hearing impairment becomes increasingly anxious during admission questioning. The nurse notices the client answers unrelated questions with \"yes\" and grips the bedrail tightly. Which action is best?", "a": "Continue the interview so the admission can be completed on time", "b": "Ask the client to sign the forms now and complete teaching later", "c": "Pause and assess the client's preferred communication method before proceeding", "d": "Speak much louder so the client can hear every question clearly", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 52, "q": "A nurse is caring for a client who recently had a stroke. During feeding assistance, the client’s spouse says, \"In our family, it is disrespectful to question the doctor, so please do not ask my husband to choose between treatment options.\" The client is alert, able to communicate, and has been making needs known appropriately. Which action by the nurse is most appropriate?", "a": "Avoid discussing choices with the client and direct all treatment questions to the spouse", "b": "Explain that the client must make all decisions alone without family input", "c": "Ask the client how they prefer health information and decisions to be handled, then support that preference", "d": "Tell the spouse that cultural beliefs cannot be considered during hospital care", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 53, "q": "A nurse in an outpatient mental health program is leading a small group when one client suddenly stands up, kicks a chair, and begins shouting, \"Nobody here listens to me!\" The client is breathing rapidly and moving toward another client. Which action should the nurse take first?", "a": "Tell the client that this behavior is unacceptable and that privileges will be restricted", "b": "Position the nurse near the exit and speak to the client in a calm, clear voice", "c": "Ask the other group members to explain why they disagree with the client", "d": "Move close to the client and place a hand on the client's shoulder", "correct": "B", "domain": "Psychosocial Integrity"}, {"n": 54, "q": "A client with newly diagnosed chronic obstructive pulmonary disease says to the practical nurse, \"I get short of breath just walking to the bathroom. I feel scared all the time now.\" Which response by the nurse best provides emotional support?", "a": "You need to stay calm because anxiety will only make your breathing worse.", "b": "Many people learn to live with this condition, so try not to think about it too much.", "c": "It sounds like these changes are frightening for you. Tell me more about what worries you most.", "d": "Let me teach you the breathing exercises your provider prescribed.", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 55, "q": "A client with hearing impairment is learning about a new treatment plan. Which nursing action best promotes therapeutic communication?", "a": "Stand behind the client to reduce distractions", "b": "Speak rapidly to cover all information before the client tires", "c": "Face the client and use short, simple sentences", "d": "Repeat each statement in a louder voice if the client hesitates", "correct": "C", "domain": "Psychosocial Integrity"}, {"n": 56, "q": "A practical nurse is caring for a client who has been on bed rest for several days. Which action is most effective for helping prevent pressure injury formation?", "a": "Massage reddened areas over bony prominences each shift", "b": "Reposition the client at regular intervals and keep pressure off bony areas", "c": "Place the client in a high-Fowler position most of the day", "d": "Use a donut-shaped cushion under the sacrum", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 57, "q": "A nurse is caring for a client receiving total parenteral nutrition (TPN) through a central venous catheter. A new bag of TPN has not arrived from the pharmacy, and the current bag is almost empty. Which action should the nurse take while waiting?", "a": "Discontinue the infusion and flush the line with heparinized saline", "b": "Hang 0.9% sodium chloride at the same rate", "c": "Hang 10% dextrose in water at the prescribed rate", "d": "Clamp the line until the new TPN bag is available", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 58, "q": "A nurse is caring for a client who is receiving continuous enteral feeding through a nasogastric tube. During assessment, the nurse notes abdominal distention and the client reports nausea. Which action should the nurse take first?", "a": "Slow the feeding rate and continue to monitor the client", "b": "Stop the feeding and assess tube placement and feeding tolerance", "c": "Administer an antiemetic as prescribed and resume the feeding", "d": "Irrigate the tube with sterile water to improve flow", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 59, "q": "A nurse is caring for a client with a mature gastrostomy tube who receives intermittent feedings. When the nurse arrives to give the next feeding, the external bumper is pressing tightly against the skin, and the tissue around the stoma is swollen and painful. Which action is most appropriate?", "a": "Loosen the external bumper slightly and reassess the stoma site", "b": "Clean the area with hydrogen peroxide and apply a tighter dressing", "c": "Advance the tube 2 cm farther into the stomach and secure it", "d": "Begin the feeding as prescribed because mild swelling is expected", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 60, "q": "A nurse is preparing to insert a straight urinary catheter for a female client. Which action is appropriate to reduce the risk of introducing infection?", "a": "Use clean gloves after opening the catheter kit", "b": "Cleanse the perineal area from front to back", "c": "Place the lubricant on the catheter after insertion begins", "d": "Allow the catheter tip to touch the client's thigh before insertion", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 61, "q": "A nurse is caring for a client with a gastrostomy tube whose skin around the stoma is moist, reddened, and tender. Which intervention is most appropriate?", "a": "Apply occlusive tape tightly around the tube", "b": "Cleanse and dry the site, then protect the skin from leakage", "c": "Rotate the tube repeatedly to stop the redness", "d": "Stop all feedings permanently", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 62, "q": "A client with heart failure is on strict intake and output. Which action by the practical nurse is most important to improve the accuracy of the client's output measurement during the shift?", "a": "Estimate urine volume in the toilet based on the amount seen", "b": "Ask the client to void in a calibrated collection hat placed in the toilet", "c": "Record output only at the end of the shift to avoid repeated calculations", "d": "Subtract 50 mL from each void to account for normal measurement variation", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 63, "q": "A nurse is caring for a client who is on a scheduled bowel program after a spinal cord injury. The client usually has a bowel movement every other morning after breakfast. Today, the nurse needs to help the client achieve the most effective evacuation. Which action is best?", "a": "Offer a bedpan at bedtime to avoid interrupting the morning routine", "b": "Administer the bowel intervention at a different time each day to prevent dependence", "c": "Assist the client to the toilet or commode after breakfast at the usual time", "d": "Encourage the client to remain in bed during the bowel program to conserve energy", "correct": "C", "domain": "Basic Care and Comfort"}, {"n": 64, "q": "A nurse is caring for a client receiving continuous enteral feeding through a nasogastric tube. The client is scheduled for a chest x-ray and will be transported off the unit. Which action by the nurse is most appropriate during transport?", "a": "Clamp the tube and stop the feeding until the client returns", "b": "Lower the head of the bed to make the client more comfortable during movement", "c": "Ask transport staff to monitor the tube placement during the trip", "d": "Increase the feeding rate before transport so the client receives the full prescribed volume", "correct": "A", "domain": "Basic Care and Comfort"}, {"n": 65, "q": "A practical nurse is caring for a client who has reduced peripheral sensation in the hands after chemotherapy. During hygiene care, which action is most appropriate to help prevent injury?", "a": "Test the water temperature with the client's hand before washing", "b": "Use warm water and verify the temperature with a bath thermometer or the nurse's inner wrist", "c": "Soak the client's hands in hot water to improve circulation", "d": "Massage the hands vigorously if the client reports numbness", "correct": "B", "domain": "Basic Care and Comfort"}, {"n": 66, "q": "A provider prescribes 240 mL of IV fluid to infuse over 3 hours using microdrip tubing calibrated at 60 gtt/mL. What is the correct flow rate?", "a": "60 gtt/min", "b": "75 gtt/min", "c": "80 gtt/min", "d": "90 gtt/min", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 67, "q": "A nurse is preparing to administer 12 units of regular insulin subcutaneously. The vial label reads U-100. Which action best supports medication rights?", "a": "Use a tuberculin syringe to improve accuracy", "b": "Use an insulin syringe calibrated for U-100 insulin", "c": "Draw up the insulin in a 3-mL syringe with a 22-gauge needle", "d": "Measure 0.12 mL in a standard medication syringe", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 68, "q": "A nurse is preparing medications for a home health client and finds a bottle of sublingual nitroglycerin tablets that the client transferred into a weekly plastic pill organizer for convenience. Which action by the nurse is most appropriate?", "a": "Tell the client to keep using the organizer as long as the tablets stay dry", "b": "Return the tablets to their original container and teach the client to store them there", "c": "Refrigerate the pill organizer between doses to help preserve the tablets", "d": "Discard the tablets only if they are chipped, discolored, or expired", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 69, "q": "The nurse is teaching a client who will self-administer insulin at home. Which statement by the client requires immediate correction?", "a": "I will rotate injection sites within the same general area.", "b": "If I feel shaky or sweaty, I will check my blood glucose if I can.", "c": "I can reuse my friend's unopened insulin pen needles if they look clean.", "d": "I will keep track of my blood glucose results to discuss at follow-up visits.", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 70, "q": "A client with seizure disorder has been taking phenytoin for 2 weeks. Which new finding should the nurse report to the provider immediately as a possible serious adverse response?", "a": "Mild gingival swelling while brushing teeth", "b": "Unsteady gait and slurred speech", "c": "Decreased appetite at lunchtime", "d": "Occasional difficulty falling asleep", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 71, "q": "A client is scheduled to receive the next dose of metformin. Which newly reviewed data should the nurse question before administration?", "a": "The client ate 75% of breakfast", "b": "The client walked in the hall this morning", "c": "The client had iodinated contrast for a CT scan earlier today", "d": "The client's fasting glucose yesterday was 168 mg/dL", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 72, "q": "A client receives phenytoin for seizure control. The nurse notes a phenytoin level of 24 mcg/mL. Which nursing action is most appropriate?", "a": "Give the medication because seizure drugs should never be delayed", "b": "Hold the dose and notify the provider", "c": "Administer the drug with an antacid to protect the stomach", "d": "Double-check the route and then proceed with administration", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 73, "q": "A nurse is teaching a client who is starting metformin for newly diagnosed type 2 diabetes mellitus. Which instruction should the nurse include?", "a": "Take the medication on an empty stomach first thing in the morning.", "b": "Stop taking the medication if your blood glucose becomes normal for 2 days.", "c": "Take the medication with meals to reduce stomach upset.", "d": "Expect the medication to cause weight gain within the first week.", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 74, "q": "A nurse is caring for a client who has a transdermal fentanyl patch in place for chronic pain. The client reports increased back pain and says, \"I put a heating pad over my patch so the medicine will work faster.\" Which response by the nurse is best?", "a": "Leave the heating pad in place because warmth improves absorption without increasing risk", "b": "Remove the heating pad because heat can increase fentanyl absorption and cause toxicity", "c": "Apply a second fentanyl patch on a different site while using the heating pad", "d": "Cover the patch with a thick dressing so the medication stays in the skin longer", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 75, "q": "A nurse obtains a verbal order over the phone for a high-alert medication during an urgent situation. Which action best helps protect medication rights at the time the order is received?", "a": "Write down the order and administer it immediately without repeating it back", "b": "Repeat the order back to the prescriber for verification and clarify any unclear parts", "c": "Ask another nurse to decide what dose sounds most appropriate", "d": "Wait until the prescriber arrives later to confirm whether the order was correct", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 76, "q": "A client is to be discharged with a prescription for a controlled opioid. Which statement by the client shows correct understanding of safe storage at home?", "a": "I'll keep the pills in the bathroom medicine cabinet so they are easy to find", "b": "I'll store the medication in a secure place away from children and visitors", "c": "I'll put the medication on the kitchen counter so I remember to take it", "d": "I'll combine the new pills with my old pain pills in one bottle", "correct": "B", "domain": "Pharmacological Therapies"}, {"n": 77, "q": "A nurse is preparing to administer morphine to a postoperative patient who needs continuous pain control over the next 24 hours without repeated injections. Which route of administration best meets this goal?", "a": "Transdermal", "b": "Intramuscular", "c": "Intravenous infusion", "d": "Topical", "correct": "C", "domain": "Pharmacological Therapies"}, {"n": 78, "q": "A nurse is infusing 960 mL of IV fluid over 12 hours using an infusion pump. Six hours after the infusion begins, the nurse notes that 520 mL remains in the bag. To deliver the full prescribed amount on time, what rate should the nurse set for the remaining infusion?", "a": "70 mL/hr", "b": "73 mL/hr", "c": "80 mL/hr", "d": "87 mL/hr", "correct": "D", "domain": "Pharmacological Therapies"}, {"n": 79, "q": "A provider prescribes a serum peak level for an intramuscular antibiotic. To help obtain a meaningful result, when should the nurse plan to collect the specimen?", "a": "Immediately before the next dose", "b": "At the same time the medication is administered", "c": "After the medication has had time to reach its highest blood concentration", "d": "Any time during the dosing interval", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 80, "q": "A client with cirrhosis has increasing abdominal girth and shortness of breath. Which focused assessment is most important for the nurse to perform next?", "a": "Measure abdominal circumference and assess for shifting dullness", "b": "Ask the client which foods are usually eaten on weekends", "c": "Review the client's childhood vaccination record", "d": "Determine whether the client prefers a private room", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 81, "q": "A nurse is preparing to place precordial electrodes for a 12-lead ECG. Correct placement of lead V1 is at which location?", "a": "Fourth intercostal space at the right sternal border", "b": "Fourth intercostal space at the left sternal border", "c": "Fifth intercostal space at the left midclavicular line", "d": "Fifth intercostal space at the left anterior axillary line", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 82, "q": "A client suddenly becomes unresponsive while on telemetry. The monitor shows a regular wide-complex rhythm at 170/min. No pulse is palpated. Which interpretation best fits this situation?", "a": "Stable supraventricular tachycardia", "b": "Pulseless ventricular tachycardia", "c": "Sinus tachycardia with artifact", "d": "Atrial fibrillation with aberrancy", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 83, "q": "A nurse obtains a blood specimen and then notices swelling at the puncture site while the needle is still in the vein. Which interpretation is most accurate?", "a": "The specimen is clotting in the tube", "b": "The client is having a vasovagal reaction", "c": "Blood is leaking into the surrounding tissue", "d": "The tourniquet was released too early", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 84, "q": "A client with a newly inserted peripheral IV catheter is receiving an antibiotic infusion. A few minutes after the infusion begins, the client reports itching and burning at the site. The nurse notes swelling and a small amount of fluid leaking around the insertion site, but the skin is warm rather than cool. Which complication is most likely occurring?", "a": "Infiltration", "b": "Phlebitis", "c": "Local allergic reaction to the dressing", "d": "Extravasation", "correct": "D", "domain": "Reduction of Risk Potential"}, {"n": 85, "q": "A client receiving enteral feedings through a small-bore nasoenteric tube suddenly begins coughing during the feeding and has an oxygen saturation drop from 96% to 90%. Which action should the nurse take first?", "a": "Slow the feeding rate and continue to monitor the client", "b": "Stop the feeding and check tube placement", "c": "Irrigate the tube with 30 mL of water", "d": "Place the client flat to reduce abdominal cramping", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 86, "q": "A client is in the postanesthesia period after receiving IV opioids for pain. Which assessment finding requires the most immediate nursing action?", "a": "Pain rating of 7 out of 10", "b": "Respiratory rate of 8/min and difficult to arouse", "c": "Blood pressure of 148/88 mm Hg", "d": "Nausea with one small emesis", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 87, "q": "A nurse reviews a rhythm strip for a client who reports mild palpitations. The strip shows an irregularly irregular rhythm, no distinct P waves, and narrow QRS complexes. Which rhythm should the nurse identify?", "a": "Atrial fibrillation", "b": "Sinus arrhythmia", "c": "First-degree AV block", "d": "Ventricular tachycardia", "correct": "A", "domain": "Reduction of Risk Potential"}, {"n": 88, "q": "A practical nurse is obtaining morning vital signs on an adult client. The radial pulse feels weak and uneven. Which action should the nurse take to obtain the most accurate heart rate?", "a": "Count the radial pulse for 15 seconds and multiply by 4", "b": "Count the apical pulse for 1 full minute", "c": "Use the pulse oximeter reading as the heart rate", "d": "Ask the client to take several deep breaths, then recount the radial pulse", "correct": "B", "domain": "Reduction of Risk Potential"}, {"n": 89, "q": "A client with bacterial meningitis is hospitalized on a medical unit. Which observation should the practical nurse identify as the greatest safety risk that requires immediate action?\n\nA. The client asks that the lights be dimmed\nB. The client's family leaves used tissues on the bedside table\nC. The client reports neck pain rated 6 out of 10\nD. The side rails are padded, but suction equipment is not set up in the room", "a": "The client asks that the lights be dimmed", "b": "The client's family leaves used tissues on the bedside table", "c": "The client reports neck pain rated 6 out of 10", "d": "The side rails are padded, but suction equipment is not set up in the room", "correct": "D", "domain": "Reduction of Risk Potential"}, {"n": 90, "q": "A client who has been receiving prolonged nasogastric suction has arterial blood gas results of pH 7.48, PaCO2 47 mm Hg, and HCO3- 34 mEq/L. How should the nurse interpret these findings?", "a": "Uncompensated metabolic acidosis", "b": "Partially compensated respiratory alkalosis", "c": "Metabolic alkalosis with respiratory compensation", "d": "Respiratory acidosis with metabolic compensation", "correct": "C", "domain": "Reduction of Risk Potential"}, {"n": 91, "q": "During CPR, the team lead asks the nurse to consider reversible causes of the client's pulseless arrest. Which finding most strongly suggests hypovolemia as a possible cause?", "a": "Distended neck veins and unequal breath sounds", "b": "History of major gastrointestinal bleeding and cool, pale skin before collapse", "c": "Missed dialysis with peaked T waves before arrest", "d": "Sudden pleuritic chest pain after prolonged immobility", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 92, "q": "A client with a newly implanted permanent pacemaker is on telemetry. During morning care, the nurse sees small pacing spikes occurring regularly, but several of the spikes appear after the QRS complex instead of before it. The client is awake and says, \"My heart feels like it's skipping,\" but vital signs are stable. Which pacemaker problem should the nurse identify?", "a": "Failure to capture", "b": "Failure to sense", "c": "Failure to pace", "d": "Normal demand pacing", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 93, "q": "A client receiving total parenteral nutrition has a sudden infusion pump failure, and the solution has been stopped for 45 minutes while a replacement pump is obtained. Which assessment finding is the nurse's priority to monitor during this interruption?", "a": "Bounding peripheral pulses", "b": "Symptomatic hypoglycemia", "c": "Elevated serum calcium", "d": "Dependent edema", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 94, "q": "A nurse is caring for a client with a large open wound that requires packing. Which action is most important when applying the packing material?", "a": "Pack the wound tightly to eliminate all dead space", "b": "Moisten the packing and place it loosely into the wound", "c": "Cut one long strip into several small pieces before insertion", "d": "Cover only the wound bed and leave the surrounding skin exposed", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 95, "q": "A client is admitted with chest pain and is placed on continuous cardiac monitoring. Which nursing action helps ensure the most accurate monitoring data?", "a": "Apply electrodes over bony prominences to limit movement", "b": "Use lotion on the chest before attaching electrodes", "c": "Prepare the skin and replace loose electrodes promptly", "d": "Turn off monitor alarms during routine care", "correct": "C", "domain": "Physiological Adaptation"}, {"n": 96, "q": "A nurse is assessing a chronic leg ulcer and notes tissue that is yellow, stringy, and loosely attached in the wound bed. How should the nurse document this finding?", "a": "Eschar", "b": "Slough", "c": "Granulation tissue", "d": "Epithelial tissue", "correct": "B", "domain": "Physiological Adaptation"}, {"n": 97, "q": "A client on mechanical ventilation becomes suddenly agitated. The ventilator's low exhaled-volume alarm sounds, and the nurse hears air leaking around the client's mouth. Which action should the nurse take first?", "a": "Reposition and secure the endotracheal tube, then reassess ventilator function", "b": "Increase the fraction of inspired oxygen on the ventilator", "c": "Suction the airway using sterile technique", "d": "Administer a prescribed sedative PRN", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 98, "q": "A client with chronic kidney disease returns from hemodialysis and reports feeling dizzy. Which assessment finding most strongly suggests the dizziness is related to fluid removal during dialysis?", "a": "Blood pressure decreased from 148/86 mm Hg before dialysis to 98/60 mm Hg after dialysis", "b": "Temperature increased from 98.4°F to 99.1°F", "c": "Urine output increased from 100 mL to 180 mL over 8 hours", "d": "Serum potassium increased from 4.2 mEq/L to 4.5 mEq/L", "correct": "A", "domain": "Physiological Adaptation"}, {"n": 99, "q": "A client with end-stage kidney disease is receiving hemodialysis through a left forearm arteriovenous fistula. Which finding during routine assessment should the practical nurse recognize as the highest priority to report immediately?", "a": "The client reports mild fatigue after today's treatment", "b": "The fistula site has a palpable thrill and an audible bruit", "c": "The left hand is cool and pale with numbness reported by the client", "d": "A small area of bruising is present near the access site from the last treatment", "correct": "C", "domain": "Physiological Adaptation"}, {"n": 100, "q": "A client with asthma suddenly develops severe respiratory distress after exposure to cigarette smoke. The nurse notes audible wheezing, use of accessory muscles, and inability to speak more than one-word answers. A few minutes later, the wheezing becomes much quieter, and breath sounds are barely audible bilaterally. Which interpretation is most appropriate?", "a": "The bronchospasm is resolving because airflow is improving", "b": "The client is becoming exhausted and may be progressing to respiratory failure", "c": "The client is having a panic attack rather than an asthma exacerbation", "d": "Secretions are loosening, which commonly makes wheezing less noticeable", "correct": "B", "domain": "Physiological Adaptation"}], ["Safety and Infection Prevention and Control", "Health Promotion and Maintenance", "Psychosocial Integrity", "Basic Care and Comfort", "Pharmacological Therapies", "Reduction of Risk Potential", "Physiological Adaptation", "Coordinated Care"]);</script>
